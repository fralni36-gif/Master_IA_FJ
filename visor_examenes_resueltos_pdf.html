ar una red neuronal profunda\nB Combinar múltiples árboles de decisión ✓ RESPUESTA CO\nRRECTA\nCRedu\ncir dimensionalidad\nDOptimizar hiperparámetros\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl principio fundacional de Random Forest (Breiman, 2001) es construir un ensamble robusto combinando una\nm\nultitud de árboles de decisión no podados, introdu\nciendo una doble aleatoriedad: rem\nuestreo con reemplazo\nde las observaciones (bagging) y selección aleatoria de un sub\nconjunto de características (feature subspace) en\ncada división de nodo (Diapositivas Tema 10, pág. 7). Esto descorrelaciona los árboles y desploma la varianza.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A se refiere al deep learning. Distractor C se refiere a proyección o extracción de características. Distractor\nD se refiere a ajuste de hiperparámetros.", "title": "TAA Tema 10: Random Forest Test Oficial · Pregunta 30 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 30 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "30. ¿Cu"}, {"type": "paragraph", "text": "ál es el principio fundamental de random forest?"}, {"type": "paragraph", "text": "A Entrenar una red neuronal profunda"}, {"type": "paragraph", "text": "B Combinar múltiples árboles de decisión ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "CRedu cir dimensionalidad"}, {"type": "paragraph", "text": "DOptimizar hiperparámetros"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El principio fundacional de Random Forest (Breiman, 2001) es construir un ensamble robusto combinando unam ultitud de árboles de decisión no podados, introdu ciendo una doble aleatoriedad: rem uestreo con reemplazo de las observaciones (bagging) y selección aleatoria de un sub conjunto de características (feature subspace) en cada división de nodo (Diapositivas Tema 10, pág. 7). Esto descorrelaciona los árboles y desploma la varianza."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A se refiere al deep learning. Distractor C se refiere a proyección o extracción de características. Distractor"}, {"type": "paragraph", "text": "D se refiere a ajuste de hiperparámetros."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_32.jpg", "height": 1188, "page": 32, "text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 31 +0.75 pts / -0.25 pts\n31. ¿Cómo se obtiene la predicción final en clasificación en random forest?\nA Promedio de probabilidades\nB Selección aleatoria\nC Voto mayoritario ✓ RESPUESTA CO\nRRECTA\nDRegresión lineal\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEn tareas de clasificación,\nRandom Forest consolida las predicciones individuales de todos los árboles de\ndecisión individuales mediante un mecanismo de agregación por voto mayoritario (hard voting) o promediando\nlas distribu\nciones de probabilidad predichas por cada árbol (soft voting) y asignando la clase con mayor\npromedio (Diapositivas Tema 10, pág. 14).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor B (selección aleatoria) destruiría el poder predictivo del ensamble. Distractor D confunde clasificación con\nun modelo lineal continuo.", "title": "TAA Tema 10: Random Forest Test Oficial · Pregunta 31 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 31 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "31. ¿Cómo se obtiene la predicción final en clasificación en random forest?"}, {"type": "paragraph", "text": "A Promedio de probabilidades"}, {"type": "paragraph", "text": "B Selección aleatoria"}, {"type": "paragraph", "text": "C Voto mayoritario ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "DRegresión lineal"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "En tareas de clasificación,"}, {"type": "paragraph", "text": "Random Forest consolida las predicciones individuales de todos los árboles de decisión individuales mediante un mecanismo de agregación por voto mayoritario (hard voting) o promediando las distribu ciones de probabilidad predichas por cada árbol (soft voting) y asignando la clase con mayor promedio (Diapositivas Tema 10, pág. 14)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor B (selección aleatoria) destruiría el poder predictivo del ensamble. Distractor D confunde clasificación con un modelo lineal continuo."}]}, {"text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 32 +0.75 pts / -0.25 pts\n32. ¿Qu\né representa el out-of-bag error?\nA Error en datos de entrenamiento\nB Error en validación cruzada\nC Error estimado usando datos no utilizados en el entrenamiento ✓ RESPUESTA CO\nRRECTA\nD Error absoluto medio\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl error Out-Of-Bag (OOB Error) es una estimación no sesgada del error de generalización calculada evaluando\ncada árbol del bosq\nue únicamente sobre aq\nuellas instancias del conjunto de datos original q\nue NO fueron\nincluidas en su respectiva m\nuestra bootstrap (aproximadamente el 36.8% de los datos q\nueda 'out-of-bag' en\ncada m\nuestra) (Diapositivas Tema 10, pág. 22; Breiman, 1996). Hace innecesaria una validación cruzada externa\nindependiente.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A confunde OOB con error de entrenamiento empírico. Distractor B confunde OOB con K-fold cross-\nvalidation. Distractor D confunde el concepto metodológico con una métrica de regresión específica.", "page": 33, "image": "./examenes_resueltos_master_ia_pages/page_33.jpg", "width": 918, "height": 1188, "title": "TAA Tema 10: Random Forest Test Oficial · Pregunta 32 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 32 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "32. ¿Qu"}, {"type": "paragraph", "text": "é representa el out-of-bag error?"}, {"type": "paragraph", "text": "A Error en datos de entrenamiento"}, {"type": "paragraph", "text": "B Error en validación cruzada"}, {"type": "paragraph", "text": "C Error estimado usando datos no utilizados en el entrenamiento ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Error absoluto medio"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El error Out-Of-Bag (OOB Error) es una estimación no sesgada del error de generalización calculada evaluando cada árbol del bosq ue únicamente sobre aq uellas instancias del conjunto de datos original q ue NO fueron incluidas en su respectiva m uestra bootstrap (aproximadamente el 36.8% de los datos q ueda 'out-of-bag' en cada m uestra) (Diapositivas Tema 10, pág. 22; Breiman, 1996). Hace innecesaria una validación cruzada externa independiente."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A confunde OOB con error de entrenamiento empírico. Distractor B confunde OOB con K-fold crossvalidation. Distractor D confunde el concepto metodológico con una métrica de regresión específica."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_34.jpg", "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 33 +0.75 pts / -0.25 pts\n33. ¿Qu\né son los hiperparámetros?\nA Parámetros aprendidos del modelo\nB Parámetros definidos antes del entrenamiento ✓ RESPUESTA CO\nRRECTA\nC Variables dependientes del dataset\nDM\nétricas de evaluación\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLos hiperparámetros son configuraciones externas, propiedades estru\ncturales o parámetros de control q\nue son\ndefinidos y fijados por el científico de datos antes de iniciar el proceso de entrenamiento del modelo (por\nejemplo, el parámetro C en SVM\n, la profundidad máxima max_depth en un árbol o el número de estimadores en\nun bosq\nue) (Diapositivas Tema 11, pág. 6). A diferencia de los parámetros internos, no se aprenden directamente\noptimizando la función de pérdida con los datos.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe los parámetros internos del modelo (como los pesos w de una regresión o los u\nmbrales de\ndivisión del árbol). Distractor C describe variables del dataset. Distractor D describe funciones de evaluación.", "page": 34, "width": 918, "height": 1188, "title": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 33 +0.75 pts ", "blocks": [{"type": "paragraph", "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 33 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "33. ¿Qu"}, {"type": "paragraph", "text": "é son los hiperparámetros?"}, {"type": "paragraph", "text": "A Parámetros aprendidos del modelo"}, {"type": "paragraph", "text": "B Parámetros definidos antes del entrenamiento ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Variables dependientes del datasetDM"}, {"type": "paragraph", "text": "étricas de evaluación"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "Los hiperparámetros son configuraciones externas, propiedades estru cturales o parámetros de control q ue son definidos y fijados por el científico de datos antes de iniciar el proceso de entrenamiento del modelo (por ejemplo, el parámetro C en SVM"}, {"type": "paragraph", "text": ", la profundidad máxima max_depth en un árbol o el número de estimadores en un bosq ue) (Diapositivas Tema 11, pág. 6). A diferencia de los parámetros internos, no se aprenden directamente optimizando la función de pérdida con los datos."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe los parámetros internos del modelo (como los pesos w de una regresión o los u mbrales de división del árbol). Distractor C describe variables del dataset. Distractor D describe funciones de evaluación."}]}, {"width": 918, "height": 1188, "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 34 +0.75 pts / -0.25 pts\n34. ¿Cu\nál es la característica principal del grid search?\nA Explora aleatoriamente los parámetros\nBRealiza una búsq\nueda parcial\nC Evalúa todas las combinaciones posibles ✓ RESPUESTA CO\nRRECTA\nDUsa aprendizaje automático\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa característica distintiva y definitoria del método Grid Search (búsq\nueda en rejilla) es q\nue realiza una\nevaluación exhaustiva y determinista de todas y cada una de las combinaciones posibles en el produ\ncto\ncartesiano de los valores discretos predefinidos para los hiperparámetros especificados (Diapositivas Tema 11,\npág. 14).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe Random Search. Distractor B describe métodos heurísticos o de poda. Distractor D confunde un\nprocedimiento de optimización iterativo con un modelo de M\nL predictivo en sí mismo.", "page": 35, "image": "./examenes_resueltos_master_ia_pages/page_35.jpg", "title": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 34 +0.75 pts ", "blocks": [{"type": "paragraph", "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 34 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "34. ¿Cu"}, {"type": "paragraph", "text": "ál es la característica principal del grid search?"}, {"type": "paragraph", "text": "A Explora aleatoriamente los parámetros"}, {"type": "paragraph", "text": "BRealiza una búsq ueda parcial"}, {"type": "paragraph", "text": "C Evalúa todas las combinaciones posibles ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "DUsa aprendizaje automático"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La característica distintiva y definitoria del método Grid Search (búsq ueda en rejilla) es q ue realiza una evaluación exhaustiva y determinista de todas y cada una de las combinaciones posibles en el produ cto cartesiano de los valores discretos predefinidos para los hiperparámetros especificados (Diapositivas Tema 11, pág. 14)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe Random Search. Distractor B describe métodos heurísticos o de poda. Distractor D confunde un procedimiento de optimización iterativo con un modelo de M"}, {"type": "paragraph", "text": "L predictivo en sí mismo."}]}, {"height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_36.jpg", "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 35 +0.75 pts / -0.25 pts\n35. ¿Cu\nál es la ventaja de random search sobre grid search?\nA Siempre encuentra la mejor solu\nción\nBRedu\nce el número de hiperparámetros\nC Es más eficiente en espacios de alta dimensión ✓ RESPUESTA CO\nRRECTA\nD No req\nuiere evaluación\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa gran ventaja matemática y comp\nutacional de Random Search (Bergstra & Bengio, 2012) sobre Grid Search\nradica en su eficiencia drásticamente su\nperior cuando se optimizan espacios de hiperparámetros de alta\ndimensión o cuando solo unos pocos hiperparámetros son verdaderamente influyentes (Diapositivas Tema 11,\npág. 21). Al m\nuestrear aleatoriamente, explora un número m\nu\ncho mayor de valores únicos para cada dimensión\ncon el mismo presu\np\nuesto de evaluaciones.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A es falso: ningún método aleatorio garantiza encontrar siempre el óptimo global exacto en tiempo finito.\nDistractor B es falso: no redu\nce el número de hiperparámetros. Distractor D es absurdo, p\nues Random Search evalúa\ncada configuración mediante validación cruzada.", "width": 918, "page": 36, "title": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 35 +0.75 pts ", "blocks": [{"type": "paragraph", "text": "TAA Tema 11: Parametrización y Optimización de Algoritmos Test Oficial · Pregunta 35 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "35. ¿Cu"}, {"type": "paragraph", "text": "ál es la ventaja de random search sobre grid search?"}, {"type": "paragraph", "text": "A Siempre encuentra la mejor solu ción"}, {"type": "paragraph", "text": "BRedu ce el número de hiperparámetros"}, {"type": "paragraph", "text": "C Es más eficiente en espacios de alta dimensión ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D No req uiere evaluación"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La gran ventaja matemática y comp utacional de Random Search (Bergstra & Bengio, 2012) sobre Grid Search radica en su eficiencia drásticamente su perior cuando se optimizan espacios de hiperparámetros de alta dimensión o cuando solo unos pocos hiperparámetros son verdaderamente influyentes (Diapositivas Tema 11, pág. 21). Al m uestrear aleatoriamente, explora un número mu cho mayor de valores únicos para cada dimensión con el mismo presup uesto de evaluaciones."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A es falso: ningún método aleatorio garantiza encontrar siempre el óptimo global exacto en tiempo finito."}, {"type": "paragraph", "text": "Distractor B es falso: no redu ce el número de hiperparámetros. Distractor D es absurdo, p ues Random Search evalúa cada configuración mediante validación cruzada."}]}, {"page": 37, "width": 918, "height": 1188, "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 36 +0.75 pts / -0.25 pts\n36. ¿Cu\nál es la principal diferencia entre un diagrama de dispersión y una matriz de\ndiagramas de dispersión?\nA El diagrama de dispersión permite comparar dos variables, mientras q\nue la\nmatriz de diagramas de dispersión permite comparar varias variables entre sí\nmediante gráficos por pares.\n✓ RESPUESTA CO\nRRECTA\nB El diagrama de dispersión m\nuestra la relación entre dos variables, mientras q\nue la matriz de diagramas de\ndispersión resu\nme esas relaciones usando únicamente coeficientes nu\nméricos.\nC El diagrama de dispersión se utiliza cuando hay pocas observaciones, mientras q\nue la matriz de diagramas\nde dispersión se utiliza solo cuando el conjunto de datos tiene m\nu\nchas observaciones.\nD El diagrama de dispersión representa una relación concreta entre dos variables, mientras q\nue la matriz de\ndiagramas de dispersión representa la evolu\nción temporal de varias variables en paralelo.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl diagrama de dispersión clásico (bivariante) enfrenta visualmente dos variables nu\nméricas en los ejes X e Y\npara identificar correlación o agru\npación entre ese par concreto. En contraste, la matriz de diagramas de\ndispersión (Scatter Plot Matrix o pairplot) organiza una cuadrícula matricial de N x N donde cada celda interior\nproyecta el diagrama de dispersión bivariante entre todos los pares posibles de variables nu\nméricas\nm\nultivariantes del conjunto de datos (y las distribu\nciones univariantes en la diagonal principal) (Diapositivas\nTema 2, pág. 28).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor B afirma falsamente q\nue la matriz usa solo coeficientes nu\nméricos (eso sería una matriz de correlación o\nheatmap, no una matriz de gráficos). Distractor C es falso porq\nue ambas herramientas se usan en datasets de\ndiversos tamaños. Distractor D confunde la matriz m\nultivariable con gráficos de series temporales.", "image": "./examenes_resueltos_master_ia_pages/page_37.jpg", "title": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 36 +0.75", "blocks": [{"type": "paragraph", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 36 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "36. ¿Cu"}, {"type": "paragraph", "text": "ál es la principal diferencia entre un diagrama de dispersión y una matriz de diagramas de dispersión?"}, {"type": "paragraph", "text": "A El diagrama de dispersión permite comparar dos variables, mientras q ue la matriz de diagramas de dispersión permite comparar varias variables entre sí mediante gráficos por pares."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "B El diagrama de dispersión m uestra la relación entre dos variables, mientras q ue la matriz de diagramas de dispersión resu me esas relaciones usando únicamente coeficientes nu méricos."}, {"type": "paragraph", "text": "C El diagrama de dispersión se utiliza cuando hay pocas observaciones, mientras q ue la matriz de diagramas de dispersión se utiliza solo cuando el conjunto de datos tiene mu chas observaciones."}, {"type": "paragraph", "text": "D El diagrama de dispersión representa una relación concreta entre dos variables, mientras q ue la matriz de diagramas de dispersión representa la evolu ción temporal de varias variables en paralelo."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El diagrama de dispersión clásico (bivariante) enfrenta visualmente dos variables nu méricas en los ejes X e Y para identificar correlación o agru pación entre ese par concreto. En contraste, la matriz de diagramas de dispersión (Scatter Plot Matrix o pairplot) organiza una cuadrícula matricial de N x N donde cada celda interior proyecta el diagrama de dispersión bivariante entre todos los pares posibles de variables nu méricasm ultivariantes del conjunto de datos (y las distribu ciones univariantes en la diagonal principal) (Diapositivas"}, {"type": "paragraph", "text": "Tema 2, pág. 28)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor B afirma falsamente q ue la matriz usa solo coeficientes nu méricos (eso sería una matriz de correlación o heatmap, no una matriz de gráficos). Distractor C es falso porq ue ambas herramientas se usan en datasets de diversos tamaños. Distractor D confunde la matriz m ultivariable con gráficos de series temporales."}]}, {"page": 38, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_38.jpg", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Ejercicio Oficial de Cálculo (Clasificación) TAA-EJ-01\nMatriz de Confusión y Métricas de Rendimiento (Filtro Anti-Spam)\nImaginad q\nue se os presenta la siguiente base de datos con 10 correos electrónicos evaluados por un clasificador\nbinario (Clase Positiva = Spam, Clase Negativa = No spam):\n| Email | Clase Real | Clase Predicha |\n|:---|:---|:---|\n| Email 1 | Spam | Spam |\n| Email 2 | Spam | Spam |\n| Email 3 | No spam | No spam |\n| Email 4 | Spam | No spam |\n| Email 5 | No spam | Spam |\n| Email 6 | No spam | No spam |\n| Email 7 | Spam | Spam |\n| Email 8 | No spam | No spam |\n| Email 9 | No spam | No spam |\n| Email 10 | Spam | No spam |\nA partir de esta tabla de observaciones:\n1. Construya la matriz de confusión detallada identificando TP, TN, FP y FN.\n2. Calcule las métricas: Exactitud (Accuracy), Precisión (Precision), Sensibilidad (Recall), Especificidad (Specificity) y\nPuntuación F1 (F1-Score) para la clase Spam.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Constru\ncción de la Matriz de Confusión: Definimos formalmente: • Verdaderos Positivos (TP): Real =\nSpam, Predicho = Spam -> Emails 1, 2 y 7 -> TP = 3. • Verdaderos Negativos (TN): Real = No spam, Predicho =\nNo spam -> Emails 3, 6, 8 y 9 -> TN = 4. • Falsos Positivos (FP - Error Tipo I): Real = No spam, Predicho =\nSpam -> Email 5 -> FP = 1. • Falsos Negativos (FN - Error Tipo II): Real = Spam, Predicho = No spam -> Emails\n4 y 10 -> FN = 2. • Total de observaciones = N = 10 (Total Reales Spam = TP + FN = 5; Total Reales No spam =\nTN + FP = 5).\nClase Real \\ Predicción Predicho: Spam (Positivo) Predicho: No spam (Negativo) Total Real\nReal: Spam (Positivo) TP = 3 FN = 2 P = 5\nReal: No spam (Negativo) FP = 1 TN = 4 N = 5\nTotal Predicho 3 + 1 = 4 2 + 4 = 6 Total = 10\n2. Cálculo analítico de métricas de rendimiento: • Exactitud (Accuracy): $$Accuracy = \\frac{TP + TN}{N} =\n\\frac{3 + 4}{10} = \\frac{7}{10} = 0.7000 \\q\nuad (70.0\\%)$$ • Precisión (Precision / Positive Predictive Value):\n$$Precision = \\frac{TP}{TP + FP} = \\frac{3}{3 + 1} = \\frac{3}{4} = 0.7500 \\q\nuad (75.0\\%)$$ • Sensibilidad (Recall\n/ Sensibilidad / True Positive Rate): $$Recall = \\frac{TP}{TP + FN} = \\frac{3}{3 + 2} = \\frac{3}{5} = 0.6000 \\q\nuad\n(60.0\\%)$$ • Especificidad (Specificity / True Negative Rate): $$Specificity = \\frac{TN}{TN + FP} = \\frac{4}{4\n+ 1} = \\frac{4}{5} = 0.8000 \\q\nuad (80.0\\%)$$ • Puntuación F1 (F1-Score / Media armónica entre Precisión y\nRecall): $$F_1 = 2 \\cdot \\frac{Precision \\cdot Recall}{Precision + Recall} = 2 \\cdot \\frac{0.75 \\cdot 0.60}{0.75 +\n0.60} = 2 \\cdot \\frac{0.45}{1.35} = \\frac{0.90}{1.35} = \\frac{2}{3} \\approx 0.6667 \\q\nuad (66.67\\%)$$ • Exactitud", "width": 918, "title": "TAA Tema 5: 5}{1.35} = \\frac{0.90}{1.35} = \\frac{2}{3} \\approx 0.6667 \\q uad (66.67\\%)$$ • Exactitud"}]}, {"page": 39, "height": 1188, "text": "Eq\nuilibrada (Balanced Accuracy): $$Balanced\\;Accuracy = \\frac{Recall + Specificity}{2} = \\frac{0.60 + 0.80}{2}\n= 0.7000 \\q\nuad (70.0\\%)$$\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nLas métricas de evaluación de clasificación se derivan unívocamente de la descomposición formal de aciertos y\nerrores en la matriz de confusión (Diapositivas Tema 5, págs. 11-18; Prof.\nª María Flores Ceballos). En tareas de\nfiltrado anti-spam o detección de anomalías, la precisión mide la fiabilidad de las alertas generadas (evitar\nclasificar un correo legítimo como spam), mientras q\nue el recall mide la cobertura de detección de correos\nmaliciosos reales. La media armónica F1 penaliza desproporcionadamente cuando cualq\nuiera de las dos métricas\nfundamentales se desploma.\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR\nTrampa clásica de examen: Confundir el denominador de la Precisión (TP + FP = total de predicciones positivas) con el\ndenominador del Recall (TP + FN = total de casos verdaderamente positivos en la realidad). En este ejercicio, 3/4 =\n0.75 vs 3/5 = 0.60. Si se calculan al revés, se pierde la totalidad del p\nuntaje nu\nmérico del ejercicio.", "width": 918, "image": "./examenes_resueltos_master_ia_pages/page_39.jpg", "title": "Eq uilibrada (Balanced Accuracy): $$Balanced\\;Accuracy = \\frac{Recall + Specificity}{2} = \\frac", "blocks": [{"type": "paragraph", "text": "Eq uilibrada (Balanced Accuracy): $$Balanced\\;Accuracy = \\frac{Recall + Specificity}{2} = \\frac{0.60 + 0.80}{2}"}, {"type": "paragraph", "text": "= 0.7000 \\q uad (70.0\\%)$$"}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "Las métricas de evaluación de clasificación se derivan unívocamente de la descomposición formal de aciertos y errores en la matriz de confusión (Diapositivas Tema 5, págs. 11-18; Prof."}, {"type": "paragraph", "text": "ª María Flores Ceballos). En tareas de filtrado anti-spam o detección de anomalías, la precisión mide la fiabilidad de las alertas generadas (evitar clasificar un correo legítimo como spam), mientras q ue el recall mide la cobertura de detección de correos maliciosos reales. La media armónica F1 penaliza desproporcionadamente cuando cualq uiera de las dos métricas fundamentales se desploma."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}, {"type": "paragraph", "text": "Trampa clásica de examen: Confundir el denominador de la Precisión (TP + FP = total de predicciones positivas) con el denominador del Recall (TP + FN = total de casos verdaderamente positivos en la realidad). En este ejercicio, 3/4 ="}, {"type": "paragraph", "text": "0.75 vs 3/5 = 0.60. Si se calculan al revés, se pierde la totalidad del p untaje nu mérico del ejercicio."}]}, {"width": 918, "text": "TAA Tema 8: Clasificación con Naïve Bayes Ejercicio Oficial de Cálculo (Probabilidad y Bayes) TAA-EJ-02\nInferencia Bayesiana y Probabilidad a Posteriori Clínica\nUn hospital está construyendo un modelo para detectar si un paciente tiene una enfermedad respiratoria (E) o no (N)\nusando dos síntomas: tos y fiebre. Se está desarrollando un modelo de clasificación utilizando Naïve Bayes para\npredecir si una persona está enferma o no. Se ha calculado la tabla de verosimilitud para los síntomas tos y fiebre\nsobre una m\nuestra de 100 pacientes (20 enfermos y 80 no enfermos). Los resultados se presentan a continuación:\nDiagnóstico\nTos Fiebre\nTotal Clase\nSí No Sí No\nEnfermo (E) 4/20 16/20 10/20 10/20 20\nNo enfermo (N) 1/80 79/80 1/80 79/80 80\nBasándose en esta información y haciendo uso del Teorema de Bayes:\n$$P(A|B) = \\frac{P(A) \\cdot P(B|A)}{P(B)}$$\n¿Cu\nál es la probabilidad a posteriori de q\nue una persona esté enferma sabiendo q\nue tiene fiebre, $P(E|\\text{fiebre})$?\n✅ RESOLUCIÓN OFICIAL PASO A PASO\nResolu\nción paso a paso: 1. Extracción de probabilidades a priori $P(C)$: • Tamaño total de la m\nuestra: $N =\n20 + 80 = 100$ pacientes. • Probabilidad a priori de estar enfermo: $$P(E) = \\frac{20}{100} = 0.20$$ •\nProbabilidad a priori de no estar enfermo: $$P(N) = \\frac{80}{100} = 0.80$$ 2. Extracción de verosimilitudes\ncondicionales de la tabla: • Verosimilitud de presentar fiebre dado q\nue está enfermo: $$P(\\text{fiebre}|E) =\n\\frac{10}{20} = 0.50$$ • Verosimilitud de presentar fiebre dado q\nue no está enfermo: $$P(\\text{fiebre}|N) =\n\\frac{1}{80} = 0.0125$$ 3. Cálculo de la probabilidad marginal de la evidencia $P(\\text{fiebre})$ (Teorema\nde la Probabilidad Total): $$P(\\text{fiebre}) = P(E) \\cdot P(\\text{fiebre}|E) + P(N) \\cdot P(\\text{fiebre}|N)$$\n$$P(\\text{fiebre}) = (0.20 \\cdot 0.50) + (0.80 \\cdot 0.0125) = 0.10 + 0.01 = 0.11 = \\frac{11}{100}$$ 4. Aplicación\ndel Teorema de Bayes para la probabilidad a posteriori: $$P(E|\\text{fiebre}) = \\frac{P(E) \\cdot\nP(\\text{fiebre}|E)}{P(\\text{fiebre})} = \\frac{\\frac{20}{100} \\cdot \\frac{10}{20}}{\\frac{11}{100}} = \\frac{\\frac{10}\n{100}}{\\frac{11}{100}} = \\frac{10}{11} \\approx 0.90909 \\q\nuad (90.91\\%)$$ Conclusión clínica: Aunq\nue la\nprevalencia a priori de la enfermedad en la población es relativamente baja ($20\\%$), la presencia del síntoma", "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_40.jpg", "page": 40, "title": "TAA Tema 8: Clasificación con Naïve Bayes Ejercicio Oficial de Cálculo (Probabilidad y Bayes) T", "blocks": [{"type": "paragraph", "text": "TAA Tema 8: Clasificación con Naïve Bayes Ejercicio Oficial de Cálculo (Probabilidad y Bayes) TAA-EJ-02"}, {"type": "paragraph", "text": "Inferencia Bayesiana y Probabilidad a Posteriori Clínica"}, {"type": "paragraph", "text": "Un hospital está construyendo un modelo para detectar si un paciente tiene una enfermedad respiratoria (E) o no (N)"}, {"type }) = P(E) \\cdot P(\\text{fiebre}|E) + P(N) \\cdot P(\\text{fiebre}|N)$$"}, {"type": "paragraph", "text": "$$P(\\text{fiebre}) = (0.20 \\cdot 0.50) + (0.80 \\cdot 0.0125) = 0.10 + 0.01 = 0.11 = \\frac{11}{100}$$ 4. Aplicación del Teorema de Bayes para la probabilidad a posteriori: $$P(E|\\text{fiebre}) = \\frac{P(E) \\cdot"}, {"type": "paragraph", "text": "P(\\text{fiebre}|E)}{P(\\text{fiebre})} = \\frac{\\frac{20}{100} \\cdot \\frac{10}{20}}{\\frac{11}{100}} = \\frac{\\frac{10}"}, {"type": "paragraph", "text": "{100}}{\\frac{11}{100}} = \\frac{10}{11} \\approx 0.90909 \\q uad (90.91\\%)$$ Conclusión clínica: Aunq ue la prevalencia a priori de la enfermedad en la población es relativamente baja ($20\\%$), la presencia del síntoma"}]}, {"image": "./examenes_resueltos_master_ia_pages/page_41.jpg", "text": "fiebre m\nultiplica drásticamente la probabilidad a posteriori hasta el $90.91\\%$, debido a q\nue la tasa de falsos\npositivos en personas no enfermas es su\nmamente redu\ncida ($1/80 = 1.25\\%$).\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nEl clasificador Naïve Bayes aplica formalmente el principio de estimación MAP (Maxim\nu\nm A Posteriori) integrando\nel conocimiento previo poblacional con la evidencia empírica observada (Diapositivas Tema 8, págs. 9-15; Prof.\nª\nMaría Flores Ceballos). El denominador normalizador actúa como factor de escala sobre el espacio de hipótesis\nexcluyentes.\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR\nTrampa clásica de examen: Olvidar ponderar la verosimilitud de los no enfermos por su\nprobabilidad a priori $P(N) =\n0.80$, su\nmando directamente $10/20 + 1/80$. Otro error frecuente es omitir el cálculo del denominador total\n$P(\\text{fiebre})$, asu\nmiendo erróneamente q\nue $P(E|\\text{fiebre}) = P(\\text{fiebre}|E) = 0.50$ (Falacia del fiscal /\ntransposición de la condicional).", "height": 1188, "width": 918, "page": 41, "title": "fiebre m ultiplica drásticamente la probabilidad a posteriori hasta el $90.91\\%$, debido a q ue", "blocks": [{"type": "paragraph", "text": "fiebre m ultiplica drásticamente la probabilidad a posteriori hasta el $90.91\\%$, debido a q ue la tasa de falsos positivos en personas no enfermas es su mamente redu cida ($1/80 = 1.25\\%$)."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "El clasificador Naïve Bayes aplica formalmente el principio de estimación MAP (Maximu m A Posteriori) integrando el conocimiento previo poblacional con la evidencia empírica observada (Diapositivas Tema 8, págs. 9-15; Prof."}, {"type": "paragraph", "text": "ª"}, {"type": "paragraph", "text": "María Flores Ceballos). El denominador normalizador actúa como factor de escala sobre el espacio de hipótesis excluyentes."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}, {"type": "paragraph", "text": "Trampa clásica de examen: Olvidar ponderar la verosimilitud de los no enfermos por su probabilidad a priori $P(N) ="}, {"type": "paragraph", "text": "0.80$, su mando directamente $10/20 + 1/80$. Otro error frecuente es omitir el cálculo del denominador total"}, {"type": "paragraph", "text": "$P(\\text{fiebre})$, asu miendo erróneamente q ue $P(E|\\text{fiebre}) = P(\\text{fiebre}|E) = 0.50$ (Falacia del fiscal / transposición de la condicional)."}]}, {"width": 918, "text": "TAA Tema 9: Combinación de Clasificadores Ejercicio Teórico-Práctico Oficial TAA-EJ-03\nActualización Analítica de Pesos y Parámetro Alfa en AdaBoost\nEn el algoritmo de Boosting AdaBoost (Freund & Schapire, 1997):\n1. ¿Cu\nál es la form\nulación matemática y el significado analítico del parámetro $\\alpha_m$ asignado a cada clasificador\nbase $G_m(x)$ en la ronda $m$?\n2. ¿Cómo se actualizan los pesos de las observaciones $w_{m+1, i}$ para la siguiente iteración? Dem\nuestre\nalgebraicamente q\nu\né ocurre cuando un clasificador base obtiene un error $\\epsilon_m < 0.5$, $\\epsilon_m = 0.5$ y\n$\\epsilon_m > 0.5$.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Form\nulación analítica y significado de $\\alpha_m$: En cada ronda $m = 1, \\dots,\nM$, se evalúa el error\nponderado del clasificador base dé\nbil: $$\\epsilon_m = \\frac{\\su\nm_{i=1}^N w_{m, i} \\cdot \\mathbb{I}(y_i \\neq\nG_m(x_i))}{\\su\nm_{i=1}^N w_{m, i}}$$ El peso o factor de confianza del clasificador $\\alpha_m$ se calcula como:\n$$\\alpha_m = \\frac{1}{2} \\ln\\left(\\frac{1 - \\epsilon_m}{\\epsilon_m}\\right)$$ Significado analítico: $\\alpha_m$\nrepresenta el poder de voto q\nue tendrá el clasificador $G_m(x)$ en el ensamble final $G(x) =\n\\text{sign}\\left(\\su\nm_{m=1}^M \\alpha_m G_m(x)\\right)$. • Si $\\epsilon_m \\to 0$ (clasificador casi perfecto):\n$\\frac{1 - \\epsilon_m}{\\epsilon_m} \\to \\infty \\implies \\alpha_m \\to +\\infty$ (recibe voto prioritario determinante). •\nSi $\\epsilon_m = 0.5$ (clasificador eq\nuivalente al azar binario): $\\frac{1 - 0.5}{0.5} = 1 \\implies \\alpha_m = \\frac{1}\n{2} \\ln(1) = 0$ (el clasificador es descartado; su voto vale exactamente cero). • Si $\\epsilon_m > 0.5$\n(clasificador peor q\nue el azar): $\\alpha_m < 0$ (su voto es negativo, lo q\nue eq\nuivale a invertir todas sus\npredicciones para aprovechar su\ncapacidad discriminativa). 2. Ecuación de actualización de pesos de las\nm\nuestras: Los pesos de cada instancia $i$ para la ronda $m+1$ se actualizan según: $$w_{m+1, i} = w_{m, i}\n\\cdot \\exp\\left( -\\alpha_m \\cdot y_i \\cdot G_m(x_i) \\right) = w_{m, i} \\cdot \\exp\\left( \\alpha_m \\cdot \\mathbb{I}(y_i\n\\neq G_m(x_i)) \\right)$$ Posteriormente se normalizan dividiendo por $Z_m = \\su\nm_{i=1}^N w_{m+1, i}$ para\nq\nue su\nmen 1. • Para instancias bien clasificadas ($y_i = G_m(x_i)$): el exponente es $-\\alpha_m$, por lo q\nue su\npeso se m\nultiplica por $e^{-\\alpha_m} < 1$, redu\nciendo su importancia relativa. • Para instancias mal clasificadas\n($y_i \\neq G_m(x_i)$): el exponente es $+\\alpha_m$, por lo q\nue su\npeso se m\nultiplica por $e^{\\alpha_m} > 1$,\nau\nmentando drásticamente su\nponderación y forzando al siguiente estimador $G_{m+1}$ a concentrarse en\nresolver dichos ejemplos difíciles.\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nAdaBoost optimiza de manera voraz (greedy) por etapas la función de pérdida exponencial $L(y, f(x)) = \\exp(-y\nf(x))$ (Diapositivas Tema 9, págs. 17-23; Hastie et al., 2009; Prof.\nª María Flores Ceballos). Se dem\nuestra\nmatemáticamente q\nue el error de entrenamiento decrece exponencialmente con el número de rondas si cada\nestimador dé\nbil su\npera ligeramente el azar ($\\\\epsilon_m < 0.5$).\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR\nPregunta con trampa de examen: '¿Qu\né ocurre si un clasificador base tiene un error del 70% ($\\\\epsilon_m = 0.70$)?\n¿Debe eliminarse inmediatamente?'.\nResp\nuesta crítica: No necesariamente; con $\\\\alpha_m = \\\\frac{1}{2}\\\\ln(0.3/0.7) <\n0$, si se invierte su\npredicción se convierte en un clasificador con un 30% de error, aportando información útil al\nensamble.", "height": 1188, "page": 42, "image": "./examenes_resueltos_master_ia_pages/page_42.jpg", "title": "TAA Tema 9: Combinación de Clasificadores Ejercicio Teórico-Práctico Oficial TAA-EJ-03", "blocks": [{"type": "title", "text": "TAA Tema 9: Combinación de Clasificadores Ejercicio Teórico-Práctico Oficial TAA-EJ-03"}, {"type": "paragraph", "text": "Actualización Analítica de Pesos y Parámetro Alfa en AdaBoost"}, {"type": "paragraph", "text": "En el algoritmo de Boosting AdaBoost (Freund & Schapire, 1997):"}, {"type": "bullet", "text": "1. ¿Cu"}, {"type": "paragraph", "text": "ál es la form ulación matemática y el significado analítico del parámetro $\\alpha_m$ asignado a cada clasificador base $G_m(x)$ en la ronda $m$?"}, {"type": "bullet", "text": "2. ¿Cómo se actualizan los pesos de las observaciones $w_{m+1, i}$ para la siguiente iteración? Dem uestre algebraicamente qu"}, {"type": "paragraph", "text": "é ocurre cuando un clasificador base obtiene un error $\\epsilon_m < 0.5$, $\\epsilon_m = 0.5$ y"}, {"type": "paragraph", "text": "$\\epsilon_m > 0.5$."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Form ulación analítica y significado de $\\alpha_m$: En cada ronda $m = 1, \\dots,"}, {"type": "paragraph", "text": "M$, se evalúa el error ponderado del clasificador base dé bil: $$\\epsilon_m = \\frac{\\su m_{i=1}^N w_{m, i} \\cdot \\mathbb{I}(y_i \\neq"}, {"type": "paragraph", "text": "G_m(x_i))}{\\su m_{i=1}^N w_{m, i}}$$ El peso o factor de confianza del clasificador $\\alpha_m$ se calcula como:"}, {"type": "paragraph", "text": "$$\\alpha_m = \\frac{1}{2} \\ln\\left(\\frac{1 - \\epsilon_m}{\\epsilon_m}\\right)$$ Significado analítico: $\\alpha_m$ representa el poder de voto q ue tendrá el clasificador $G_m(x)$ en el ensamble final $G(x) ="}, {"type": "paragraph", "text": "\\text{sign}\\left(\\su m_{m=1}^M \\alpha_m G_m(x)\\right)$. • Si $\\epsilon_m \\to 0$ (clasificador casi perfecto):"}, {"type": "paragraph", "text": "$\\frac{1 - \\epsilon_m}{\\epsilon_m} \\to \\infty \\implies \\alpha_m \\to +\\infty$ (recibe voto prioritario determinante). •"}, {"type": "paragraph", "text": "Si $\\epsilon_m = 0.5$ (clasificador eq uivalente al azar binario): $\\frac{1 - 0.5}{0.5} = 1 \\implies \\alpha_m = \\frac{1}"}, {"type": "paragraph", "text": "{2} \\ln(1) = 0$ (el clasificador es descartado; su voto vale exactamente cero). • Si $\\epsilon_m > 0.5$"}, {"type": "paragraph", "text": "(clasificador peor q ue el azar): $\\alpha_m < 0$ (su voto es negativo, lo q ue eq uivale a invertir todas sus predicciones para aprovechar su capacidad discriminativa). 2. Ecuación de actualización de pesos de lasm uestras: Los pesos de cada instancia $i$ para la ronda $m+1$ se actualizan según: $$w_{m+1, i} = w_{m, i}"}, {"type": "paragraph", "text": "\\cdot \\exp\\left( -\\alpha_m \\cdot y_i \\cdot G_m(x_i) \\right) = w_{m, i} \\cdot \\exp\\left( \\alpha_m \\cdot \\mathbb{I}(y_i"}, {"type": "paragraph", "text": "\\neq G_m(x_i)) \\right)$$ Posteriormente se normalizan dividiendo por $Z_m = \\su m_{i=1}^N w_{m+1, i}$ paraq ue su men 1. • Para instancias bien clasificadas ($y_i = G_m(x_i)$): el exponente es $-\\alpha_m$, por lo q ue su peso se m ultiplica por $e^{-\\alpha_m} < 1$, redu ciendo su importancia relativa. • Para instancias mal clasificadas"}, {"type": "paragraph", "text": "($y_i \\neq G_m(x_i)$): el exponente es $+\\alpha_m$, por lo q ue su peso se m ultiplica por $e^{\\alpha_m} > 1$,au mentando drásticamente su ponderación y forzando al siguiente estimador $G_{m+1}$ a concentrarse en resolver dichos ejemplos difíciles."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "AdaBoost optimiza de manera voraz (greedy) por etapas la función de pérdida exponencial $L(y, f(x)) = \\exp(-y f(x))$ (Diapositivas Tema 9, págs. 17-23; Hastie et al., 2009; Prof."}, {"type": "paragraph", "text": "ª María Flores Ceballos). Se dem uestra matemáticamente q ue el error de entrenamiento decrece exponencialmente con el número de rondas si cada estimador dé bil su pera ligeramente el azar ($\\\\epsilon_m < 0.5$)."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}, {"type": "paragraph", "text": "Pregunta con trampa de examen: '¿Qu"}, {"type": "paragraph", "text": "é ocurre si un clasificador base tiene un error del 70% ($\\\\epsilon_m = 0.70$)?"}, {"type": "paragraph", "text": "¿Debe eliminarse inmediatamente?'."}, {"type": "paragraph", "text": "Resp uesta crítica: No necesariamente; con $\\\\alpha_m = \\\\frac{1}{2}\\\\ln(0.3/0.7) <"}, {"type": "paragraph", "text": "0$, si se invierte su predicción se convierte en un clasificador con un 30% de error, aportando información útil al ensamble."}]}, {"text": "TAA Tema 6: Árboles de Decisión (CART) Ejercicio Teórico-Práctico Oficial TAA-EJ-04\nCriterios de División: Imp\nureza de Gini vs. Entropía de Shannon\nEn la constru\ncción de árboles de decisión (algoritmos CART y C4.5):\n1. Defina analíticamente el Índice de Imp\nureza de Gini y la Entropía de Shannon para un nodo con $K$ clases.\n2. Compare ambos criterios respecto a su rango nu\nmérico,\ncoste comp\nutacional y comportamiento ante nodos p\nuros y\nmezclas eq\nuitativas.\n3. Expliq\nue la naturaleza geométrica de las particiones indu\ncidas en el espacio de características.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Definición analítica: Para un nodo $t$ con proporciones empíricas de clase $p_k$ ($k = 1, \\dots,\nK$, donde\n$\\su\nm_{k=1}^K p_k = 1$): • Imp\nureza de Gini (CART - Breiman et al., 1984): $$I_G(t) = 1 - \\su\nm_{k=1}^K\np_k^2 = \\su\nm_{k \\neq j} p_k p_j$$ • Entropía de Shannon (ID3 / C4.5 - Quinlan, 1986): $$H(t) = -\n\\su\nm_{k=1}^K p_k \\log_2(p_k) \\q\nuad (\\text{asu\nmiendo } 0 \\log_2 0 = 0)$$ 2. Tabla comparativa rigurosa:\nPropiedad Índice de Gini (CART) Entropía de Shannon (C4.5)\nRango (Caso binario\nK=2) $[0, 0.50]$ (Máximo en $p = 0.5$) $[0, 1.00]$ (Máximo en $p = 0.5$)\nNodo perfectamente\np\nuro\n$I_G = 1 - (1^2 + 0^2) = 0$ $H = -(1 \\log_2 1 + 0) = 0$\nNodo máxima\nimp\nureza (K=2) $I_G = 1 - (0.5^2 + 0.5^2) = 0.50$\n$H = -(0.5 \\log_2 0.5 + 0.5 \\log_2 0.5) =\n1.00$\nCoste comp\nutacional\nMuy bajo: Solo su\nmas y\nm\nultiplicaciones polinomiales\nModerado/Alto: Req\nuiere cálculo de\nlogaritmos en base 2\nPreferencia en la\npráctica\nEs el estándar por defecto en Scikit-\nLearn (rápido y eficiente)\nÚtil para fundamentación teórica de\nGanancia de Información\n3. Geometría de las particiones del espacio: Los árboles de decisión univariantes estándar operan\nseleccionando una sola variable continua $X_j$ y un u\nmbral $c$ en cada nodo interno ($X_j \\le c$). Por\nconsiguiente,\ncada partición indu\nce un hiperplano ortogonal (perpendicular) a los ejes de coordenadas. El\nespacio de entrada se divide recursivamente en hiperrectángulos alineados con los ejes (axis-aligned boxes).\nEsto hace q\nue los árboles aproximen fronteras no lineales mediante funciones escalonadas, req\nuiriendo m\nu\nchas\ndivisiones para modelar fronteras diagonales suaves.\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nAmbos criterios miden la dispersión o imp\nureza de una distribu\nción de probabilidad m\nultinomial y en el 98% de\nlos problemas reales seleccionan divisiones idénticas (Diapositivas Tema 6, págs. 9-16; Prof.\nª María Flores\nCeballos). La función Gini es una aproximación de Taylor de primer orden de la entropía alrededor de las\nprobabilidades uniformes.\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR", "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_43.jpg", "page": 43, "width": 918, "title": "TAA Tema 6: Árboles de Decisión (CART) Ejercicio Teórico-Práctico Oficial TAA-EJ-04", "blocks": [{"type": "title", "text": "TAA Tema 6: Árboles de Decisión (CART) Ejercicio Teórico-Práctico Oficial TAA-EJ-04"}, {"type": "paragraph", "text": "Criterios de División: Imp ureza de Gini vs. Entropía de Shannon"}, {"type": "paragraph", "text": "En la constru cción de árboles de decisión (algoritmos CART y C4.5):"}, {"type": "bullet", "text": "1. Defina analíticamente el Índice de Imp ureza de Gini y la Entropía de Shannon para un nodo con $K$ clases."}, {"type": "bullet", "text": "2. Compare ambos criterios respecto a su rango nu mérico, coste comp utacional y comportamiento ante nodos p uros y mezclas eq uitativas."}, {"type": "bullet", "text": "3. Expliq ue la naturaleza geométrica de las particiones indu cidas en el espacio de características."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Definición analítica: Para un nodo $t$ con proporciones empíricas de clase $p_k$ ($k = 1, \\dots,"}, {"type": "paragraph", "text": "K$, donde"}, {"type": "paragraph", "text": "$\\su m_{k=1}^K p_k = 1$): • Imp ureza de Gini (CART - Breiman et al., 1984): $$I_G(t) = 1 - \\su m_{k=1}^K p_k^2 = \\su m_{k \\neq j} p_k p_j$$ • Entropía de Shannon (ID3 / C4.5 - Quinlan, 1986): $$H(t) = -"}, {"type": "paragraph", "text": "\\sum_{k=1}^K p_k \\log_2(p_k) \\q uad (\\text{asu miendo } 0 \\log_2 0 = 0)$$ 2. Tabla comparativa rigurosa:"}, {"type": "paragraph", "text": "Propiedad Índice de Gini (CART) Entropía de Shannon (C4.5)"}, {"type": "paragraph", "text": "Rango (Caso binario"}, {"type": "paragraph", "text": "K=2) $[0, 0.50]$ (Máximo en $p = 0.5$) $[0, 1.00]$ (Máximo en $p = 0.5$)"}, {"type": "paragraph", "text": "Nodo perfectamentep uro"}, {"type": "paragraph", "text": "$I_G = 1 - (1^2 + 0^2) = 0$ $H = -(1 \\log_2 1 + 0) = 0$"}, {"type": "paragraph", "text": "Nodo máxima imp ureza (K=2) $I_G = 1 - (0.5^2 + 0.5^2) = 0.50$"}, {"type": "paragraph", "text": "$H = -(0.5 \\log_2 0.5 + 0.5 \\log_2 0.5) ="}, {"type": "heading", "text": "1.00$"}, {"type": "paragraph", "text": "Coste comp utacional"}, {"type": "paragraph", "text": "Muy bajo: Solo su mas ym ultiplicaciones polinomiales"}, {"type": "paragraph", "text": "Moderado/Alto: Req uiere cálculo de logaritmos en base 2"}, {"type": "paragraph", "text": "Preferencia en la práctica"}, {"type": "paragraph", "text": "Es el estándar por defecto en ScikitLearn (rápido y eficiente)"}, {"type": "paragraph", "text": "Útil para fundamentación teórica de"}, {"type": "paragraph", "text": "Ganancia de Información"}, {"type": "bullet", "text": "3. Geometría de las particiones del espacio: Los árboles de decisión univariantes estándar operan seleccionando una sola variable continua $X_j$ y un u mbral $c$ en cada nodo interno ($X_j \\le c$). Por consiguiente, cada partición indu ce un hiperplano ortogonal (perpendicular) a los ejes de coordenadas. El espacio de entrada se divide recursivamente en hiperrectángulos alineados con los ejes (axis-aligned boxes)."}, {"type": "paragraph", "text": "Esto hace q ue los árboles aproximen fronteras no lineales mediante funciones escalonadas, req uiriendo mu chas divisiones para modelar fronteras diagonales suaves."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "Ambos criterios miden la dispersión o imp ureza de una distribu ción de probabilidad m ultinomial y en el 98% de los problemas reales seleccionan divisiones idénticas (Diapositivas Tema 6, págs. 9-16; Prof."}, {"type": "paragraph", "text": "ª María Flores"}, {"type": "paragraph", "text": "Ceballos). La función Gini es una aproximación de Taylor de primer orden de la entropía alrededor de las probabilidades uniformes."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}]}, {"page": 44, "width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_44.jpg", "text": "Pregunta capciosa de examen: '¿Cu\nál es el valor máximo del índice de Gini en un problema binario?'. El estudiante\nsuele responder '1.0' por analogía con la entropía,\ncuando el valor máximo exacto es 0.50.", "title": "Pregunta capciosa de examen: '¿Cu", "blocks": [{"type": "title", "text": "Pregunta capciosa de examen: '¿Cu"}, {"type": "paragraph", "text": "ál es el valor máximo del índice de Gini en un problema binario?'. El estudiante suele responder '1.0' por analogía con la entropía, cuando el valor máximo exacto es 0.50."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_45.jpg", "page": 45, "text": "TAA Tema 4 / Tema 1: Análisis y Metodología Caso Práctico Oficial de Análisis (Sanidad) TAA-EJ-05\nRegresión Clínica: Predicción de Estancia Hospitalaria COVID-19\nEnunciado oficial de examen:\nTarea: Regresión: predecir la duración de la estancia hospitalaria (en días) de pacientes COVID-19 a partir de variables\ndemográficas (edad, sexo),\ncomorbilidades (diabetes, hipertensión) y parámetros clínicos al ingreso (saturación de\noxígeno, proteína C reactiva, dímero D).\nSe solicita estru\ncturar la resolu\nción en 3 apartados rigurosos:\n1. Análisis exploratorio de datos (EDA) y preprocesamiento necesario.\n2. Selección fundamentada de algoritmos de aprendizaje automático a comparar.\n3. Protocolo de evaluación experimental, métricas clínicas y análisis de residuos.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Análisis Exploratorio de Datos (EDA) y Preprocesamiento: • Auditoría de la variable objetivo: Comprobar\nla no negatividad de 'días de estancia' ($y \\ge 0$) y ausencia de incoherencias temporales (fecha de alta previa\nal ingreso). Tratar los pacientes sin hospitalización según el alcance (exclusión o asignación controlada). •\nDistribu\nción y asimetría: Analizar histogramas y boxplots; la estancia hospitalaria exhibe típicamente asimetría\npositiva severa (cola derecha larga de pacientes en UCI). Considerar transformación logarítmica $\\ln(y + 1)$ si se\naplican modelos lineales. • Tratamiento de valores ausentes sin fuga de información (Data Leakage): -\nIdentificar mecanismos (MCAR vs MAR). - Imp\nutar variables clínicas con la mediana o KNN dentro de un pipeline\najustado estrictamente sobre el conjunto de entrenamiento (evitando usar estadísticos del conjunto global). •\nDetección de m\nulticolinealidad: Analizar la matriz de correlación de Pearson y factor de inflación de la varianza\n(VIF) entre biomarcadores inflamatorios. • Escalado: Aplicar RobustScaler o StandardScaler para variables con\noutliers evidentes. 2. Selección fundamentada de algoritmos: Se propone una comparativa entre dos familias\nalgorítmicas complementarias: • Modelo de Referencia / Interpretable (Baseline): Regresión Lineal\nRegularizada (Ridge / Lasso / ElasticNet). - Justific\na\nción: Permite inferir el efecto marginal medio y la\nsignificancia clínica directa de cada biomarcador (coeficientes $\\beta_j$). La regularización L1 (Lasso) permite\nselección automática de biomarcadores irrelevantes. • Modelo de Alta Capacidad No Lineal: Ensamble basado\nen árboles (Random Forest Regressor o Gradient Boosting Regressor / XGBoost). - Justific\na\nción: Captura\ninteracciones de orden su\nperior (p. ej., el impacto conjunto de edad avanzada + diabetes en la PCR) y relaciones\nno lineales complejas sin req\nuerir especificación manual de polinomios, siendo el estado del arte en datos\ntabulares clínicos. 3. Protocolo de evaluación, métricas y residuos: • Partición de datos: Validación cruzada\nK-fold estratificada (o agru\npada si hay múltiples registros por paciente) con split Train/Test (80/20)\ncompletamente desacoplado. • Métricas cuantitativas: - MAE (Mean Absolute Error): Expresa el error medio\ndirectamente en días reales ($|y - \\hat{y}|$), facilitando la com\nunicación intuitiva al personal médico. - R\nMSE\n(Root Mean Sq\nuared Error): Penaliza severamente los errores grandes en pacientes con estancias m\nuy\nprolongadas. - $R^2$ (Coeficiente de Determinación): Cuantifica la proporción de varianza de la estancia\nexplicada por los predictores clínicos. • Análisis diagnóstico de residuos: Graficar residuos ($y - \\hat{y}$)\nfrente a predicciones para verificar homocedasticidad, normalidad y ausencia de patrones sistemáticos de\ninfraestimación en casos graves.\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nLa estru\nctura de resp\nuesta satisface con máxima calificación la rúbrica oficial de la UNIR para el apartado de\nAnálisis (4 p\nuntos sobre 10) establecida por la Prof.\nª María Flores Ceballos,\ncombinando rigor metodológico,\nprevención de data leakage y justificación clínica de algoritmos.\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR", "width": 918, "height": 1188, "title": "TAA Tema 4 / Tema 1: Análisis y Metodología Caso Práctico Oficial de Análisis (Sanidad) TAA-EJ-", "blocks": [{"type": "paragraph", "text": "TAA Tema 4 / Tema 1: Análisis y Metodología Caso Práctico Oficial de Análisis (Sanidad) TAA-EJ-05"}, {"type": "paragraph", "text": "Regresión Clínica: Predicción de Estancia Hospitalaria COVID-19"}, {"type": "paragraph", "text": "Enunciado oficial de examen:"}, {"type": "paragraph", "text": "Tarea: Regresión: predecir la duración de la estancia hospitalaria (en días) de pacientes COVID-19 a partir de variables demográficas (edad, sexo), comorbilidades (diabetes, hipertensión) y parámetros clínicos al ingreso (saturación de oxígeno, proteína C reactiva, dímero D)."}, {"type": "paragraph", "text": "Se solicita estru cturar la resolu ción en 3 apartados rigurosos:"}, {"type": "bullet", "text": "1. Análisis exploratorio de datos (EDA) y preprocesamiento necesario."}, {"type": "bullet", "text": "2. Selección fundamentada de algoritmos de aprendizaje automático a comparar."}, {"type": "bullet", "text": "3. Protocolo de evaluación experimental, métricas clínicas y análisis de residuos."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Análisis Exploratorio de Datos (EDA) y Preprocesamiento: • Auditoría de la variable objetivo: Comprobar la no negatividad de 'días de estancia' ($y \\ge 0$) y ausencia de incoherencias temporales (fecha de alta previa al ingreso). Tratar los pacientes sin hospitalización según el alcance (exclusión o asignación controlada). •"}, {"type": "paragraph", "text": "Distribu ción y asimetría: Analizar histogramas y boxplots; la estancia hospitalaria exhibe típicamente asimetría positiva severa (cola derecha larga de pacientes en UCI). Considerar transformación logarítmica $\\ln(y + 1)$ si se aplican modelos lineales. • Tratamiento de valores ausentes sin fuga de información (Data Leakage): -"}, {"type": "paragraph", "text": "Identificar mecanismos (MCAR vs MAR). - Imp utar variables clínicas con la mediana o KNN dentro de un pipeline ajustado estrictamente sobre el conjunto de entrenamiento (evitando usar estadísticos del conjunto global). •"}, {"type": "paragraph", "text": "Detección de m ulticolinealidad: Analizar la matriz de correlación de Pearson y factor de inflación de la varianza"}, {"type": "paragraph", "text": "(VIF) entre biomarcadores inflamatorios. • Escalado: Aplicar RobustScaler o StandardScaler para variables con outliers evidentes. 2. Selección fundamentada de algoritmos: Se propone una comparativa entre dos familias algorítmicas complementarias: • Modelo de Referencia / Interpretable (Baseline): Regresión Lineal"}, {"type": "paragraph", "text": "Regularizada (Ridge / Lasso / ElasticNet). - Justifica ción: Permite inferir el efecto marginal medio y la significancia clínica directa de cada biomarcador (coeficientes $\\beta_j$). La regularización L1 (Lasso) permite selección automática de biomarcadores irrelevantes. • Modelo de Alta Capacidad No Lineal: Ensamble basado en árboles (Random Forest Regressor o Gradient Boosting Regressor / XGBoost). - Justifica ción: Captura interacciones de orden su perior (p. ej., el impacto conjunto de edad avanzada + diabetes en la PCR) y relaciones no lineales complejas sin req uerir especificación manual de polinomios, siendo el estado del arte en datos tabulares clínicos. 3. Protocolo de evaluación, métricas y residuos: • Partición de datos: Validación cruzada"}, {"type": "paragraph", "text": "K-fold estratificada (o agru pada si hay múltiples registros por paciente) con split Train/Test (80/20)"}, {"type": "paragraph", "text": "completamente desacoplado. • Métricas cuantitativas: - MAE (Mean Absolute Error): Expresa el error medio directamente en días reales ($|y - \\hat{y}|$), facilitando la com unicación intuitiva al personal médico. - R MSE"}, {"type": "paragraph", "text": "(Root Mean Sq uared Error): Penaliza severamente los errores grandes en pacientes con estancias muy prolongadas. - $R^2$ (Coeficiente de Determinación): Cuantifica la proporción de varianza de la estancia explicada por los predictores clínicos. • Análisis diagnóstico de residuos: Graficar residuos ($y - \\hat{y}$)"}, {"type": "paragraph", "text": "frente a predicciones para verificar homocedasticidad, normalidad y ausencia de patrones sistemáticos de infraestimación en casos graves."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "La estru ctura de resp uesta satisface con máxima calificación la rúbrica oficial de la UNIR para el apartado de"}, {"type": "paragraph", "text": "Análisis (4 p untos sobre 10) establecida por la Prof."}, {"type": "paragraph", "text": "ª María Flores Ceballos, combinando rigor metodológico, prevención de data leakage y justificación clínica de algoritmos."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}]}, {"text": "Errores fatales sancionados en examen: 1) Escalar o imp\nutar datos antes de hacer el train_test_split (fuga de datos);\n2) Proponer clasificación para predecir 'días de estancia' (es una variable nu\nmérica continua, por ende es regresión);\n3) Proponer únicamente redes neuronales complejas sin un modelo baseline interpretable.", "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_46.jpg", "page": 46, "width": 918, "title": "Errores fatales sancionados en examen: 1) Escalar o imp utar datos antes de hacer el train_test", "blocks": [{"type": "paragraph", "text": "Errores fatales sancionados en examen: 1) Escalar o imp utar datos antes de hacer el train_test_split (fuga de datos);"}, {"type": "bullet", "text": "2) Proponer clasificación para predecir 'días de estancia' (es una variable nu mérica continua, por ende es regresión);"}, {"type": "bullet", "text": "3) Proponer únicamente redes neuronales complejas sin un modelo baseline interpretable."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_47.jpg", "page": 47, "height": 1188, "text": "TAA Tema 5 / Tema 10: Metodología de Clasificación Caso Práctico Oficial de Análisis (Agrícola) TAA-EJ-06\nClasificación Agrícola: Detección Temprana de Riesgo de Plaga\nEnunciado oficial de examen:\nTarea: Clasificación binaria: predecir si una parcela agrícola está en alto riesgo de plaga ($1$) o riesgo normal ($0$)\nen la próxima semana,\nusando datos históricos de clima (temperatura, hu\nmedad acu\nm\nulada), propiedades del suelo,\nmanejo del cultivo y observaciones agronómicas.\nIndiq\nue detalladamente:\n1. Análisis exploratorio y tratamiento del desbalanceo de clases.\n2. Algoritmos prop\nuestos con su debida justificación técnico-agronómica.\n3. Estrategia de partición temporal y métricas idóneas.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Análisis Exploratorio y Desbalanceo de Clases: • Desbalanceo severo de clases: Los brotes de plagas\nrepresentan eventos minoritarios (típicamente $< 5\\%$ de las observaciones). La Exactitud (Accuracy) q\nueda\ncompletamente invalidada como métrica de éxito (un clasificador trivial q\nue prediga siempre $0$ obtendría un\nengañoso $95\\%$ de acierto sin detectar ninguna plaga). • Estrategias de mitigación: - Ponderación de pesos\nde clase inversamente proporcionales a su frecuencia (`class_weight='balanced'`). - Técnicas de rem\nuestreo\naplicadas exclusivamente sobre el conjunto de entrenamiento (SM\nOTE o sub\nm\nuestreo de la clase mayoritaria). •\nEstudio de relaciones no lineales y retardos: Creación de variables rezagadas (lag features de temperatura y\nhu\nmedad en los últimos 7 y 14 días),\ncru\nciales para la incubación biológica de patógenos. 2. Algoritmos\nprop\nuestos y justificación: • Modelo Base: Regresión Logística con regularización ElasticNet\n(`penalty='elasticnet'`). - Justific\na\nción: Modelo lineal calibrado probabilísticamente q\nue proporciona odds-ratios\ninterpretables para los agrónomos. • Modelo Ensamble Avanzado: Random Forest Classifier o LightGBM\nClassifier. - Justific\na\nción: Excelente capacidad para modelar efectos u\nmbral biológicos (p. ej. las esporas\nproliferan solo si la hu\nmedad excede el $85\\%$ y la temperatura su\npera los $20^\\circ\\text{C}$ de forma\nsim\nultánea).\nResistente al sobreajuste mediante selección aleatoria de atributos y rem\nuestreo bootstrap. 3.\nEstrategia de partición y métricas idóneas: • Validación Temporal (Time-Series Split / Rolling Window):\nProhibido usar K-fold aleatorio convencional, dado q\nue los datos agronómicos presentan una fuerte\nautocorrelación temporal y espacial. La partición debe entrenar con semanas pasadas y evaluar en semanas\nfuturas. • Métricas prioritarias: - Recall / Sensibilidad de la clase Plaga (1): Máxima prioridad para el\nagricultor, p\nues un falso negativo (no detectar la plaga a tiempo) provoca la pérdida total de la cosecha. -\nPrecision-Recall AUC (PR-AUC): M\nétrica estándar de referencia en clasificación desbalanceada, infinitamente\nsu\nperior a R\nOC-AUC cuando la clase positiva es escasa.\n📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)\nAlineado con los estándares del aprendizaje su\npervisado aplicado y las directrices docentes del Máster UNIR en\nmodelado predictivo de eventos raros (Diapositivas Temas 2, 5 y 10).\n⚠ CLAVES DE CO\nRRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADO\nR\nEl error más grave en este problema es reportar el 'Accuracy' como métrica principal o realizar una división de datos\naleatoria q\nue mezcle semanas contiguas, introdu\nciendo una enorme fuga temporal (data leakage temporal).\n2. Procesamiento del Lenguaje Natural (PLN)", "title": "TAA Tema 5 / Tema 10: Metodología de Clasificación Caso Práctico Oficial de Análisis (Agrícola)", "blocks": [{"type": "paragraph", "text": "TAA Tema 5 / Tema 10: Metodología de Clasificación Caso Práctico Oficial de Análisis (Agrícola) TAA-EJ-06"}, {"type": "paragraph", "text": "Clasificación Agrícola: Detección Temprana de Riesgo de Plaga"}, {"type": "paragraph", "text": "Enunciado oficial de examen:"}, {"type": "paragraph", "text": "Tarea: Clasificación binaria: predecir si una parcela agrícola está en alto riesgo de plaga ($1$) o riesgo normal ($0$)"}, {"type": "paragraph", "text": "en la próxima semana, usando datos históricos de clima (temperatura, hu medad acum ulada
