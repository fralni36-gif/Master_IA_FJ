ura su pera los $20^\\circ\\text{C}$ de forma sim ultánea)."}, {"type": "paragraph", "text": "Resistente al sobreajuste mediante selección aleatoria de atributos y rem uestreo bootstrap. 3."}, {"type": "paragraph", "text": "Estrategia de partición y métricas idóneas: • Validación Temporal (Time-Series Split / Rolling Window):"}, {"type": "paragraph", "text": "Prohibido usar K-fold aleatorio convencional, dado q ue los datos agronómicos presentan una fuerte autocorrelación temporal y espacial. La partición debe entrenar con semanas pasadas y evaluar en semanas futuras. • Métricas prioritarias: - Recall / Sensibilidad de la clase Plaga (1): Máxima prioridad para el agricultor, p ues un falso negativo (no detectar la plaga a tiempo) provoca la pérdida total de la cosecha. -"}, {"type": "paragraph", "text": "Precision-Recall AUC (PR-AUC): M"}, {"type": "paragraph", "text": "étrica estándar de referencia en clasificación desbalanceada, infinitamentesu perior a R"}, {"type": "paragraph", "text": "OC-AUC cuando la clase positiva es escasa."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y METODOLÓGICA (UNIR)"}, {"type": "paragraph", "text": "Alineado con los estándares del aprendizaje su pervisado aplicado y las directrices docentes del Máster UNIR en modelado predictivo de eventos raros (Diapositivas Temas 2, 5 y 10)."}, {"type": "heading", "text": "⚠ CLAVES DE CO"}, {"type": "heading", "text": "RRECCIÓN Y TRAMPAS DEL TRIBUNAL EXAMINADOR"}, {"type": "paragraph", "text": "El error más grave en este problema es reportar el 'Accuracy' como métrica principal o realizar una división de datos aleatoria q ue mezcle semanas contiguas, introdu ciendo una enorme fuga temporal (data leakage temporal)."}, {"type": "bullet", "text": "2. Procesamiento del Lenguaje Natural (PLN)"}]}, {"image": "./examenes_resueltos_master_ia_pages/page_48.jpg", "page": 48, "width": 918, "height": 1188, "text": "Contenidos evaluados: Modelado Estadístico del Lenguaje, HMM y Algoritmo de Viterbi, Parsing CKY,\nDesambiguación Léxica (Lesk, Schütze, Yarowsky) y Modelos Transformers.", "title": "Contenidos evaluados: Modelado Estadístico del Lenguaje, HMM y Algoritmo de Viterbi, Parsing CK", "blocks": [{"type": "paragraph", "text": "Contenidos evaluados: Modelado Estadístico del Lenguaje, HMM y Algoritmo de Viterbi, Parsing CKY,"}, {"type": "paragraph", "text": "Desambiguación Léxica (Lesk, Schütze, Yarowsky) y Modelos Transformers."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_49.jpg", "page": 49, "text": "PLN Tema 3: Modelos O\ncultos de Markov (HMM) Ejercicio Oficial de Examen PLN-EJ-01\nAlgoritmo de Viterbi para Etiq\nuetado Morfosintáctico (POS Tagging)\nDado un modelo oculto de Markov (HMM) para etiq\nuetado morfosintáctico con dos estados ocultos: $S$ (Sustantivo)\ny $V$ (Verbo), y los siguientes parámetros probabilísticos:\n• Probabilidades iniciales $\\pi$:\n$$\\pi(S) = 0.60, \\q\nuad \\pi(V) = 0.40$$\n• Matriz de transiciones $A$ ($P(t_i|t_{i-1})$):\n$$P(S|S) = 0.30, \\q\nuad P(V|S) = 0.70$$\n$$P(S|V) = 0.80, \\q\nuad P(V|V) = 0.20$$\n• Matriz de emisiones $B$ ($P(palabra|etiq\nueta)$):\n$$P(\\text{\"come\"}|S) = 0.10, \\q\nuad P(\\text{\"come\"}|V) = 0.60$$\n$$P(\\text{\"pan\"}|S) = 0.80, \\q\nuad P(\\text{\"pan\"}|V) = 0.05$$\nApliq\nue el Algoritmo de Viterbi para determinar la secuencia de etiq\nuetas morfosintácticas más probable para la\nfrase de dos palabras:\n\"come pan\"\nMuestre la form\nulación matemática de cada celda del Trellis, los valores nu\nméricos calculados, los p\nunteros de\nretroceso (backpointers) y el camino óptimo decodificado.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Form\nulación matemática fundamental del algoritmo de Viterbi: La probabilidad máxima acu\nm\nulada en el\npaso temporal $t$ para el estado oculto $j$ se define como: $$v_t(j) = \\max_{i} \\left[ v_{t-1}(i) \\cdot a_{ij} \\right]\n\\cdot b_j(o_t)$$ donde el p\nuntero de retroceso q\nue almacena el estado predecesor óptimo es: $$b\np_t(j) =\n\\arg\\max_{i} \\left[ v_{t-1}(i) \\cdot a_{ij} \\right]$$ 2. Paso 1: Palabra 1 = \"come\" ($t = 1$): Se calcula el produ\ncto\nde la probabilidad inicial por la probabilidad de emisión de la primera observación: • Para el estado $S$: $$v_1(S)\n= \\pi(S) \\cdot P(\\text{\"come\"}|S) = 0.60 \\cdot 0.10 = 0.0600 \\q\nuad (b\np_1(S) = \\emptyset)$$ • Para el estado $V$:\n$$v_1(V) = \\pi(V) \\cdot P(\\text{\"come\"}|V) = 0.40 \\cdot 0.60 = 0.2400 \\q\nuad (b\np_1(V) = \\emptyset)$$ 3. Paso 2:\nPalabra 2 = \"pan\" ($t = 2$): Se calcula la transición desde cada posible estado previo m\nultiplicada por la\nprobabilidad de emisión de \"pan\": • Para el estado $S$: $$\\text{Candidato desde } S: v_1(S) \\cdot P(S|S) =\n0.0600 \\cdot 0.30 = 0.0180$$ $$\\text{Candidato desde } V: v_1(V) \\cdot P(S|V) = 0.2400 \\cdot 0.80 = 0.1920$$\n$$v_2(S) = \\max(0.0180, 0.1920) \\cdot P(\\text{\"pan\"}|S) = 0.1920 \\cdot 0.80 = \\mathbf{0.1536}$$ Puntero de\nretroceso: Provino de $V \\implies b\np_2(S) = V$. • Para el estado $V$: $$\\text{Candidato desde } S: v_1(S) \\cdot\nP(V|S) = 0.0600 \\cdot 0.70 = 0.0420$$ $$\\text{Candidato desde } V: v_1(V) \\cdot P(V|V) = 0.2400 \\cdot 0.20 =\n0.0480$$ $$v_2(V) = \\max(0.0420, 0.0480) \\cdot P(\\text{\"pan\"}|V) = 0.0480 \\cdot 0.05 = \\mathbf{0.0024}$$\nPuntero de retroceso: Provino de $V \\implies b\np_2(V) = V$. 4. Terminación y Decodificación Óptima\n(Backtracking): • Probabilidad de la secuencia más probable: $$P^* = \\max(v_2(S), v_2(V)) = \\max(0.1536,\n0.0024) = \\mathbf{0.1536}$$ • Estado final óptimo en $t = 2$: $$t_2^* = \\arg\\max(v_2(S), v_2(V)) = \\mathbf{S}\n\\q\nuad (\\text{Sustantivo})$$ • Recu\nperación del estado en $t = 1$ mediante el backpointer: $$t_1^* = b\np_2(S) =\n\\mathbf{V} \\q\nuad (\\text{Verbo})$$ Secuencia óptima de etiq\nuetado:\n\"come\" $\\to$ V (Verbo) + \"pan\" $\\to$ S (Sustantivo)\nLa secuencia de etiq\nuetas gramaticales más probable para \"come pan\" es unívocamente [V, S] con una\nverosimilitud conjunta máxima de 0.1536.", "height": 1188, "title": "PLN Tema 3: Modelos O cultos de Markov (HMM) Ejercicio Oficial de Examen PLN-EJ-01", "blocks": [{"type": "title", "text": "PLN Tema 3: Modelos O cultos de Markov (HMM) Ejercicio Oficial de Examen PLN-EJ-01"}, {"type": "paragraph", "text": "Algoritmo de Viterbi para Etiq uetado Morfosintáctico (POS Tagging)"}, {"type": "paragraph", "text": "Dado un modelo oculto de Markov (HMM) para etiq uetado morfosintáctico con dos estados ocultos: $S$ (Sustantivo)"}, {"type": "paragraph", "text": "y $V$ (Verbo), y los siguientes parámetros probabilísticos:"}, {"type": "bullet", "text": "Probabilidades iniciales $\\pi$:"}, {"type": "paragraph", "text": "$$\\pi(S) = 0.60, \\q uad \\pi(V) = 0.40$$"}, {"type": "bullet", "text": "Matriz de transiciones $A$ ($P(t_i|t_{i-1})$):"}, {"type": "paragraph", "text": "$$P(S|S) = 0.30, \\q uad P(V|S) = 0.70$$"}, {"type": "paragraph", "text": "$$P(S|V) = 0.80, \\q uad P(V|V) = 0.20$$"}, {"type": "bullet", "text": "Matriz de emisiones $B$ ($P(palabra|etiq ueta)$):"}, {"type": "paragraph", "text": "$$P(\\text{\"come\"}|S) = 0.10, \\q uad P(\\text{\"come\"}|V) = 0.60$$"}, {"type": "paragraph", "text": "$$P(\\text{\"pan\"}|S) = 0.80, \\q uad P(\\text{\"pan\"}|V) = 0.05$$"}, {"type": "paragraph", "text": "Apliq ue el Algoritmo de Viterbi para determinar la secuencia de etiq uetas morfosintácticas más probable para la frase de dos palabras:"}, {"type": "paragraph", "text": "\"come pan\""}, {"type": "paragraph", "text": "Muestre la form ulación matemática de cada celda del Trellis, los valores nu méricos calculados, los p unteros de retroceso (backpointers) y el camino óptimo decodificado."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Form ulación matemática fundamental del algoritmo de Viterbi: La probabilidad máxima acum ulada en el paso temporal $t$ para el estado oculto $j$ se define como: $$v_t(j) = \\max_{i} \\left[ v_{t-1}(i) \\cdot a_{ij} \\right]"}, {"type": "paragraph", "text": "\\cdot b_j(o_t)$$ donde el p untero de retroceso q ue almacena el estado predecesor óptimo es: $$b p_t(j) ="}, {"type": "paragraph", "text": "\\arg\\max_{i} \\left[ v_{t-1}(i) \\cdot a_{ij} \\right]$$ 2. Paso 1: Palabra 1 = \"come\" ($t = 1$): Se calcula el produ cto de la probabilidad inicial por la probabilidad de emisión de la primera observación: • Para el estado $S$: $$v_1(S)"}, {"type": "paragraph", "text": "= \\pi(S) \\cdot P(\\text{\"come\"}|S) = 0.60 \\cdot 0.10 = 0.0600 \\q uad (b p_1(S) = \\emptyset)$$ • Para el estado $V$:"}, {"type": "paragraph", "text": "$$v_1(V) = \\pi(V) \\cdot P(\\text{\"come\"}|V) = 0.40 \\cdot 0.60 = 0.2400 \\q uad (b p_1(V) = \\emptyset)$$ 3. Paso 2:"}, {"type": "paragraph", "text": "Palabra 2 = \"pan\" ($t = 2$): Se calcula la transición desde cada posible estado previo m ultiplicada por la probabilidad de emisión de \"pan\": • Para el estado $S$: $$\\text{Candidato desde } S: v_1(S) \\cdot P(S|S) ="}, {"type": "paragraph", "text": "0.0600 \\cdot 0.30 = 0.0180$$ $$\\text{Candidato desde } V: v_1(V) \\cdot P(S|V) = 0.2400 \\cdot 0.80 = 0.1920$$"}, {"type": "paragraph", "text": "$$v_2(S) = \\max(0.0180, 0.1920) \\cdot P(\\text{\"pan\"}|S) = 0.1920 \\cdot 0.80 = \\mathbf{0.1536}$$ Puntero de retroceso: Provino de $V \\implies b p_2(S) = V$. • Para el estado $V$: $$\\text{Candidato desde } S: v_1(S) \\cdot"}, {"type": "paragraph", "text": "P(V|S) = 0.0600 \\cdot 0.70 = 0.0420$$ $$\\text{Candidato desde } V: v_1(V) \\cdot P(V|V) = 0.2400 \\cdot 0.20 ="}, {"type": "paragraph", "text": "0.0480$$ $$v_2(V) = \\max(0.0420, 0.0480) \\cdot P(\\text{\"pan\"}|V) = 0.0480 \\cdot 0.05 = \\mathbf{0.0024}$$"}, {"type": "paragraph", "text": "Puntero de retroceso: Provino de $V \\implies b p_2(V) = V$. 4. Terminación y Decodificación Óptima"}, {"type": "paragraph", "text": "(Backtracking): • Probabilidad de la secuencia más probable: $$P^* = \\max(v_2(S), v_2(V)) = \\max(0.1536,"}, {"type": "paragraph", "text": "0.0024) = \\mathbf{0.1536}$$ • Estado final óptimo en $t = 2$: $$t_2^* = \\arg\\max(v_2(S), v_2(V)) = \\mathbf{S}"}, {"type": "paragraph", "text": "\\q uad (\\text{Sustantivo})$$ • Recu peración del estado en $t = 1$ mediante el backpointer: $$t_1^* = b p_2(S) ="}, {"type": "paragraph", "text": "\\mathbf{V} \\q uad (\\text{Verbo})$$ Secuencia óptima de etiq uetado:"}, {"type": "paragraph", "text": "\"come\" $\\to$ V (Verbo) + \"pan\" $\\to$ S (Sustantivo)"}, {"type": "paragraph", "text": "La secuencia de etiq uetas gramaticales más probable para \"come pan\" es unívocamente [V, S] con una verosimilitud conjunta máxima de 0.1536."}]}, {"width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_50.jpg", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nEl Algoritmo de Viterbi es una técnica canónica de programación dinámica con complejidad temporal $O(T \\cdot\n|S|^2)$ q\nue encuentra la secuencia globalmente óptima de estados ocultos (máximo a posteriori) sin necesidad\nde evaluar exhaustivamente las $|S|^T$ combinaciones posibles (Diapositivas PLN Tema 3, págs. 14-22;\nJurafsky & Martin, 2023).\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nTrampa clásica de examen: Asignar etiq\nuetas de forma voraz e independiente en cada palabra (asu\nmiendo q\nue en\n$t=1$ 'come' es $V$ y en $t=2$ 'pan' es $S$ solo por emisión), sin comp\nutar formalmente la transición $P(S|V) =\n0.80$. Aunq\nue el resultado final coincida en este caso simple, en el examen oficial de la UNIR se evalúa con 0 p\nuntos\nsi no se plasma el produ\ncto matricial completo del Trellis y los backpointers.", "page": 50, "title": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)", "blocks": [{"type": "title", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "El Algoritmo de Viterbi es una técnica canónica de programación dinámica con complejidad temporal $O(T \\cdot"}, {"type": "paragraph", "text": "|S|^2)$ q ue encuentra la secuencia globalmente óptima de estados ocultos (máximo a posteriori) sin necesidad de evaluar exhaustivamente las $|S|^T$ combinaciones posibles (Diapositivas PLN Tema 3, págs. 14-22;"}, {"type": "paragraph", "text": "Jurafsky & Martin, 2023)."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "Trampa clásica de examen: Asignar etiq uetas de forma voraz e independiente en cada palabra (asu miendo q ue en"}, {"type": "paragraph", "text": "$t=1$ 'come' es $V$ y en $t=2$ 'pan' es $S$ solo por emisión), sin comp utar formalmente la transición $P(S|V) ="}, {"type": "paragraph", "text": "0.80$. Aunq ue el resultado final coincida en este caso simple, en el examen oficial de la UNIR se evalúa con 0 p untos si no se plasma el produ cto matricial completo del Trellis y los backpointers."}]}, {"width": 918, "page": 51, "image": "./examenes_resueltos_master_ia_pages/page_51.jpg", "text": "PLN Tema 7: Modelos Estadísticos del Lenguaje y N-Gramas Ejercicio Oficial de Examen PLN-EJ-02\nSuavizado de Laplace, Estimación de N-Gramas y Perplejidad\n1. Expliq\nue por q\nu\né el estimador de máxima verosimilitud (M\nLE) estándar para modelos de lenguaje basados en\nbigramas falla en la práctica ante corp\nus reales.\n2. Desarrolle la form\nulación matemática del Suavizado de Laplace (Add-1) y del Suavizado Add-k para bigramas.\n3. Defina analíticamente la Perplejidad (PP) de un modelo de lenguaje sobre una secuencia de prueba $W = w_1,\nw_2,\n\\dots,\nw_N$ y expliq\nue su relación matemática con la entropía cruzada del modelo.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Fallo del Estimador de Máxima Verosimilitud (M\nLE): Bajo el estimador M\nLE para bigramas, la probabilidad\ncondicional se estima por conteos brutos: $$P_{M\nLE}(w_i | w_{i-1}) = \\frac{C(w_{i-1},\nw_i)}{C(w_{i-1})}$$ En un\ntexto real no visto en entrenamiento, inevitablemente aparecerán pares de palabras legítimas cuyo conteo\nconjunto sea $C(w_{i-1},\nw_i) = 0$. Como la probabilidad de una frase completa es el produ\ncto de probabilidades\nencadenadas ($P(W) = \\prod_{i=1}^N P(w_i | w_{i-1})$),\nun solo bigrama no observado asigna probabilidad\ncero a todo el texto ($P(W) = 0$). Esto se conoce como el pro\nblema de la frecuencia\ncero y genera una\nperplejidad infinita ($PP = \\infty$). 2. Form\nulación matemática del Suavizado de Laplace: Para garantizar q\nue\nninguna transición tenga probabilidad nula, se añade una pseudocuenta a todos los eventos posibles. Si $V$\ndenota el tamaño del vocabulario: • Suavizado Add-1 (Laplace estándar): $$P_{\\text{Laplace}}(w_i | w_{i-1}) =\n\\frac{C(w_{i-1},\nw_i) + 1}{C(w_{i-1}) + |V|}$$ Se su\nma $|V|$ en el denominador para asegurar q\nue $\\su\nm_{w_i \\in\nV} P(w_i | w_{i-1}) = 1$. • Suavizado Add-$k$ (Lidstone / Jeffreys): Como Add-1 transfiere demasiada masa\nprobabilística a bigramas inexistentes cuando $|V|$ es inmenso ($|V| > 100,000$), se utiliza un valor fraccionario\n$k \\in (0, 1)$ (típicamente $k = 0.05$): $$P_{\\text{Add-}k}(w_i | w_{i-1}) = \\frac{C(w_{i-1},\nw_i) + k}{C(w_{i-1}) + k\n\\cdot |V|}$$ 3. Form\nulación matemática de la Perplejidad ($PP$): La Perplejidad cuantifica q\nu\né tan\n'sorprendido' q\nueda el modelo ante el texto de test. Se define como la inversa de la probabilidad geométrica\nmedia asignada a las palabras de la secuencia normalizada por la longitud $N$: $$PP(W) = P(w_1,\nw_2, \\dots,\nw_N)^{-\\frac{1}{N}} = \\sqrt[N]{\\frac{1}{P(w_1,\nw_2, \\dots,\nw_N)}} = \\sqrt[N]{\\prod_{i=1}^N \\frac{1}{P(w_i | w_{i-\n1})}}$$ Aplicando logaritmos en base 2, se dem\nuestra su eq\nuivalencia directa con la Entropía Cruzada empírica\n$H(W)$: $$H(W) = -\\frac{1}{N} \\su\nm_{i=1}^N \\log_2 P(w_i | w_{i-1}) \\implies PP(W) = 2^{H(W)}$$\nInterpretación: Un valor menor de perplejidad indica un modelo de lenguaje de mayor calidad predictiva (un\nmodelo con $PP = 64$ eq\nuivale a dudar eq\nuitativamente entre 64 palabras en cada paso).\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nConstituye la base teórica de la evaluación intrínseca de modelos de lenguaje probabilísticos (Diapositivas PLN\nTema 7, págs. 8-19; Jurafsky & Martin, 2023).\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nEn examen: olvidar su\nmar $k \\cdot |V|$ en el denominador (su\nmar solo $k$), violando el axioma de Kolmogórov de q\nue\nla su\nma de probabilidades sobre el espacio m\nuestral debe ser igual a 1.", "height": 1188, "title": "PLN Tema 7: Modelos Estadísticos del Lenguaje y N-Gramas Ejercicio Oficial de Examen PLN-EJ-02", "blocks": [{"type": "title", "text": "PLN Tema 7: Modelos Estadísticos del Lenguaje y N-Gramas Ejercicio Oficial de Examen PLN-EJ-02"}, {"type": "paragraph", "text": "Suavizado de Laplace, Estimación de N-Gramas y Perplejidad"}, {"type": "bullet", "text": "1. Expliq ue por qu"}, {"type": "paragraph", "text": "é el estimador de máxima verosimilitud (M"}, {"type": "paragraph", "text": "LE) estándar para modelos de lenguaje basados en bigramas falla en la práctica ante corp us reales."}, {"type": "bullet", "text": "2. Desarrolle la form ulación matemática del Suavizado de Laplace (Add-1) y del Suavizado Add-k para bigramas."}, {"type": "bullet", "text": "3. Defina analíticamente la Perplejidad (PP) de un modelo de lenguaje sobre una secuencia de prueba $W = w_1, w_2,"}, {"type": "paragraph", "text": "\\dots, w_N$ y expliq ue su relación matemática con la entropía cruzada del modelo."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Fallo del Estimador de Máxima Verosimilitud (M"}, {"type": "paragraph", "text": "LE): Bajo el estimador M"}, {"type": "paragraph", "text": "LE para bigramas, la probabilidad condicional se estima por conteos brutos: $$P_{M"}, {"type": "paragraph", "text": "LE}(w_i | w_{i-1}) = \\frac{C(w_{i-1}, w_i)}{C(w_{i-1})}$$ En un texto real no visto en entrenamiento, inevitablemente aparecerán pares de palabras legítimas cuyo conteo conjunto sea $C(w_{i-1}, w_i) = 0$. Como la probabilidad de una frase completa es el produ cto de probabilidades encadenadas ($P(W) = \\prod_{i=1}^N P(w_i | w_{i-1})$), un solo bigrama no observado asigna probabilidad cero a todo el texto ($P(W) = 0$). Esto se conoce como el pro blema de la frecuencia cero y genera una perplejidad infinita ($PP = \\infty$). 2. Form ulación matemática del Suavizado de Laplace: Para garantizar que ninguna transición tenga probabilidad nula, se añade una pseudocuenta a todos los eventos posibles. Si $V$ denota el tamaño del vocabulario: • Suavizado Add-1 (Laplace estándar): $$P_{\\text{Laplace}}(w_i | w_{i-1}) ="}, {"type": "paragraph", "text": "\\frac{C(w_{i-1}, w_i) + 1}{C(w_{i-1}) + |V|}$$ Se su ma $|V|$ en el denominador para asegurar q ue $\\su m_{w_i \\in"}, {"type": "paragraph", "text": "V} P(w_i | w_{i-1}) = 1$. • Suavizado Add-$k$ (Lidstone / Jeffreys): Como Add-1 transfiere demasiada masa probabilística a bigramas inexistentes cuando $|V|$ es inmenso ($|V| > 100,000$), se utiliza un valor fraccionario"}, {"type": "paragraph", "text": "$k \\in (0, 1)$ (típicamente $k = 0.05$): $$P_{\\text{Add-}k}(w_i | w_{i-1}) = \\frac{C(w_{i-1}, w_i) + k}{C(w_{i-1}) + k"}, {"type": "paragraph", "text": "\\cdot |V|}$$ 3. Form ulación matemática de la Perplejidad ($PP$): La Perplejidad cuantifica qu"}, {"type": "paragraph", "text": "é tan"}, {"type": "paragraph", "text": "'sorprendido' q ueda el modelo ante el texto de test. Se define como la inversa de la probabilidad geométrica media asignada a las palabras de la secuencia normalizada por la longitud $N$: $$PP(W) = P(w_1, w_2, \\dots, w_N)^{-\\frac{1}{N}} = \\sqrt[N]{\\frac{1}{P(w_1, w_2, \\dots, w_N)}} = \\sqrt[N]{\\prod_{i=1}^N \\frac{1}{P(w_i | w_{i1})}}$$ Aplicando logaritmos en base 2, se dem uestra su eq uivalencia directa con la Entropía Cruzada empírica"}, {"type": "paragraph", "text": "$H(W)$: $$H(W) = -\\frac{1}{N} \\su m_{i=1}^N \\log_2 P(w_i | w_{i-1}) \\implies PP(W) = 2^{H(W)}$$"}, {"type": "paragraph", "text": "Interpretación: Un valor menor de perplejidad indica un modelo de lenguaje de mayor calidad predictiva (un modelo con $PP = 64$ eq uivale a dudar eq uitativamente entre 64 palabras en cada paso)."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "Constituye la base teórica de la evaluación intrínseca de modelos de lenguaje probabilísticos (Diapositivas PLN"}, {"type": "paragraph", "text": "Tema 7, págs. 8-19; Jurafsky & Martin, 2023)."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "En examen: olvidar su mar $k \\cdot |V|$ en el denominador (su mar solo $k$), violando el axioma de Kolmogórov de que la su ma de probabilidades sobre el espacio m uestral debe ser igual a 1."}]}, {"height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_52.jpg", "page": 52, "width": 918, "text": "PLN Tema 2: Preprocesamiento y Representación Vectorial Ejercicio Oficial de Examen PLN-EJ-03\nPipeline spaCy, Lematización vs. Stemming y Ponderación TF-IDF\n1. Describa la secuencia de componentes del pipeline estándar de procesamiento de texto en spaCy (`nlp(texto)`).\n2.\nJustifiq\nue formalmente las diferencias lingüísticas y comp\nutacionales entre Lematización y Stemming, indicando\nen q\nu\né casos de uso en PLN es preferible cada técnica.\n3. Calcule paso a paso la matriz de ponderación TF-IDF para un término $t$ q\nue aparece 4 veces en un docu\nmento de\n100 palabras, sabiendo q\nue el corp\nus total consta de $N = 10,000$ docu\nmentos y dicho término aparece en $DF(t) =\n100$ docu\nmentos (utilice logaritmo decimal o natural).\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Componentes del Pipeline estándar de spaCy: El objeto `Doc` se procesa secuencialmente mediante una\ncadena de transformadores: 1.\n`Tokenizer` (Segmentación léxica): Divide el texto bruto en tokens individuales\n(no destru\nctivo, preserva índices). 2.\n`Tagger` (Etiq\nuetado POS): Asigna categorías morfosintácticas finas (Penn\nTreebank) y universales (Universal POS). 3.\n`Morphologizer`: Extrae rasgos flexivos (tiempo verbal, género,\nnúmero,\ncaso). 4.\n`Parser` (Análisis de dependencias sintácticas): Construye el árbol de dependencias q\nue\nconecta cabezas sintácticas y modificadores. 5.\n`\nLemmatizer`: Resuelve la forma canónica de diccionario\nbasada en el análisis morfosintáctico del tagger. 6.\n`NER (Named Entity Recognizer)`: Identifica entidades\nnombradas (PERSON, O\nRG, GPE, DATE). 7.\n`AttributeR\nuler / TextCategorizer`: Reglas de atributos específicos y\nclasificación docu\nmental final. 2. Lematización vs. Stemming:\nCriterioLematización (spaCy / WordNet) Stemming (Algoritmo de Porter /\nSnowball)\nFundamento\nMorfológico y lexicográfico formal\n(req\nuiere diccionario y POS tag previo).\nAlgoritmo heurístico de recorte de sufijos\nmediante reglas empíricas en cascada.\nResultado\nRetorna una palabra válida y existente en\nel diccionario (el lema: p. ej., mejor $\\to$\nbueno; estuvimos $\\to$ estar).\nRetorna una raíz o pseudopalabra q\nue p\nuede\nno existir en el idioma (p. ej., universal $\\to$\nunivers; ciencia\ns $\\to$ cienc).\nCoste\ncomp\nutacional\nMayor coste: Req\nuiere etiq\nuetado\nsintáctico previo y consulta a lexicones.\nExtremadamente rápido: Opera en tiempo\nlineal sin cargar modelos ni recursos\nlingüísticos.\nCaso de uso\nidóneo\nExtracción de información médica,\nsistemas de preguntas y resp\nuestas (QA)\ny análisis semántico.\nMotores de búsq\nueda de información masiva\n(IR) y motores de indexación web a gran\nescala.\n3. Cálculo analítico de TF-IDF: • Frecuencia del término ($TF$): $$TF(t, d) = \\frac{\\text{Frecuencia de } t\n\\text{ en } d}{\\text{Total de palabras en } d} = \\frac{4}{100} = 0.04$$ • Frecuencia inversa de docu\nmento\n($IDF$) con logaritmo decimal: $$IDF(t, D) = \\log_{10}\\left(\\frac{N}{DF(t)}\\right) = \\log_{10}\\left(\\frac{10,000}\n{100}\\right) = \\log_{10}(100) = 2.0$$ • Ponderación TF-IDF: $$TF\\text{-}IDF(t, d, D) = TF(t, d) \\cdot IDF(t, D) =\n0.04 \\cdot 2.0 = \\mathbf{0.0800}$$\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)", "title": "PLN Tema 2: Preprocesamiento y Representación Vectorial Ejercicio Oficial de Examen PLN-EJ-03", "blocks": [{"type": "title", "text": "PLN Tema 2: Preprocesamiento y Representación Vectorial Ejercicio Oficial de Examen PLN-EJ-03"}, {"type": "paragraph", "text": "Pipeline spaCy, Lematización vs. Stemming y Ponderación TF-IDF"}, {"type": "bullet", "text": "1. Describa la secuencia de componentes del pipeline estándar de procesamiento de texto en spaCy (`nlp(texto)`)."}, {"type": "paragraph", "text": "2."}, {"type": "paragraph", "text": "Justifiq ue formalmente las diferencias lingüísticas y comp utacionales entre Lematización y Stemming, indicando en qu"}, {"type": "paragraph", "text": "é casos de uso en PLN es preferible cada técnica."}, {"type": "bullet", "text": "3. Calcule paso a paso la matriz de ponderación TF-IDF para un término $t$ q ue aparece 4 veces en un docu mento de"}, {"type": "paragraph", "text": "100 palabras, sabiendo q ue el corp us total consta de $N = 10,000$ docu mentos y dicho término aparece en $DF(t) ="}, {"type": "paragraph", "text": "100$ docu mentos (utilice logaritmo decimal o natural)."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Componentes del Pipeline estándar de spaCy: El objeto `Doc` se procesa secuencialmente mediante una cadena de transformadores: 1."}, {"type": "paragraph", "text": "`Tokenizer` (Segmentación léxica): Divide el texto bruto en tokens individuales"}, {"type": "paragraph", "text": "(no destru ctivo, preserva índices). 2."}, {"type": "paragraph", "text": "`Tagger` (Etiq uetado POS): Asigna categorías morfosintácticas finas (Penn"}, {"type": "paragraph", "text": "Treebank) y universales (Universal POS). 3."}, {"type": "paragraph", "text": "`Morphologizer`: Extrae rasgos flexivos (tiempo verbal, género, número, caso). 4."}, {"type": "paragraph", "text": "`Parser` (Análisis de dependencias sintácticas): Construye el árbol de dependencias que conecta cabezas sintácticas y modificadores. 5."}, {"type": "paragraph", "text": "`"}, {"type": "paragraph", "text": "Lemmatizer`: Resuelve la forma canónica de diccionario basada en el análisis morfosintáctico del tagger. 6."}, {"type": "paragraph", "text": "`NER (Named Entity Recognizer)`: Identifica entidades nombradas (PERSON, O"}, {"type": "paragraph", "text": "RG, GPE, DATE). 7."}, {"type": "paragraph", "text": "`AttributeR uler / TextCategorizer`: Reglas de atributos específicos y clasificación docu mental final. 2. Lematización vs. Stemming:"}, {"type": "paragraph", "text": "CriterioLematización (spaCy / WordNet) Stemming (Algoritmo de Porter /"}, {"type": "paragraph", "text": "Snowball)"}, {"type": "paragraph", "text": "Fundamento"}, {"type": "paragraph", "text": "Morfológico y lexicográfico formal"}, {"type": "paragraph", "text": "(req uiere diccionario y POS tag previo)."}, {"type": "paragraph", "text": "Algoritmo heurístico de recorte de sufijos mediante reglas empíricas en cascada."}, {"type": "paragraph", "text": "Resultado"}, {"type": "paragraph", "text": "Retorna una palabra válida y existente en el diccionario (el lema: p. ej., mejor $\\to$ bueno; estuvimos $\\to$ estar)."}, {"type": "paragraph", "text": "Retorna una raíz o pseudopalabra q ue p uede no existir en el idioma (p. ej., universal $\\to$ univers; ciencia s $\\to$ cienc)."}, {"type": "paragraph", "text": "Coste comp utacional"}, {"type": "paragraph", "text": "Mayor coste: Req uiere etiq uetado sintáctico previo y consulta a lexicones."}, {"type": "paragraph", "text": "Extremadamente rápido: Opera en tiempo lineal sin cargar modelos ni recursos lingüísticos."}, {"type": "paragraph", "text": "Caso de uso idóneo"}, {"type": "paragraph", "text": "Extracción de información médica, sistemas de preguntas y resp uestas (QA)"}, {"type": "paragraph", "text": "y análisis semántico."}, {"type": "paragraph", "text": "Motores de búsq ueda de información masiva"}, {"type": "paragraph", "text": "(IR) y motores de indexación web a gran escala."}, {"type": "bullet", "text": "3. Cálculo analítico de TF-IDF: • Frecuencia del término ($TF$): $$TF(t, d) = \\frac{\\text{Frecuencia de } t"}, {"type": "paragraph", "text": "\\text{ en } d}{\\text{Total de palabras en } d} = \\frac{4}{100} = 0.04$$ • Frecuencia inversa de docu mento"}, {"type": "paragraph", "text": "($IDF$) con logaritmo decimal: $$IDF(t, D) = \\log_{10}\\left(\\frac{N}{DF(t)}\\right) = \\log_{10}\\left(\\frac{10,000}"}, {"type": "paragraph", "text": "{100}\\right) = \\log_{10}(100) = 2.0$$ • Ponderación TF-IDF: $$TF\\text{-}IDF(t, d, D) = TF(t, d) \\cdot IDF(t, D) ="}, {"type": "heading", "text": "0.04 \\cdot 2.0 = \\mathbf{0.0800}$$"}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}]}, {"page": 53, "width": 918, "height": 1188, "text": "Tema 2 PLN UNIR; Salton & Bu\nckley (1988). TF-IDF eq\nuilibra la saliencia local de un término dentro de un\ndocu\nmento frente a su\ncarácter discriminativo global en el corp\nus.\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nConfundir $DF(t)$ (número de docu\nmentos donde aparece) con el conteo total de apariciones del término en todo el\ncorp\nus. El denominador de IDF siempre es el número de docu\nmentos, no el total de palabras.\nPLN Tema 5: Desambiguación Léxica (WSD) Ejercicio Oficial de Examen PLN-EJ-04\nAlgoritmo de Lesk Original vs. Lesk Simplificado\nExpliq\nue el funcionamiento del Algoritmo de Lesk (1986) para la desambiguación del sentido de las palabras (WSD).\nContraste formalmente el algoritmo de Lesk original frente al algoritmo de Lesk simplificado y resuelva el ejemplo\nclásico de desambiguación de la palabra polisémica 'banco' (entidad financiera vs. asiento de parq\nue).\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Fundamento conceptual del Algoritmo de Lesk: Prop\nuesto por Michael E. Lesk en 1986, el algoritmo opera\nbajo la hipótesis de q\nue las palabras q\nue coocurren en una misma oración o contexto discursivo tienden a\ncompartir un dominio semántico coherente. Por lo tanto, el sentido correcto de una palabra ambigua es aq\nuel\ncuya definición o glosa en un diccionario formal (como WordNet) presenta el mayor solapamiento léxico\n(overlap de palabras compartidas) con las definiciones o palabras del contexto circundante. 2. Lesk Original\nvs. Lesk Simplificado (Kilgarriff & Rosenzweig, 2000): • Lesk Original (1986): Calcula el solapamiento entre\nlas glosa\ns de toda\ns la\ns palabra\ns q\nue aparecen en la ventana de contexto de forma combinatoria sim\nultánea. Si\nhay $k$ palabras con $s$ sentidos cada una, el espacio de búsq\nueda combinatorio es $O(s^k)$, lo cual es\ncomp\nutacionalmente prohibitivo para oraciones largas. • Lesk Simplificado: Desambigua una palabra objetivo\n$w$ a la vez. Compara la glosa de cada sentido posible de $w$ en WordNet directamente contra las palabras\npresentes en la propia frase u oración de contexto, eliminando palabras vacías (stop words): $$\\hat{s} =\n\\arg\\max_{s \\in \\text{Sentidos}(w)} \\left| \\text{Palabras}(\\text{Glosa}(s)) \\cap \\text{Palabras}(\\text{Contexto})\n\\right|$$ La complejidad se redu\nce a $O(s)$, siendo su\nmamente rápido y eficiente. 3. Ejemplo práctico\nresuelto: Desambiguación de 'banco': • Oración de prueba: \"El cliente fue al banc\no\na depositar dinero e\ninvertir en f\nondos de inversión.\" • Sentidos en WordNet: - Sentido 1 (Financiero): Glosa = \"Entidad o institución\nfinanciera de crédito que recibe dinero de clientes para préstamos e inversión.\" - Sentido 2 (Mobiliario): Glosa\n= \"Asiento de madera\no piedra en el que pueden sentarse varia\ns persona\ns en una plaza\no parque.\" • Palabras de\ncontexto (sin stop words): {cliente, depositar, dinero, invertir, fondos, inversión}. • Cálculo de intersección: -\nIntersección con Sentido 1: {dinero,\ncliente, inversión} $\\to$ Solapamiento = 3 palabras. - Intersección con\nSentido 2: $\\emptyset$ $\\to$ Solapamiento = 0 palabras. • Asignación: El algoritmo selecciona unívocamente\nel Sentido 1 (Institu\nción financiera).\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nConstituye el algoritmo canónico basado en conocimiento para WSD en el temario oficial de PLN UNIR (Tema 5).\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nNo eliminar las stop words ('el', 'de', 'en', 'a') antes de calcular la intersección. Si no se eliminan, las glosas coincidirán\nartificialmente en palabras gramaticales vacías, arruinando la desambiguación.", "image": "./examenes_resueltos_master_ia_pages/page_53.jpg", "title": "Tema 2 PLN UNIR; Salton & Bu ckley (1988). TF-IDF eq uilibra la saliencia local de un término d", "blocks": [{"type": "paragraph", "text": "Tema 2 PLN UNIR; Salton & Bu ckley (1988). TF-IDF eq uilibra la saliencia local de un término dentro de un docu mento frente a su carácter discriminativo global en el corp us."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "Confundir $DF(t)$ (número de docu mentos donde aparece) con el conteo total de apariciones del término en todo el corp us. El denominador de IDF siempre es el número de docu mentos, no el total de palabras."}, {"type": "paragraph", "text": "PLN Tema 5: Desambiguación Léxica (WSD) Ejercicio Oficial de Examen PLN-EJ-04"}, {"type": "paragraph", "text": "Algoritmo de Lesk Original vs. Lesk Simplificado"}, {"type": "paragraph", "text": "Expliq ue el funcionamiento del Algoritmo de Lesk (1986) para la desambiguación del sentido de las palabras (WSD)."}, {"type": "paragraph", "text": "Contraste formalmente el algoritmo de Lesk original frente al algoritmo de Lesk simplificado y resuelva el ejemplo clásico de desambiguación de la palabra polisémica 'banco' (entidad financiera vs. asiento de parq ue)."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Fundamento conceptual del Algoritmo de Lesk: Prop uesto por Michael E. Lesk en 1986, el algoritmo opera bajo la hipótesis de q ue las palabras q ue coocurren en una misma oración o contexto discursivo tienden a compartir un dominio semántico coherente. Por lo tanto, el sentido correcto de una palabra ambigua es aq uel cuya definición o glosa en un diccionario formal (como WordNet) presenta el mayor solapamiento léxico"}, {"type": "paragraph", "text": "(overlap de palabras compartidas) con las definiciones o palabras del contexto circundante. 2. Lesk Original vs. Lesk Simplificado (Kilgarriff & Rosenzweig, 2000): • Lesk Original (1986): Calcula el solapamiento entre las glosa s de toda s la s palabra s q ue aparecen en la ventana de contexto de forma combinatoria sim ultánea. Si hay $k$ palabras con $s$ sentidos cada una, el espacio de búsq ueda combinatorio es $O(s^k)$, lo cual es comp utacionalmente prohibitivo para oraciones largas. • Lesk Simplificado: Desambigua una palabra objetivo"}, {"type": "paragraph", "text": "$w$ a la vez. Compara la glosa de cada sentido posible de $w$ en WordNet directamente contra las palabras presentes en la propia frase u oración de contexto, eliminando palabras vacías (stop words): $$\\hat{s} ="}, {"type": "paragraph", "text": "\\arg\\max_{s \\in \\text{Sentidos}(w)} \\left| \\text{Palabras}(\\text{Glosa}(s)) \\cap \\text{Palabras}(\\text{Contexto})"}, {"type": "paragraph", "text": "\\right|$$ La complejidad se redu ce a $O(s)$, siendo su mamente rápido y eficiente. 3. Ejemplo práctico resuelto: Desambiguación de 'banco': • Oración de prueba: \"El cliente fue al banco a depositar dinero e invertir en f ondos de inversión.\" • Sentidos en WordNet: - Sentido 1 (Financiero): Glosa = \"Entidad o institución financiera de crédito que recibe dinero de clientes para préstamos e inversión.\" - Sentido 2 (Mobiliario): Glosa"}, {"type": "paragraph", "text": "= \"Asiento de madera o piedra en el que pueden sentarse varia s persona s en una plaza o parque.\" • Palabras de contexto (sin stop words): {cliente, depositar, dinero, invertir, fondos, inversión}. • Cálculo de intersección: -"}, {"type": "paragraph", "text": "Intersección con Sentido 1: {dinero, cliente, inversión} $\\to$ Solapamiento = 3 palabras. - Intersección con"}, {"type": "paragraph", "text": "Sentido 2: $\\emptyset$ $\\to$ Solapamiento = 0 palabras. • Asignación: El algoritmo selecciona unívocamente el Sentido 1 (Institu ción financiera)."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "Constituye el algoritmo canónico basado en conocimiento para WSD en el temario oficial de PLN UNIR (Tema 5)."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "No eliminar las stop words ('el', 'de', 'en', 'a') antes de calcular la intersección. Si no se eliminan, las glosas coincidirán artificialmente en palabras gramaticales vacías, arruinando la desambiguación."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_54.jpg", "width": 918, "page": 54, "height": 1188, "text": "PLN Tema 5: Desambiguación Léxica Vectorial Ejercicio Oficial de Examen PLN-EJ-05\nEnfoq\nue Vectorial de Hinrich Schütze (Word Space Model)\nDescriba detalladamente el método no su\npervisado de discriminación del sentido de las palabras prop\nuesto por\nHinrich Schütze (1998) mediante clustering en espacios vectoriales (Word Space). Expliq\nue la constru\ncción de\nvectores de contexto, redu\ncción de dimensionalidad con SVD y asignación de nuevas instancias.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Fundamento del Enfoq\nue de Schütze (1998): A diferencia de Lesk, Schütze prop\nuso un enfoq\nue\nestrictamente no su\npervisado y p\nuramente cuantitativo q\nue no depende de diccionarios preexistentes como\nWordNet. Su\nmétodo no busca asignar una etiq\nueta predefinida a un sentido, sino discriminar o\nagrupar las\nocurrencias de una palabra en clusters semánticos homogéneos basados en la distribu\nción empírica de sus\ncontextos. 2. Fases del Algoritmo de Schütze: 1. Constru\ncción de la Matriz de Coocurrencia Palabra-\nPalabra: Se seleccionan las $M$ palabras de contenido más frecuentes del corp\nus. Se construye una matriz $C$\nde tamaño $M \\times M$, donde cada celda $C_{ij}$ registra la frecuencia con la q\nue la palabra $i$ coocurre con\nla palabra $j$ dentro de una ventana de texto fija (p. ej., $\\pm 5$ palabras). 2.\nRedu\ncción de Dimensionalidad\n(Espacio Semántico Latente): Se aplica Descomposición en Valores Singulares (SVD) sobre la matriz\nnormalizada (mediante PPMI o TF-IDF): $$C \\approx U \\Sigma V^T$$ Se conservan los primeros $k$ factores\nlatentes (p. ej., $k = 100$), obteniendo para cada palabra de contexto un vector denso $\\vec{v}_w \\in\n\\mathbb{R}^k$. 3. Constru\ncción de Vectores de Contexto: Para cada instancia $i$ de la palabra ambigua en un\ntexto, se calcula su vector de contexto $\\vec{c}_i$ como el centroide o promedio normalizado de los vectores\ndensos de todas las palabras q\nue la rodean: $$\\vec{c}_i = \\frac{1}{|Contexto|} \\su\nm_{w \\in Contexto} \\vec{v}_w$$\n4. Clustering No Su\npervisado de Sentidos: Se aplican algoritmos de agru\npamiento como K-Means o mezclas\nde gaussianas sobre el conjunto de todos los vectores de contexto $\\{\\vec{c}_1, \\vec{c}_2, \\dots, \\vec{c}_N\\}$. Si\nse fijan $K = 2$ clusters para la palabra 'banco', se obtendrán dos centroides $\\vec{\\m\nu}_1$ y $\\vec{\\m\nu}_2$. 5.\nDesambiguación de Nuevas Instancias: Para desambiguar una nueva aparición de la palabra, se calcula su\nvector de contexto y se asigna al cluster cuyo centroide presente la mayor similitud coseno: $$\\hat{k} =\n\\arg\\max_{k} \\frac{\\vec{c}_{nuevo} \\cdot \\vec{\\m\nu}_k}{\\|\\vec{c}_{nuevo}\\| \\|\\vec{\\m\nu}_k\\|}$$\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nTema 5 PLN UNIR; Schütze (1998). Es el precursor conceptual directo de los modernos embeddings\ncontextuales de transformers (BERT/RoBERTa).\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nConfundir el vector de una palabra con el vector de un contexto. El vector de contexto es el promedio de los vectores\nde las palabras q\nue rodean a la instancia ambigua.", "title": "PLN Tema 5: Desambiguación Léxica Vectorial Ejercicio Oficial de Examen PLN-EJ-05", "blocks": [{"type": "title", "text": "PLN Tema 5: Desambiguación Léxica Vectorial Ejercicio Oficial de Examen PLN-EJ-05"}, {"type": "paragraph", "text": "Enfoq ue Vectorial de Hinrich Schütze (Word Space Model)"}, {"type": "paragraph", "text": "Describa detalladamente el método no su pervisado de discriminación del sentido de las palabras prop uesto por"}, {"type": "paragraph", "text": "Hinrich Schütze (1998) mediante clustering en espacios vectoriales (Word Space). Expliq ue la constru cción de vectores de contexto, redu cción de dimensionalidad con SVD y asignación de nuevas instancias."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Fundamento del Enfoq ue de Schütze (1998): A diferencia de Lesk, Schütze prop uso un enfoque estrictamente no su pervisado y p uramente cuantitativo q ue no depende de diccionarios preexistentes como"}, {"type": "paragraph", "text": "WordNet. Su método no busca asignar una etiq ueta predefinida a un sentido, sino discriminar o agrupar las ocurrencias de una palabra en clusters semánticos homogéneos basados en la distribu ción empírica de sus contextos. 2. Fases del Algoritmo de Schütze: 1. Constru cción de la Matriz de Coocurrencia PalabraPalabra: Se seleccionan las $M$ palabras de contenido más frecuentes del corp us. Se construye una matriz $C$ de tamaño $M \\times M$, donde cada celda $C_{ij}$ registra la frecuencia con la q ue la palabra $i$ coocurre con la palabra $j$ dentro de una ventana de texto fija (p. ej., $\\pm 5$ palabras). 2."}, {"type": "paragraph", "text": "Redu cción de Dimensionalidad"}, {"type": "paragraph", "text": "(Espacio Semántico Latente): Se aplica Descomposición en Valores Singulares (SVD) sobre la matriz normalizada (mediante PPMI o TF-IDF): $$C \\approx U \\Sigma V^T$$ Se conservan los primeros $k$ factores latentes (p. ej., $k = 100$), obteniendo para cada palabra de contexto un vector denso $\\vec{v}_w \\in"}, {"type": "paragraph", "text": "\\mathbb{R}^k$. 3. Constru cción de Vectores de Contexto: Para cada instancia $i$ de la palabra ambigua en un texto, se calcula su vector de contexto $\\vec{c}_i$ como el centroide o promedio normalizado de los vectores densos de todas las palabras q ue la rodean: $$\\vec{c}_i = \\frac{1}{|Contexto|} \\su m_{w \\in Contexto} \\vec{v}_w$$"}, {"type": "bullet", "text": "4. Clustering No Su pervisado de Sentidos: Se aplican algoritmos de agru pamiento como K-Means o mezclas de gaussianas sobre el conjunto de todos los vectores de contexto $\\{\\vec{c}_1, \\vec{c}_2, \\dots, \\vec{c}_N\\}$. Si se fijan $K = 2$ clusters para la palabra 'banco', se obtendrán dos centroides $\\vec{\\m u}_1$ y $\\vec{\\m u}_2$. 5."}, {"type": "paragraph", "text": "Desambiguación de Nuevas Instancias: Para desambiguar una nueva aparición de la palabra, se calcula su vector de contexto y se asigna al cluster cuyo centroide presente la mayor similitud coseno: $$\\hat{k} ="}, {"type": "paragraph", "text": "\\arg\\max_{k} \\frac{\\vec{c}_{nuevo} \\cdot \\vec{\\m u}_k}{\\|\\vec{c}_{nuevo}\\| \\|\\vec{\\m u}_k\\|}$$"}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "Tema 5 PLN UNIR; Schütze (1998). Es el precursor conceptual directo de los modernos embeddings contextuales de transformers (BERT/RoBERTa)."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "Confundir el vector de una palabra con el vector de un contexto. El vector de contexto es el promedio de los vectores de las palabras q ue rodean a la instancia ambigua."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_55.jpg", "height": 1188, "width": 918, "text": "PLN Tema 5: Desambiguación Léxica Semisu\npervisada Ejercicio Oficial de Examen PLN-EJ-06\nAlgoritmo de Bootstrapping de David Yarowsky (1995)\nExpliq\nue el Algoritmo de Yarowsky (1995) para la desambiguación léxica no su\npervisada/semisu\npervisada. Detalle\nlos dos principios cognitivo-lingüísticos fundamentales en los q\nue se sustenta, el proceso iterativo de bootstrapping y\nel criterio de parada.\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Los Dos Principios Fundamentales de Yarowsky: El algoritmo de David Yarowsky se sustenta en dos\nhipótesis ecolingüísticas su\nmamente potentes: 1. Un sentido por colocación (One sense per collocation): Las\npalabras q\nue aparecen inmediatamente adyacentes o en una relación sintáctica local fija con la palabra ambigua\nson predictores casi infalibles de su sentido. (P. ej., 'pesca de *banco*' $\\to$ banco de peces; '*banco* central'\n$\\to$ financiero). 2. Un sentido por discurso (One sense per discourse): La naturaleza o sentido de una\npalabra polisémica es monótona y consistente a lo largo de un mismo docu\nmento o discurso. Si un docu\nmento\ntrata de finanzas, el 99.8% de las veces q\nue aparezca 'banco' en ese mismo docu\nmento, se referirá al sentido\nfinanciero. 2. Proceso Iterativo de Bootstrapping: 1. Fase de Semillas (Seeds Initialization): A partir de un\ncorp\nus masivo sin anotar, el usuario define 1 o 2 colocaciones semilla triviales para cada sentido (p. ej., Semilla\nSentido A: 'crédito'; Semilla Sentido B: 'pez'). 2. Entrenamiento del Clasificador Inicial: Se etiq\nuetan\nautomáticamente únicamente los ejemplos del corp\nus q\nue contienen las palabras semilla. Con este conjunto\ninicial peq\nueño se entrena un clasificador basado en listas de decisión ponderadas por log-likelihood ratio:\n$$Score = \\left| \\log\\left(\\frac{P(\\text{Sentido } A | \\text{colocación})}{P(\\text{Sentido } B |\n\\text{colocación})}\\right) \\right|$$ 3. Propagación y Reetiq\nuetado Iterativo: El clasificador evalúa el resto del\ncorp\nus sin anotar. Los ejemplos clasificados con alta probabilidad se incorporan al conjunto de entrenamiento. 4.\nAplicación del principio 'Un sentido por discurso': Si la mayoría de las ocurrencias de 'banco' en un\ndocu\nmento fueron asignadas al Sentido A, se fuerza q\nue todas las demás instancias dudosas de ese mismo\ndocu\nmento se reclasifiq\nuen como Sentido A. 5. Convergencia / Criterio de Parada: El proceso se repite\niterativamente hasta q\nue el conjunto de etiq\nuetas asignadas a las colocaciones del corp\nus se estabiliza\n(convergencia estricta, no hay cambios en la lista de decisión).\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nTema 5 PLN UNIR; Yarowsky (1995). Alcanza precisiones su\nperiores al 95% con mínima su\npervisión inicial\nhu\nmana.\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nOlvidar q\nue Yarowsky entrena una Lista de Decisión ordenada por fiabilidad probabilística decreciente, no un simple\nclasificador Naïve Bayes plano.", "page": 55, "title": "PLN Tema 5: Desambiguación Léxica Semisu pervisada Ejercicio Oficial de Examen PLN-EJ-06", "blocks": [{"type": "title", "text": "PLN Tema 5: Desambiguación Léxica Semisu pervisada Ejercicio Oficial de Examen PLN-EJ-06"}, {"type": "paragraph", "text": "Algoritmo de Bootstrapping de David Yarowsky (1995)"}, {"type": "paragraph", "text": "Expliq ue el Algoritmo de Yarowsky (1995) para la desambiguación léxica no su pervisada/semisu pervisada. Detalle los dos principios cognitivo-lingüísticos fundamentales en los q ue se sustenta, el proceso iterativo de bootstrapping y el criterio de parada."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Los Dos Principios Fundamentales de Yarowsky: El algoritmo de David Yarowsky se sustenta en dos hipótesis ecolingüísticas su mamente potentes: 1. Un sentido por colocación (One sense per collocation): Las palabras q ue aparecen inmediatamente adyacentes o en una relación sintáctica local fija con la palabra ambigua son predictores casi infalibles de su sentido. (P. ej., 'pesca de *banco*' $\\to$ banco de peces; '*banco* central'"}, {"type": "paragraph", "text": "$\\to$ financiero). 2. Un sentido por discurso (One sense per discourse): La naturaleza o sentido de una palabra polisémica es monótona y consistente a lo largo de un mismo docu mento o discurso. Si un docu mento trata de finanzas, el 99.8% de las veces q ue aparezca 'banco' en ese mismo docu mento, se referirá al sentido financiero. 2. Proceso Iterativo de Bootstrapping: 1. Fase de Semillas (Seeds Initialization): A partir de un corp us masivo sin anotar, el usuario define 1 o 2 colocaciones semilla triviales para cada sentido (p. ej., Semilla"}, {"type": "paragraph", "text": "Sentido A: 'crédito'; Semilla Sentido B: 'pez'). 2. Entrenamiento del Clasificador Inicial: Se etiq uetan automáticamente únicamente los ejemplos del corp us q ue contienen las palabras semilla. Con este conjunto inicial peq ueño se entrena un clasificador basado en listas de decisión ponderadas por log-likelihood ratio:"}, {"type": "paragraph", "text": "$$Score = \\left| \\log\\left(\\frac{P(\\text{Sentido } A | \\text{colocación})}{P(\\text{Sentido } B |"}, {"type": "paragraph", "text": "\\text{colocación})}\\right) \\right|$$ 3. Propagación y Reetiq uetado Iterativo: El clasificador evalúa el resto del corp us sin anotar. Los ejemplos clasificados con alta probabilidad se incorporan al conjunto de entrenamiento. 4."}, {"type": "paragraph", "text": "Aplicación del principio 'Un sentido por discurso': Si la mayoría de las ocurrencias de 'banco' en un docu mento fueron asignadas al Sentido A, se fuerza q ue todas las demás instancias dudosas de ese mismo docu mento se reclasifiq uen como Sentido A. 5. Convergencia / Criterio de Parada: El proceso se repite iterativamente hasta q ue el conjunto de etiq uetas asignadas a las colocaciones del corp us se estabiliza"}, {"type": "paragraph", "text": "(convergencia estricta, no hay cambios en la lista de decisión)."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "Tema 5 PLN UNIR; Yarowsky (1995). Alcanza precisiones su periores al 95% con mínima su pervisión inicialhu mana."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "Olvidar q ue Yarowsky entrena una Lista de Decisión ordenada por fiabilidad probabilística decreciente, no un simple clasificador Naïve Bayes plano."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_56.jpg", "text": "PLN Tema 4: Análisis Sintáctico (Parsing) Ejercicio Oficial de Examen PLN-EJ-07\nAlgoritmo CKY (Cocke-Younger-Kasami) y Gramáticas en FNC\n1. Defina formalmente los req\nuisitos estru\ncturales de una Gramática Libre de Contexto en Forma Normal de\nChomsky (FNC) para su uso con el algoritmo CKY.\n2. Expliq\nue la estru\nctura de la tabla de programación dinámica triangular del algoritmo CKY y su\ncomplejidad temporal\nteórica.\n3. ¿Cómo resuelve el algoritmo la ambigüedad sintáctica en oraciones con sintagmas preposicionales adjuntos (PP-\nattachment)?\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Forma Normal de Chomsky (FNC): Una Gramática Libre de Contexto $G = (V_N, V_T, P, S)$ está en Forma\nNormal de Chomsky si todas sus reglas de produ\ncción adoptan exclusivamente una de las dos formas siguientes:\n1. $A \\to B \\; C$ (Un no-terminal produ\nce exactamente dos no-terminales, donde $B, C \\in V_N$). 2. $A \\to a$\n(Un no-terminal produ\nce exactamente un símbolo terminal del léxico, donde $a \\in V_T$). (Se permite $S \\to\n\\epsilon$ si la cadena vacía pertenece al lenguaje, en cuyo caso $S$ no p\nuede aparecer en el lado derecho de\nninguna produ\ncción). Toda gramática libre de contexto p\nuede transformarse a FNC mediante 4 pasos:\neliminación de produ\ncciones $\\epsilon$, eliminación de reglas unitarias ($A \\to B$), reemplazo de terminales\naislados y factorización de reglas largas ($A \\to B C D$). 2. Estru\nctura de la Tabla CKY y Complejidad: Para\nuna oración de $N$ palabras $w_1,\nw_2, \\dots,\nw_N$, CKY construye una tabla triangular su\nperior $T$ de tamaño\n$(N+1) \\times (N+1)$ indexada por posiciones de delimitación entre palabras $[i, j]$ (con $0 \\le i < j \\le N$): •\nInicialización (Longitud 1): Las celdas de la diagonal principal $T[i-1, i]$ contienen todos los no-terminales $A$\ntales q\nue existe una regla $A \\to w_i$ en el léxico. • Paso indu\nctivo (Longitudes $l = 2, \\dots, N$): Para\nabarcar la subsecuencia de la palabra $i$ a la $j$, se prueba todo p\nunto de división intermedio $k$ ($i < k < j$):\n$$T[i, j] = \\{ A \\mid A \\to B \\; C \\in P, \\; B \\in T[i, k], \\; C \\in T[k, j] \\}$$ • Complejidad algorítmica: Existen 3\nbu\ncles anidados: longitud de la subsecuencia ($O(N)$), posición inicial ($O(N)$) y p\nunto de división intermedio\n($O(N)$), m\nultiplicado por el número de produ\ncciones de la gramática $|P|$. Por ende, la complejidad temporal\nes exactamente $O(N^3 \\cdot |P|)$, infinitamente más eficiente q\nue el parsing ingenuo exponencial $O(|P|^N)$.\n3.\nResolu\nción de la Ambigüedad Sintáctica (PP-Attachment): En oraciones ambiguas como \"Vi al h\nombre c\non\nel telesc\nopio\", la celda su\nperior $T[0, N]$ contendrá múltiples árboles de derivación válidos (el sintagma\npreposicional 'con el telescopio' p\nuede modificar al verbo 'Vi' o al sintagma nominal 'el hombre'). El algoritmo\nCKY estándar almacena p\nunteros a ambas derivaciones; si se utiliza CKY Probabilístico (PCFG),\ncada celda\nalmacena la probabilidad máxima $P(A \\to B C) \\cdot P(B) \\cdot P(C)$, seleccionando deterministamente el árbol\ncon mayor probabilidad conjunta.\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nTema 4 PLN UNIR; Younger (1967). Algoritmo fundacional de análisis sintáctico formal.\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN\nOlvidar q\nue CKY exige OBLIGATO\nRIAMENTE q\nue la gramática esté en FNC. Si se introdu\nce una gramática con reglas\nde 3 o más símbolos a la derecha ($S \\to NP \\; VP \\; PP$), el algoritmo CKY es inaplicable sin binarización previa.", "width": 918, "page": 56, "height": 1188, "title": "PLN Tema 4: Análisis Sintáctico (Parsing) Ejercicio Oficial de Examen PLN-EJ-07", "blocks": [{"type": "title", "text": "PLN Tema 4: Análisis Sintáctico (Parsing) Ejercicio Oficial de Examen PLN-EJ-07"}, {"type": "paragraph", "text": "Algoritmo CKY (Cocke-Younger-Kasami) y Gramáticas en FNC"}, {"type": "bullet", "text": "1. Defina formalmente los req uisitos estru cturales de una Gramática Libre de Contexto en Forma Normal de"}, {"type": "paragraph", "text": "Chomsky (FNC) para su uso con el algoritmo CKY."}, {"type": "bullet", "text": "2. Expliq ue la estru ctura de la tabla de programación dinámica triangular del algoritmo CKY y su complejidad temporal teórica."}, {"type": "bullet", "text": "3. ¿Cómo resuelve el algoritmo la ambigüedad sintáctica en oraciones con sintagmas preposicionales adjuntos (PPattachment)?"}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Forma Normal de Chomsky (FNC): Una Gramática Libre de Contexto $G = (V_N, V_T, P, S)$ está en Forma"}, {"type": "paragraph", "text": "Normal de Chomsky si todas sus reglas de produ cción adoptan exclusivamente una de las dos formas siguientes:"}, {"type": "bullet", "text": "1. $A \\to B \\; C$ (Un no-terminal produ ce exactamente dos no-terminales, donde $B, C \\in V_N$). 2. $A \\to a$"}, {"type": "paragraph", "text": "(Un no-terminal produ ce exactamente un símbolo terminal del léxico, donde $a \\in V_T$). (Se permite $S \\to"}, {"type": "paragraph", "text": "\\epsilon$ si la cadena vacía pertenece al lenguaje, en cuyo caso $S$ no p uede aparecer en el lado derecho de ninguna produ cción). Toda gramática libre de contexto p uede transformarse a FNC mediante 4 pasos:"}, {"type": "paragraph", "text": "eliminación de produ cciones $\\epsilon$, eliminación de reglas unitarias ($A \\to B$), reemplazo de terminales aislados y factorización de reglas largas ($A \\to B C D$). 2. Estru ctura de la Tabla CKY y Complejidad: Para una oración de $N$ palabras $w_1, w_2, \\dots, w_N$, CKY construye una tabla triangular su perior $T$ de tamaño"}, {"type": "paragraph", "text": "$(N+1) \\times (N+1)$ indexada por posiciones de delimitación entre palabras $[i, j]$ (con $0 \\le i < j \\le N$): •"}, {"type": "paragraph", "text": "Inicialización (Longitud 1): Las celdas de la diagonal principal $T[i-1, i]$ contienen todos los no-terminales $A$ tales q ue existe una regla $A \\to w_i$ en el léxico. • Paso indu ctivo (Longitudes $l = 2, \\dots, N$): Para abarcar la subsecuencia de la palabra $i$ a la $j$, se prueba todo p unto de división intermedio $k$ ($i < k < j$):"}, {"type": "paragraph", "text": "$$T[i, j] = \\{ A \\mid A \\to B \\; C \\in P, \\; B \\in T[i, k], \\; C \\in T[k, j] \\}$$ • Complejidad algorítmica: Existen 3bu cles anidados: longitud de la subsecuencia ($O(N)$), posición inicial ($O(N)$) y p unto de división intermedio"}, {"type": "paragraph", "text": "($O(N)$), m ultiplicado por el número de produ cciones de la gramática $|P|$. Por ende, la complejidad temporal es exactamente $O(N^3 \\cdot |P|)$, infinitamente más eficiente q ue el parsing ingenuo exponencial $O(|P|^N)$."}, {"type": "paragraph", "text": "3."}, {"type": "paragraph", "text": "Resolu ción de la Ambigüedad Sintáctica (PP-Attachment): En oraciones ambiguas como \"Vi al h ombre con el telesc opio\", la celda su perior $T[0, N]$ contendrá múltiples árboles de derivación válidos (el sintagma preposicional 'con el telescopio' p uede modificar al verbo 'Vi' o al sintagma nominal 'el hombre'). El algoritmo"}, {"type": "paragraph", "text": "CKY estándar almacena p unteros a ambas derivaciones; si se utiliza CKY Probabilístico (PCFG), cada celda almacena la probabilidad máxima $P(A \\to B C) \\cdot P(B) \\cdot P(C)$, seleccionando deterministamente el árbol con mayor probabilidad conjunta."}, {"type": "heading", "text": "📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)"}, {"type": "paragraph", "text": "Tema 4 PLN UNIR; Younger (1967). Algoritmo fundacional de análisis sintáctico formal."}, {"type": "heading", "text": "⚠ ERRO"}, {"type": "heading", "text": "RES TÍPICOS Y TRAMPAS DE EXAMEN"}, {"type": "paragraph", "text": "Olvidar q ue CKY exige OBLIGATO"}, {"type": "paragraph", "text": "RIAMENTE q ue la gramática esté en FNC. Si se introdu ce una gramática con reglas de 3 o más símbolos a la derecha ($S \\to NP \\; VP \\; PP$), el algoritmo CKY es inaplicable sin binarización previa."}]}, {"text": "PLN Tema 6: Redes Neuronales y Transformers Ejercicio Oficial de Examen PLN-EJ-08\nArq\nuitectura Transformer y Mecanismo de Autoatención Escalada\n1. Desarrolle la form\nulación matemática de la Autoatención por Produ\ncto Escalar Escalado (Scaled Dot-Produ\nct\nAttention) introdu\ncida en 'Attention is All You Need' (Vaswani et al., 2017).\n2.\nJustifiq\nue analíticamente la inclusión del factor de escala $\\frac{1}{\\sqrt{d_k}}$ en el denominador de la función\nsoftmax.\n3. Expliq\nue la arq\nuitectura de la Atención Multicabeza (Multi-Head Attention) y por q\nu\né es necesaria la codificación\nposicional (Positional Encoding).\n✅ RESOLUCIÓN OFICIAL PASO A PASO\n1. Form\nulación de la Autoatención por Produ\ncto Escalar Escalado: Dado un conjunto de vectores de entrada\nproyectados linealmente mediante matrices de pesos entrenables $W_Q, W_K\n, W_V \\in \\mathbb{R}^{d_{model}\n\\times d_k}$ para generar las matrices de Consultas ($Q$), Claves ($K$) y Valores ($V$): $$\\text{Attention}(Q,\nK\n, V) = \\text{softmax}\\left( \\frac{Q \\cdot K^T}{\\sqrt{d_k}} \\right) \\cdot V$$ donde: • $Q \\cdot K^T$ calcula la\nsimilitud por produ\ncto escalar entre cada consulta y todas las claves. • La función $\\text{softmax}$ normaliza las\np\nuntuaciones por fila, generando una distribu\nción de pesos de atención q\nue su\nman 1. • La m\nultiplicación final por\n$V$ produ\nce una su\nma ponderada de los vectores de valores según su relevancia contextual. 2.\nJustificación\nmatemática del factor de escala $\\frac{1}{\\sqrt{d_k}}$: Asu\nmamos q\nue las componentes de los vectores $q$\ny $k$ son variables aleatorias independientes e idénticamente distribuidas con media 0 y varianza 1:\n$$\\mathbb{E}[q_i] = 0, \\q\nuad \\text{Var}(q_i) = 1, \\q\nuad \\mathbb{E}[k_i] = 0, \\q\nuad \\text{Var}(k_i) = 1$$ El\nprodu\ncto escalar es la su\nma de $d_k$ términos: $q \\cdot k = \\su\nm_{i=1}^{d_k} q_i k_i$. La esperanza del\nprodu\ncto escalar es 0, pero su varianza es la su\nma de varianzas: $$\\text{Var}(q \\cdot k) = \\su\nm_{i=1}^{d_k}\n\\text{Var}(q_i k_i) = \\su\nm_{i=1}^{d_k} \\text{Var}(q_i) \\cdot \\text{Var}(k_i) = d_k$$ Por consiguiente, la desviación\ntípica del produ\ncto escalar crece como $\\sqrt{d_k}$. Para dimensiones grandes (p. ej., $d_k = 64$ o $d_k =\n128$), la magnitud de $Q K^T$ alcanza valores extremadamente grandes. Al aplicar la función $\\text{softmax}$,\nlos valores m\nuy altos emp\nujan a la función exponencial hacia regiones con gradientes extremadamente\npeq\nueños y cercanos a cero (saturación de softmax), provocando el colapso del aprendizaje por\ndesvanecimiento del gradiente (vanishing gradient). Al dividir por $\\sqrt{d_k}$, la varianza se reescala\nexactamente a 1, preservando gradientes saludables durante el backpropagation. 3. Atención Multicabeza y\nCodificación Posicional: • Multi-Head Attention: En lugar de calcular una sola atención sobre $d_{model}$, se\nproyectan $Q,\nK\n, V$ en $h$ subespacios independientes de menor dimensión ($d_k = d_{model}/h$). Esto\npermite al modelo atender sim\nultáneamente a diferentes aspectos sintácticos y semánticos en distintas\nposiciones (p. ej.,\nuna cabeza atiende a relaciones sujeto-verbo, otra a correferencias y otra a dependencias\npreposicionales): $$\\text{MultiHead}(Q,\nK\n, V) = \\text{Concat}(\\text{head}_1, \\dots, \\text{head}_h) \\cdot W^O$$ •\nNecesidad de la Codificación Posicional (Positional Encoding): Dado q\nue la operación de atención es\ncompletamente invariante ante perm\nutaciones (es un conjunto de operaciones matriciales sin noción inherente\ndel orden temporal o secuencial de las palabras), es imprescindible inyectar explícitamente información de\nposición su\nmando vectores sinusoidales a las representaciones iniciales de las palabras: $$PE_{(pos, 2i)} =\n\\sin\\left( \\frac{pos}{10000^{\\frac{2i}{d_{model}}}} \\right), \\q\nuad PE_{(pos, 2i+1)} = \\cos\\left( \\frac{pos}\n{10000^{\\frac{2i}{d_{model}}}} \\right)$$\n📘 FUNDAMENTACIÓN TEÓRICA Y LINGÜÍSTICA (UNIR)\nTema 6 PLN UNIR; Vaswani et al. (2017). Es la arq\nuitectura nu\nclear de los Large Language Models modernos\n(GPT-4, Claude, Gemini, LLaMA).\n⚠ ERR\nO\nRES TÍPICOS Y TRAMPAS DE EXAMEN", "width": 918, "page": 57, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_57.jpg", "title": "PLN Tema 6: Redes Neuronales y Transformers Ejercicio Oficial de Examen PLN-EJ-08 Arq uitectura", "blocks": [{"type": "paragraph", "text": "PLN Tema 6: Redes Neuronales y Transformers Ejercicio Oficial de Examen PLN-EJ-08 Arq uitectura Transformer y Mecanismo de Autoatención Escalada"}, {"type": "bullet", "text": "1. Desarrolle la form ulación matemática de la Autoatención por Produ cto Escalar Escalado (Scaled Dot-Product"}, {"type": "paragraph", "text": "Attention) introdu cida en 'Attention is All You Need' (Vaswani et al., 2017)."}, {"type": "paragraph", "text": "2."}, {"type": "paragraph", "text": "Justifiq ue analíticamente la inclusión del factor de escala $\\frac{1}{\\sqrt{d_k}}$ en el denominador de la función softmax."}, {"type": "bullet", "text": "3. Expliq ue la arq uitectura de la Atención Multicabeza (Multi-Head Attention) y por qu"}, {"type": "paragraph", "text": "é es necesaria la codificación posicional (Positional Encoding)."}, {"type": "heading", "text": "✅ RESOLUCIÓN OFICIAL PASO A PASO"}, {"type": "bullet", "text": "1. Form ulación de la Autoatención por Produ cto Escalar Escalado: Dado un conjunto de vectores de entrada proyectados linealmente mediante matrices de pesos entrenables $W_Q, W_K"}, {"type": "paragraph", "text": ", W_V \\in \\mathbb{R}^{d_{model}"}, {"type": "paragraph", "text": "\\times d_k}$ para generar las matrices de Consultas ($Q$), Claves ($K$) y Valores ($V$): $$\\text{Attention}(Q,K"}, {"type": "paragraph", "text": ", V) = \\text{softmax}\\left( \\frac{Q \\cdot K^T}{\\sqrt{d_k}} \\right) \\cdot V$$ donde: • $Q \\cdot K^T$ calcula la similitud por produ cto escalar entre cada consulta y todas las claves. • La función $\\text{softmax}$ normaliza lasp untuaciones por fila, generando una distribu ción de pesos de atención q ue su man 1. • La m ultiplicación final por"}, {"type": "paragraph", "text": "$V$ produ ce una su ma ponderada de los vectores de valores según su relevancia contextual. 2."}, {"type": "paragraph", "text": "Justificación matemática del factor de escala $\\frac{1}{\\sqrt{d_k}}$: Asu mamos q ue las componentes de los vectores $q$ y $k$ son variables aleatorias independientes e idénticamente distribuidas con media 0 y varianza 1:"}, {"type": "paragraph", "text": "$$\\mathbb{E}[q_i] = 0, \\q uad \\text{Var}(q_i) = 1, \\q uad \\mathbb{E}[k_i] = 0, \\q uad \\text{Var}(k_i) = 1$$ El produ cto escalar es la su ma de $d_k$ términos: $q \\cdot k = \\su m_{i=1}^{d_k} q_i k_i$. La esperanza del produ cto escalar es 0, pero su varianza es la su ma de varianzas: $$\\text{Var}(q \\cdot k) = \\su m_{i=1}^{d_k}"}, {"type": "paragraph", "text": "\\text{Var}(q_i k_i) = \\su m_{i=1}^{d_k} \\text{Var}(q_i) \\cdot \\text{Var}(k_i) = d_k$$ Por consiguiente, la desviación típica del produ cto escalar crece como $\\sqrt{d_k}$. Para dimensiones grandes (p. ej., $d_k = 64$
