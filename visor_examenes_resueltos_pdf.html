s durante la fase de optimización o ajuste (Diapositivas Tema 1, pág. 12). Un\nmodelo q\nue únicamente minimiza el error empírico sobre los datos de entrenamiento corre el riesgo de\nsobreajustar.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A confunde aprendizaje con memorización estricta (overfitting extremo o looku\np table). Distractor B ignora\nel dilema sesgo-varianza, p\nues un error cero en entrenamiento suele asociarse a nula capacidad predictiva externa.\nDistractor D confunde su\npervisado con no su\npervisado.", "page": 4, "width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_4.jpg", "title": "TAA Tema 1: Introdu cción al Aprendizaje Automático Test Oficial · Pregunta 3 +0.75 pts / -0.25", "blocks": [{"type": "paragraph", "text": "TAA Tema 1: Introdu cción al Aprendizaje Automático Test Oficial · Pregunta 3 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "3. ¿Qu"}, {"type": "paragraph", "text": "é objetivo principal tiene un modelo de aprendizaje su pervisado?"}, {"type": "paragraph", "text": "AMemorizar todos los datos de entrenamiento."}, {"type": "paragraph", "text": "BMinimizar el error solo en los datos de entrenamiento."}, {"type": "paragraph", "text": "C Generalizar correctamente sobre datos nuevos no observados. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Trabajar únicamente con datos sin etiq uetas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El objetivo fundamental del aprendizaje su pervisado es maximizar la capacidad de generalización del modelo sobre datos nuevos, no observados durante la fase de optimización o ajuste (Diapositivas Tema 1, pág. 12). Un modelo q ue únicamente minimiza el error empírico sobre los datos de entrenamiento corre el riesgo de sobreajustar."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍ al Aprendizaje Automático Test Oficial · Pregunta 4 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "4. ¿Cu"}, {"type": "paragraph", "text": "ál de las siguientes afirmaciones sobre el overfitting es correcta?AO curre cuando el modelo es demasiado simple."}, {"type": "paragraph", "text": "B Implica un buen rendimiento tanto en entrenamiento como en test."}, {"type": "paragraph", "text": "C Se produ ce cuando el modelo se ajusta excesivamente a los datos de entrenamiento."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Es un problema exclusivo de modelos lineales."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El sobreajuste (overfitting) se define formalmente como el fenómeno patológico donde un modelo excesivamente complejo aprende y memoriza el ruido estadístico y las flu ctuaciones esp urias del conjunto de entrenamiento en lugar de captar el patrón subyacente de la población (Diapositivas Tema 1, pág. 16). Se caracteriza por un error empírico de entrenamiento su mamente bajo, pero un error de generalización en test m uy elevado."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe el underfitting (subajuste por excesiva simplicidad). Distractor B describe un modelo óptimo bien regularizado. Distractor D limita erróneamente el overfitting a modelos lineales, cuando en realidad ocurre conmu cha mayor severidad en modelos de alta capacidad no lineales (árboles profundos, redes neuronales)."}]}, {"page": 6, "width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_6.jpg", "text": "TAA Tema 1: Introdu\ncción al Aprendizaje Automático Test Oficial · Pregunta 5 +0.75 pts / -0.25 pts\n5. ¿Cu\nál es la función principal del conjunto de test en aprendizaje automático?\nA Ajustar los hiperparámetros del modelo durante el entrenamiento.\nB Entrenar el modelo con nuevos datos.\nC Evaluar el rendimiento del modelo en datos no utilizados en el entrenamiento. ✓ RESPUESTA CO\nRRECTA\nDRedu\ncir la dimensionalidad de los datos.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl conjunto de test (o prueba independiente) tiene como única finalidad proporcionar una estimación imparcial\n(unbiased) del rendimiento, error de generalización y comportamiento del modelo final frente a observaciones\ncompletamente inéditas, q\nue jamás intervinieron en la fase de entrenamiento ni en la selección de\nhiperparámetros (Diapositivas Tema 1, pág. 21).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe la función del conjunto de validación (validation set), no de test. Utilizar test para ajustar\nhiperparámetros incurre en la grave falta de fuga de datos (data leakage). Distractor B confunde el conjunto de test\ncon el de entrenamiento. Distractor D lo confunde con técnicas de redu\ncción de dimensionalidad como PCA.", "title": "TAA Tema 1: Introdu cción al Aprendizaje Automático Test Oficial · Pregunta 5 +0.75 pts / -0.25", "blocks": [{"type": "paragraph", "text": "TAA Tema 1: Introdu cción al Aprendizaje Automático Test Oficial · Pregunta 5 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "5. ¿Cu"}, {"type": "paragraph", "text": "ál es la función principal del conjunto de test en aprendizaje automático?"}, {"type": "paragraph", "text": "A Ajustar los hiperparámetros del modelo durante el entrenamiento."}, {"type": "paragraph", "text": "B Entrenar el modelo con nuevos datos."}, {"type": "paragraph", "text": "C Evaluar el rendimiento del modelo en datos no utilizados en el entrenamiento. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "DRedu cir la dimensionalidad de los datos."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El conjunto de test (o prueba independiente) tiene como única finalidad proporcionar una estimación imparcial"}, {"type": "paragraph", "text": "(unbiased) del rendimiento, error de generalización y comportamiento del modelo final frente a observaciones completamente inéditas, q ue jamás intervinieron en la fase de entrenamiento ni en la selección de hiperparámetros (Diapositivas Tema 1, pág. 21)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe la función del conjunto de validación (validation set), no de test. Utilizar test para ajustar hiperparámetros incurre en la grave falta de fuga de datos (data leakage). Distractor B confunde el conjunto de test con el de entrenamiento. Distractor D lo confunde con técnicas de redu cción de dimensionalidad como PCA."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_7.jpg", "page": 7, "height": 1188, "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 6 +0.75 pts / -0.25 pts\n6. ¿Cu\nál es la principal utilidad de un histograma en el análisis exploratorio de datos?\nARepresentar relaciones entre dos variables categóricas.\nBMostrar la distribu\nción de frecuencia de una variable nu\nmérica. ✓ RESPUESTA CO\nRRECTA\nC Identificar correlaciones lineales entre variables.\nD Clasificar los datos en categorías ordenadas.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl histograma es la herramienta gráfica univariante fundamental para estimar y visualizar la función de densidad\nde probabilidad empírica y la distribu\nción de frecuencias de una variable nu\nmérica continua o discreta,\nagru\npando sus valores en intervalos contiguos (bins) (Diapositivas Tema 2, pág. 11). Permite evaluar asimetría\n(skewness),\ncurtosis,\nbimodalidad y dispersión.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A corresponde a gráficos de barras apiladas o tablas de contingencia para datos categóricos. Distractor C\ncorresponde al diagrama de dispersión (scatter plot). Distractor D se refiere a esq\nuemas de discretización o\nclustering.", "title": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 6 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 6 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "6. ¿Cu"}, {"type": "paragraph", "text": "ál es la principal utilidad de un histograma en el análisis exploratorio de datos?"}, {"type": "paragraph", "text": "ARepresentar relaciones entre dos variables categóricas."}, {"type": "paragraph", "text": "BMostrar la distribu ción de frecuencia de una variable nu mérica. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Identificar correlaciones lineales entre variables."}, {"type": "paragraph", "text": "D Clasificar los datos en categorías ordenadas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El histograma es la herramienta gráfica univariante fundamental para estimar y visualizar la función de densidad de probabilidad empírica y la distribu ción de frecuencias de una variable nu mérica continua o discreta, agru pando sus valores en intervalos contiguos (bins) (Diapositivas Tema 2, pág. 11). Permite evaluar asimetría"}, {"type": "paragraph", "text": "(skewness), curtosis, bimodalidad y dispersión."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A corresponde a gráficos de barras apiladas o tablas de contingencia para datos categóricos. Distractor C corresponde al diagrama de dispersión (scatter plot). Distractor D se refiere a esq uemas de discretización o clustering."}]}, {"text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 7 +0.75 pts / -0.25 pts\n7. ¿Cu\nál de las siguientes afirmaciones sobre el rango intercuartílico (RIC) es correcta?\nA Es la diferencia entre el valor máximo y el mínimo del conjunto de datos.\nBRepresenta el 100 % de los datos de la distribu\nción.\nC Es la diferencia entre el tercer cuartil y el primer cuartil. ✓ RESPUESTA CO\nRRECTA\nD Es sensible a los valores atípicos.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl Rango Intercuartílico (RIC o IQR) se define rigurosamente como la diferencia matemática entre el tercer cuartil\n(percentil 75) y el primer cuartil (percentil 25): RIC = Q3 - Q1 (Diapositivas Tema 2, pág. 18). Engloba\nexactamente el 50% central de las observaciones y es un estadístico no paramétrico su\nmamente robusto ante la\npresencia de valores atípicos (outliers).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe el rango total (R = Max - Min). Distractor B afirma erróneamente q\nue abarca el 100% de la\ndistribu\nción (abarca el 50%). Distractor D es falso de raíz: el RIC es precisamente insensible y robusto ante outliers, a\ndiferencia de la desviación típica.", "width": 918, "image": "./examenes_resueltos_master_ia_pages/page_8.jpg", "page": 8, "height": 1188, "title": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 7 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 7 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "7. ¿Cu"}, {"type": "paragraph", "text": "ál de las siguientes afirmaciones sobre el rango intercuartílico (RIC) es correcta?"}, {"type": "paragraph", "text": "A Es la diferencia entre el valor máximo y el mínimo del conjunto de datos."}, {"type": "paragraph", "text": "BRepresenta el 100 % de los datos de la distribu ción."}, {"type": "paragraph", "text": "C Es la diferencia entre el tercer cuartil y el primer cuartil. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Es sensible a los valores atípicos."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El Rango Intercuartílico (RIC o IQR) se define rigurosamente como la diferencia matemática entre el tercer cuartil"}, {"type": "paragraph", "text": "(percentil 75) y el primer cuartil (percentil 25): RIC = Q3 - Q1 (Diapositivas Tema 2, pág. 18). Engloba exactamente el 50% central de las observaciones y es un estadístico no paramétrico su mamente robusto ante la presencia de valores atípicos (outliers)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe el rango total (R = Max - Min). Distractor B afirma erróneamente q ue abarca el 100% de la distribu ción (abarca el 50%). Distractor D es falso de raíz: el RIC es precisamente insensible y robusto ante outliers, a diferencia de la desviación típica."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_9.jpg", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 8 +0.75 pts / -0.25 pts\n8. ¿Qu\né indica un coeficiente de correlación de Pearson cercano a 0?\nA Existe una relación lineal positiva fuerte.\nB Existe una relación lineal negativa fuerte.\nC No existe relación lineal entre las variables. ✓ RESPUESTA CO\nRRECTA\nD Existe una relación causal directa entre variables.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl coeficiente de correlación lineal de Pearson (r) cuantifica la fuerza y dirección de una relación estrictamente\nlineal entre dos variables nu\nméricas continuas en el intervalo [-1, +1] (Diapositivas Tema 2, pág. 25). Un valor r ≈\n0 evidencia la ausencia de covariación lineal; no obstante, p\nuede existir una relación determinista no lineal fuerte\n(como cuadrática o sinusoidal).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor C es correcto. Distractor A implicaría r ≈ +1. Distractor B implicaría r ≈ -1. Distractor D incurre en la clásica\nfalacia estadística de confundir correlación con causalidad ('correlation does not imply causation').", "height": 1188, "page": 9, "width": 918, "title": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 8 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 8 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "8. ¿Qu"}, {"type": "paragraph", "text": "é indica un coeficiente de correlación de Pearson cercano a 0?"}, {"type": "paragraph", "text": "A Existe una relación lineal positiva fuerte."}, {"type": "paragraph", "text": "B Existe una relación lineal negativa fuerte."}, {"type": "paragraph", "text": "C No existe relación lineal entre las variables. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Existe una relación causal directa entre variables."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El coeficiente de correlación lineal de Pearson (r) cuantifica la fuerza y dirección de una relación estrictamente lineal entre dos variables nu méricas continuas en el intervalo [-1, +1] (Diapositivas Tema 2, pág. 25). Un valor r ≈"}, {"type": "paragraph", "text": "0 evidencia la ausencia de covariación lineal; no obstante, p uede existir una relación determinista no lineal fuerte"}, {"type": "paragraph", "text": "(como cuadrática o sinusoidal)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor C es correcto. Distractor A implicaría r ≈ +1. Distractor B implicaría r ≈ -1. Distractor D incurre en la clásica falacia estadística de confundir correlación con causalidad ('correlation does not imply causation')."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_10.jpg", "width": 918, "height": 1188, "page": 10, "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 9 +0.75 pts / -0.25 pts\n9. ¿Cu\nál es la principal razón para eliminar atributos redundantes en un conjunto de\ndatos?\nARedu\ncir el tamaño del dataset sin afectar al modelo.\nB Evitar información du\nplicada q\nue no aporta valor y p\nuede degradar el\nrendimiento del modelo.\n✓ RESPUESTA CO\nRRECTA\nCMejorar únicamente la visualización de los datos.\nD Garantizar q\nue todas las variables sean categóricas.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa eliminación de atributos redundantes o fuertemente colineales evita la du\nplicación de información q\nue no\nañade capacidad predictiva y previene problemas críticos como la m\nulticolinealidad, la inestabilidad en la\nestimación de coeficientes (en modelos lineales/regresión logística), el au\nmento innecesario del coste\ncomp\nutacional y la degradación del rendimiento por la maldición de la dimensionalidad (Diapositivas Tema 2,\npág. 32).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A es inexacto y engañoso al afirmar q\nue se hace simplemente por 'redu\ncir tamaño sin afectar'. Distractor C\nlimita erróneamente el beneficio a la visualización. Distractor D es absurdo, p\nues la redundancia afecta tanto a\nvariables nu\nméricas como categóricas.", "title": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 9 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 2: Análisis Descriptivo y Exploratorio de Datos (EDA) Test Oficial · Pregunta 9 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "9. ¿Cu"}, {"type": "paragraph", "text": "ál es la principal razón para eliminar atributos redundantes en un conjunto de datos?"}, {"type": "paragraph", "text": "ARedu cir el tamaño del dataset sin afectar al modelo."}, {"type": "paragraph", "text": "B Evitar información du plicada q ue no aporta valor y p uede degradar el rendimiento del modelo."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "CMejorar únicamente la visualización de los datos."}, {"type": "paragraph", "text": "D Garantizar q ue todas las variables sean categóricas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La eliminación de atributos redundantes o fuertemente colineales evita la du plicación de información q ue no añade capacidad predictiva y previene problemas críticos como la m ulticolinealidad, la inestabilidad en la estimación de coeficientes (en modelos lineales/regresión logística), el au mento innecesario del coste comp utacional y la degradación del rendimiento por la maldición de la dimensionalidad (Diapositivas Tema 2, pág. 32)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A es inexacto y engañoso al afirmar q ue se hace simplemente por 'redu cir tamaño sin afectar'. Distractor C limita erróneamente el beneficio a la visualización. Distractor D es absurdo, p ues la redundancia afecta tanto a variables nu méricas como categóricas."}]}, {"height": 1188, "width": 918, "image": "./examenes_resueltos_master_ia_pages/page_11.jpg", "page": 11, "text": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 10 +0.75 pts / -0.25 pts\n10. ¿Cu\nál de las siguientes afirmaciones sobre los valores ausentes es correcta?\nA No afectan al rendimiento de los modelos de aprendizaje automático.\nB Pueden ignorarse sin consecuencias en el análisis.\nC Pueden introdu\ncir sesgos y afectar a la calidad de los resultados si no se\nmanejan correctamente.\n✓ RESPUESTA CO\nRRECTA\nD Solo aparecen en datasets peq\nueños.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa presencia de valores ausentes (missing values: MCAR\n,\nMAR o MNAR) en una base de datos p\nuede introdu\ncir\nsesgos sistemáticos sustanciales, distorsionar las estimaciones estadísticas poblacionales y degradar la calidad\ny convergencia de los modelos de aprendizaje automático si no se gestionan rigurosamente mediante imp\nutación\nfundamentada (media, mediana,\nKNN,\nMICE) o eliminación justificada (Diapositivas Tema 3, pág. 8).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A y B afirman falsamente q\nue no tienen impacto o q\nue p\nueden ignorarse,\ncuando la inmensa mayoría de\nalgoritmos en scikit-learn arrojan excepciones ante NaNs. Distractor D asu\nme erróneamente q\nue solo ocurren en\ndatasets peq\nueños.", "title": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 10 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 10 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "10. ¿Cu"}, {"type": "paragraph", "text": "ál de las siguientes afirmaciones sobre los valores ausentes es correcta?"}, {"type": "paragraph", "text": "A No afectan al rendimiento de los modelos de aprendizaje automático."}, {"type": "paragraph", "text": "B Pueden ignorarse sin consecuencias en el análisis."}, {"type": "paragraph", "text": "C Pueden introdu cir sesgos y afectar a la calidad de los resultados si no se manejan correctamente."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Solo aparecen en datasets peq ueños."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La presencia de valores ausentes (missing values: MCAR"}, {"type": "paragraph", "text": ","}, {"type": "paragraph", "text": "MAR o MNAR) en una base de datos p uede introdu cir sesgos sistemáticos sustanciales, distorsionar las estimaciones estadísticas poblacionales y degradar la calidad y convergencia de los modelos de aprendizaje automático si no se gestionan rigurosamente mediante imp utación fundamentada (media, mediana,"}, {"type": "heading", "text": "KNN,"}, {"type": "paragraph", "text": "MICE) o eliminación justificada (Diapositivas Tema 3, pág. 8)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A y B afirman falsamente q ue no tienen impacto o q ue p ueden ignorarse, cuando la inmensa mayoría de algoritmos en scikit-learn arrojan excepciones ante NaNs. Distractor D asu me erróneamente q ue solo ocurren en datasets peq ueños."}]}, {"width": 918, "page": 12, "image": "./examenes_resueltos_master_ia_pages/page_12.jpg", "text": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 11 +0.75 pts / -0.25 pts\n11. ¿Qu\né caracteriza a la normalización z-score?\nA Escala los valores entre 0 y 1.\nB Transforma los datos para q\nue tengan media 0 y desviación estándar 1. ✓ RESPUESTA CO\nRRECTA\nC Elimina valores atípicos automáticamente.\nD Solo se aplica a variables categóricas.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa estandarización o normalización z-score transforma una variable continua x restándole su\nmedia empírica\n(m\nu) y dividiendo el resultado entre su desviación estándar (sigma): z = (x - m\nu) / sigma (Diapositivas Tema 3,\npág. 19). Como resultado matemático riguroso, la variable resultante posee exactamente una media igual a 0 y\nuna desviación típica igual a 1.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe la normalización Min-Max (escala [0, 1]). Distractor C asu\nme falsamente q\nue el z-score elimina\noutliers automáticamente; en realidad no los elimina, simplemente los desplaza conservando su\nmagnitud relativa.\nDistractor D limita la normalización a categóricas,\ncuando es exclusiva de cuantitativas.", "height": 1188, "title": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 11 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 3: Datos Ausentes y Normalización Test Oficial · Pregunta 11 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "11. ¿Qu"}, {"type": "paragraph", "text": "é caracteriza a la normalización z-score?"}, {"type": "paragraph", "text": "A Escala los valores entre 0 y 1."}, {"type": "paragraph", "text": "B Transforma los datos para q ue tengan media 0 y desviación estándar 1. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Elimina valores atípicos automáticamente."}, {"type": "paragraph", "text": "D Solo se aplica a variables categóricas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La estandarización o normalización z-score transforma una variable continua x restándole su media empírica"}, {"type": "paragraph", "text": "(mu) y dividiendo el resultado entre su desviación estándar (sigma): z = (x - m u) / sigma (Diapositivas Tema 3, pág. 19). Como resultado matemático riguroso, la variable resultante posee exactamente una media igual a 0 y una desviación típica igual a 1."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe la normalización Min-Max (escala [0, 1]). Distractor C asu me falsamente q ue el z-score elimina outliers automáticamente; en realidad no los elimina, simplemente los desplaza conservando su magnitud relativa."}, {"type": "paragraph", "text": "Distractor D limita la normalización a categóricas, cuando es exclusiva de cuantitativas."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_13.jpg", "page": 13, "width": 918, "height": 1188, "text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 12 +0.75 pts / -0.25 pts\n12. ¿Cu\nál es el objetivo principal de los algoritmos de regresión en aprendizaje\nautomático? (Resp\nuesta corta)\nResp\nuesta Oficial: Resp\nuesta correcta: Predecir valores nu\nméricos continuos a partir de ✓ CO\nRRECTA\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl objetivo primordial de los algoritmos de regresión es modelar la relación matemática y estadística funcional\nexistente entre un conjunto de variables predictoras o independientes (X) y una variable dependiente u objetivo\ncontinua (Y) con el fin de predecir valores nu\nméricos cuantitativos reales para nuevas instancias no observadas\n(Diapositivas Tema 4, pág. 6).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nConfundir regresión con clasificación: si el objetivo fuera predecir una clase discreta o pertenencia a una categoría,\nestaríamos en un problema de clasificación, no de regresión.", "title": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 12 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 12 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "12. ¿Cu"}, {"type": "paragraph", "text": "ál es el objetivo principal de los algoritmos de regresión en aprendizaje automático? (Resp uesta corta)"}, {"type": "paragraph", "text": "Resp uesta Oficial: Resp uesta correcta: Predecir valores nu méricos continuos a partir de ✓ CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El objetivo primordial de los algoritmos de regresión es modelar la relación matemática y estadística funcional existente entre un conjunto de variables predictoras o independientes (X) y una variable dependiente u objetivo continua (Y) con el fin de predecir valores nu méricos cuantitativos reales para nuevas instancias no observadas"}, {"type": "paragraph", "text": "(Diapositivas Tema 4, pág. 6)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Confundir regresión con clasificación: si el objetivo fuera predecir una clase discreta o pertenencia a una categoría, estaríamos en un problema de clasificación, no de regresión."}]}, {"text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 13 +0.75 pts / -0.25 pts\n13. ¿Cu\nál de las siguientes afirmaciones describe correctamente el R\nMSE?\nA Es la su\nma de los errores absolutos.\nB Es la raíz cuadrada del error cuadrático medio y mantiene las unidades\noriginales.\n✓ RESPUESTA CO\nRRECTA\nC No penaliza errores grandes.\nD Solo se aplica a variables categóricas.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl R\nMSE (Root Mean Sq\nuared Error o Raíz del Error Cuadrático Medio) se define formalmente como R\nMSE = sqrt(\n(1/N) * su\nm (y_i - y_hat_i)^2 ) (Diapositivas Tema 4, pág. 14). Al aplicar la raíz cuadrada sobre el MSE, posee la\nenorme ventaja práctica de retornar la métrica a las mismas unidades físicas originales q\nue la variable objetivo\nevaluada.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A corresponde al MAE (Mean Absolute Error). Distractor C es falso: debido a la elevación cuadrática del\nerror, el R\nMSE penaliza de forma desproporcionadamente severa los errores grandes o desviaciones atípicas.\nDistractor D es falso porq\nue solo aplica a variables nu\nméricas continuas.", "width": 918, "height": 1188, "page": 14, "image": "./examenes_resueltos_master_ia_pages/page_14.jpg", "title": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 13 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 13 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "13. ¿Cu"}, {"type": "paragraph", "text": "ál de las siguientes afirmaciones describe correctamente el R"}, {"type": "heading", "text": "MSE?"}, {"type": "paragraph", "text": "A Es la su ma de los errores absolutos."}, {"type": "paragraph", "text": "B Es la raíz cuadrada del error cuadrático medio y mantiene las unidades originales."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C No penaliza errores grandes."}, {"type": "paragraph", "text": "D Solo se aplica a variables categóricas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El R"}, {"type": "paragraph", "text": "MSE (Root Mean Sq uared Error o Raíz del Error Cuadrático Medio) se define formalmente como R"}, {"type": "paragraph", "text": "MSE = sqrt("}, {"type": "paragraph", "text": "(1/N) * su m (y_i - y_hat_i)^2 ) (Diapositivas Tema 4, pág. 14). Al aplicar la raíz cuadrada sobre el MSE, posee la enorme ventaja práctica de retornar la métrica a las mismas unidades físicas originales q ue la variable objetivo evaluada."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A corresponde al MAE (Mean Absolute Error). Distractor C es falso: debido a la elevación cuadrática del error, el R"}, {"type": "paragraph", "text": "MSE penaliza de forma desproporcionadamente severa los errores grandes o desviaciones atípicas."}, {"type": "paragraph", "text": "Distractor D es falso porq ue solo aplica a variables nu méricas continuas."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_15.jpg", "text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 14 +0.75 pts / -0.25 pts\n14. ¿Qu\né implica un alto valor de varianza en un modelo de regresión?\nA El modelo es demasiado simple y no capta la estru\nctura de los datos.\nB El modelo generaliza perfectamente en datos nuevos.\nC El modelo es m\nuy sensible a las variaciones del conjunto de entrenamiento\n(sobreajuste).\n✓ RESPUESTA CO\nRRECTA\nD El modelo no depende de los datos de entrada.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEn el marco del compromiso entre sesgo y varianza (Bias-Variance Tradeoff),\nuna alta varianza denota q\nue el\nmodelo es excesivamente flexible y sensible a peq\nueñas flu\nctuaciones o ruido aleatorio del conjunto de datos de\nentrenamiento particular utilizado (Diapositivas Tema 4, pág. 22). Esto implica un sobreajuste severo:\npredicciones inestables y baja capacidad de generalización.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe un modelo con alto sesgo (subajuste o underfitting). Distractor B confunde alta varianza con\ncapacidad perfecta de generalización,\ncuando es exactamente lo op\nuesto. Distractor D es inconsistente con la\ndefinición de aprendizaje indu\nctivo.", "page": 15, "width": 918, "height": 1188, "title": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 14 +0.75 ", "blocks": [{"type": "paragraph", "text": "TAA Tema 4: Regresión y Evaluación de Algoritmos de Regresión Test Oficial · Pregunta 14 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "14. ¿Qu"}, {"type": "paragraph", "text": "é implica un alto valor de varianza en un modelo de regresión?"}, {"type": "paragraph", "text": "A El modelo es demasiado simple y no capta la estru ctura de los datos."}, {"type": "paragraph", "text": "B El modelo generaliza perfectamente en datos nuevos."}, {"type": "paragraph", "text": "C El modelo es m uy sensible a las variaciones del conjunto de entrenamiento"}, {"type": "paragraph", "text": "(sobreajuste)."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D El modelo no depende de los datos de entrada."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "En el marco del compromiso entre sesgo y varianza (Bias-Variance Tradeoff), una alta varianza denota q ue el modelo es excesivamente flexible y sensible a peq ueñas flu ctuaciones o ruido aleatorio del conjunto de datos de entrenamiento particular utilizado (Diapositivas Tema 4, pág. 22). Esto implica un sobreajuste severo:"}, {"type": "paragraph", "text": "predicciones inestables y baja capacidad de generalización."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe un modelo con alto sesgo (subajuste o underfitting). Distractor B confunde alta varianza con capacidad perfecta de generalización, cuando es exactamente lo op uesto. Distractor D es inconsistente con la definición de aprendizaje indu ctivo."}]}, {"page": 16, "width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_16.jpg", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 15 +0.75 pts / -0.25 pts\n15. Cu\nál es el objetivo principal de los algoritmos de clasificación en aprendizaje\nautomático?\nA Predecir valores nu\nméricos continuos.\nB Asignar una etiq\nueta o categoría a una instancia. ✓ RESPUESTA CO\nRRECTA\nCRedu\ncir la dimensionalidad de los datos.\nD Calcular la varianza de las variables.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nA diferencia de la regresión, el objetivo sustantivo de los algoritmos de clasificación en aprendizaje automático\nes asignar a cada instancia o vector de entrada una etiq\nueta,\nclase cualitativa o categoría cualitativa discreta\nperteneciente a un conjunto predefinido de clases posibles (clasificación binaria o m\nulticlase) (Diapositivas Tema\n5, pág. 5).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A define la regresión. Distractor C define técnicas de redu\ncción de dimensionalidad o extracción de\ncaracterísticas (PCA, t-SNE). Distractor D corresponde al cálculo de un estadístico descriptivo univariante.", "title": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 15 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 15 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "15. Cu"}, {"type": "paragraph", "text": "ál es el objetivo principal de los algoritmos de clasificación en aprendizaje automático?"}, {"type": "paragraph", "text": "A Predecir valores nu méricos continuos."}, {"type": "paragraph", "text": "B Asignar una etiq ueta o categoría a una instancia. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "CRedu cir la dimensionalidad de los datos."}, {"type": "paragraph", "text": "D Calcular la varianza de las variables."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "A diferencia de la regresión, el objetivo sustantivo de los algoritmos de clasificación en aprendizaje automático es asignar a cada instancia o vector de entrada una etiq ueta, clase cualitativa o categoría cualitativa discreta perteneciente a un conjunto predefinido de clases posibles (clasificación binaria o m ulticlase) (Diapositivas Tema"}, {"type": "paragraph", "text": "5, pág. 5)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A define la regresión. Distractor C define técnicas de redu cción de dimensionalidad o extracción de características (PCA, t-SNE). Distractor D corresponde al cálculo de un estadístico descriptivo univariante."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_17.jpg", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 16 +0.75 pts / -0.25 pts\n16. ¿Para q\nu\né se utiliza la matriz de confusión en modelos de clasificación?\nA Para calcular la media de los errores.\nB Para visualizar la correlación entre variables.\nC Para organizar las predicciones en función de los valores reales y analizar\naciertos y errores.\n✓ RESPUESTA CO\nRRECTA\nD Para normalizar los datos antes del entrenamiento.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa matriz de confusión es una tabla estru\ncturada de contingencia de dimensión C x C (donde C es el número de\nclases) q\nue cruza sistemáticamente las etiq\nuetas verdaderas reales de las instancias con las etiq\nuetas predichas\npor el clasificador (Diapositivas Tema 5, pág. 10). Permite desagregar con precisión los Verdaderos Positivos\n(TP), Verdaderos Negativos (TN), Falsos Positivos (FP) y Falsos Negativos (FN).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe el error medio de regresión. Distractor B describe la matriz de correlación o covarianzas.\nDistractor D confunde una herramienta de evaluación con un paso de preprocesamiento.", "page": 17, "height": 1188, "width": 918, "title": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 16 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 16 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "16. ¿Para qu"}, {"type": "paragraph", "text": "é se utiliza la matriz de confusión en modelos de clasificación?"}, {"type": "paragraph", "text": "A Para calcular la media de los errores."}, {"type": "paragraph", "text": "B Para visualizar la correlación entre variables."}, {"type": "paragraph", "text": "C Para organizar las predicciones en función de los valores reales y analizar aciertos y errores."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Para normalizar los datos antes del entrenamiento."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La matriz de confusión es una tabla estru cturada de contingencia de dimensión C x C (donde C es el número de clases) q ue cruza sistemáticamente las etiq uetas verdaderas reales de las instancias con las etiq uetas predichas por el clasificador (Diapositivas Tema 5, pág. 10). Permite desagregar con precisión los Verdaderos Positivos"}, {"type": "paragraph", "text": "(TP), Verdaderos Negativos (TN), Falsos Positivos (FP) y Falsos Negativos (FN)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe el error medio de regresión. Distractor B describe la matriz de correlación o covarianzas."}, {"type": "paragraph", "text": "Distractor D confunde una herramienta de evaluación con un paso de preprocesamiento."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_18.jpg", "page": 18, "height": 1188, "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 17 +0.75 pts / -0.25 pts\n17. ¿Qu\né indica un alto valor de recall en un modelo de clasificación?\nA Que el modelo predice correctamente los ejemplos negativos.\nB Que el modelo captura un alto porcentaje de ejemplos positivos. ✓ RESPUESTA CO\nRRECTA\nC Que el modelo minimiza los falsos positivos.\nD Que el modelo tiene la menor varianza posible.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl Recall (también denominado Sensibilidad o Tasa de Verdaderos Positivos) se calcula como Recall = TP / (TP +\nFN) (Diapositivas Tema 5, pág. 14). Un valor elevado de recall indica q\nue el modelo es su\nmamente eficaz para\ncapturar e identificar la gran mayoría de las instancias verdaderamente positivas de la población, minimizando la\nomisión de falsos negativos.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A se refiere a la Especificidad (True Negative Rate = TN / (TN + FP)). Distractor C se refiere a la Precisión\n(Precision = TP / (TP + FP)). Distractor D confunde una métrica de clasificación con el concepto de varianza del\nmodelo.", "title": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 17 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 5: Evaluación de Algoritmos de Clasificación Test Oficial · Pregunta 17 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "17. ¿Qu"}, {"type": "paragraph", "text": "é indica un alto valor de recall en un modelo de clasificación?"}, {"type": "paragraph", "text": "A Que el modelo predice correctamente los ejemplos negativos."}, {"type": "paragraph", "text": "B Que el modelo captura un alto porcentaje de ejemplos positivos. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Que el modelo minimiza los falsos positivos."}, {"type": "paragraph", "text": "D Que el modelo tiene la menor varianza posible."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El Recall (también denominado Sensibilidad o Tasa de Verdaderos Positivos) se calcula como Recall = TP / (TP +"}, {"type": "paragraph", "text": "FN) (Diapositivas Tema 5, pág. 14). Un valor elevado de recall indica q ue el modelo es su mamente eficaz para capturar e identificar la gran mayoría de las instancias verdaderamente positivas de la población, minimizando la omisión de falsos negativos."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A se refiere a la Especificidad (True Negative Rate = TN / (TN + FP)). Distractor C se refiere a la Precisión"}, {"type": "paragraph", "text": "(Precision = TP / (TP + FP)). Distractor D confunde una métrica de clasificación con el concepto de varianza del modelo."}]}, {"text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 18 +0.75 pts / -0.25 pts\n18. ¿Cu\nál es el objetivo principal del criterio de división en un árbol de decisión?\nAMaximizar el número de nodos del árbol.\nBRedu\ncir la profundidad del árbol.\nC Seleccionar la variable q\nue mejor separa las clases (máxima ganancia de\ninformación o mínima imp\nureza).\n✓ RESPUESTA CO\nRRECTA\nD Au\nmentar el número de variables predictoras.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEn cada nodo interno de un árbol de decisión, el criterio de división (split criterion) evalúa exhaustivamente todas\nlas variables predictoras y todos sus posibles u\nmbrales de corte con el fin de seleccionar aq\nuella partición q\nue\nmaximice la p\nureza resultante de los nodos hijos (Diapositivas Tema 6, pág. 12). Esto se cuantifica analíticamente\nmediante la maximización de la Ganancia de Información o la minimización del índice de Imp\nureza de Gini /\nEntropía.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A busca maximizar nodos, lo cual incrementa el sobreajuste. Distractor B confunde el criterio de división\ncon la poda o regularización. Distractor D es absurdo, p\nues el criterio de división divide una variable a la vez, no\nau\nmenta el número de variables.", "width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_19.jpg", "page": 19, "title": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 18 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 18 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "18. ¿Cu"}, {"type": "paragraph", "text": "ál es el objetivo principal del criterio de división en un árbol de decisión?"}, {"type": "paragraph", "text": "AMaximizar el número de nodos del árbol."}, {"type": "paragraph", "text": "BRedu cir la profundidad del árbol."}, {"type": "paragraph", "text": "C Seleccionar la variable q ue mejor separa las clases (máxima ganancia de información o mínima imp ureza)."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Au mentar el número de variables predictoras."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "En cada nodo interno de un árbol de decisión, el criterio de división (split criterion) evalúa exhaustivamente todas las variables predictoras y todos sus posibles u mbrales de corte con el fin de seleccionar aq uella partición que maximice la p ureza resultante de los nodos hijos (Diapositivas Tema 6, pág. 12). Esto se cuantifica analíticamente mediante la maximización de la Ganancia de Información o la minimización del índice de Imp ureza de Gini /"}, {"type": "paragraph", "text": "Entropía."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A busca maximizar nodos, lo cual incrementa el sobreajuste. Distractor B confunde el criterio de división con la poda o regularización. Distractor D es absurdo, p ues el criterio de división divide una variable a la vez, noau menta el número de variables."}]}, {"height": 1188, "page": 20, "image": "./examenes_resueltos_master_ia_pages/page_20.jpg", "text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 19 +0.75 pts / -0.25 pts\n19. ¿Qu\né problema intenta resolver la poda en los árboles de decisión?\nALa falta de interpretabilidad.\nB El desbalanceo de datos.\nC El sobreajuste del modelo. ✓ RESPUESTA CO\nRRECTA\nDLa falta de variables nu\nméricas.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa poda (pruning, tanto pre-pruning como post-pruning como Cost-Complexity Pruning) tiene como cometido\nexplícito recortar ramas redundantes o excesivamente específicas q\nue se ajustan al ruido estadístico del\nconjunto de entrenamiento, redu\nciendo la complejidad estru\nctural del árbol para mitigar drásticamente el\nsobreajuste (overfitting) y optimizar su\ncapacidad de generalización (Diapositivas Tema 6, pág. 21).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A: los árboles no podados son interpretables pero sobreajustan. Distractor B: la poda no corrige el\ndesbalanceo de clases (eso se trata con ponderación de clases o rem\nuestreo SM\nOTE). Distractor D: los árboles\nmanejan variables nu\nméricas nativamente.", "width": 918, "title": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 19 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 19 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "19. ¿Qu"}, {"type": "paragraph", "text": "é problema intenta resolver la poda en los árboles de decisión?"}, {"type": "paragraph", "text": "ALa falta de interpretabilidad."}, {"type": "paragraph", "text": "B El desbalanceo de datos."}, {"type": "paragraph", "text": "C El sobreajuste del modelo. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "DLa falta de variables nu méricas."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La poda (pruning, tanto pre-pruning como post-pruning como Cost-Complexity Pruning) tiene como cometido explícito recortar ramas redundantes o excesivamente específicas q ue se ajustan al ruido estadístico del conjunto de entrenamiento, redu ciendo la complejidad estru ctural del árbol para mitigar drásticamente el sobreajuste (overfitting) y optimizar su capacidad de generalización (Diapositivas Tema 6, pág. 21)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A: los árboles no podados son interpretables pero sobreajustan. Distractor B: la poda no corrige el desbalanceo de clases (eso se trata con ponderación de clases o rem uestreo SM"}, {"type": "paragraph", "text": "OTE). Distractor D: los árboles manejan variables nu méricas nativamente."}]}, {"page": 21, "width": 918, "image": "./examenes_resueltos_master_ia_pages/page_21.jpg", "text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 20 +0.75 pts / -0.25 pts\n20. ¿Cu\nál de las siguientes características describe mejor a los árboles de decisión?\nA Solo funcionan con variables nu\nméricas.\nBReq\nuieren su\nposiciones de linealidad estrictas.\nC Son modelos fáciles de interpretar q\nue p\nueden manejar variables categóricas y\nnu\nméricas.\n✓ RESPUESTA CO\nRRECTA\nD Siempre produ\ncen modelos óptimos globales.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLos árboles de decisión son modelos intrínsecamente no paramétricos e interpretables ('cajas blancas') con alta\ncapacidad representativa,\ncaracterizados por su versatilidad para admitir y procesar de forma nativa tanto\nvariables continuas nu\nméricas como variables categóricas o discretas sin req\nuerir su\np\nuestos previos de\nlinealidad ni transformaciones de escala (Diapositivas Tema 6, pág. 28; Breiman et al., 1984).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A y B son rotundamente falsos: no req\nuieren linealidad y operan con categóricas y nu\nméricas. Distractor D\nes falso: los algoritmos estándar (CART, ID3, C4.5) son heurísticas voraces (greedy) paso a paso q\nue no garantizan\nencontrar el árbol globalmente óptimo (problema NP-completo).", "height": 1188, "title": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 20 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 6: Árboles de Decisión (CART) Test Oficial · Pregunta 20 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "20. ¿Cu"}, {"type": "paragraph", "text": "ál de las siguientes características describe mejor a los árboles de decisión?"}, {"type": "paragraph", "text": "A Solo funcionan con variables nu méricas."}, {"type": "paragraph", "text": "BReq uieren su posiciones de linealidad estrictas."}, {"type": "paragraph", "text": "C Son modelos fáciles de interpretar q ue p ueden manejar variables categóricas ynu méricas."}, {"type": "heading", "text": "✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Siempre produ cen modelos óptimos globales."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "Los árboles de decisión son modelos intrínsecamente no paramétricos e interpretables ('cajas blancas') con alta capacidad representativa, caracterizados por su versatilidad para admitir y procesar de forma nativa tanto variables continuas nu méricas como variables categóricas o discretas sin req uerir sup uestos previos de linealidad ni transformaciones de escala (Diapositivas Tema 6, pág. 28; Breiman et al., 1984)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A y B son rotundamente falsos: no req uieren linealidad y operan con categóricas y nu méricas. Distractor D es falso: los algoritmos estándar (CART, ID3, C4.5) son heurísticas voraces (greedy) paso a paso q ue no garantizan encontrar el árbol globalmente óptimo (problema NP-completo)."}]}, {"width": 918, "image": "./examenes_resueltos_master_ia_pages/page_22.jpg", "page": 22, "height": 1188, "text": "TAA Tema 7: Máq\nuinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 21 +0.75 pts / -0.25 pts\n21. ¿Cu\nál es el objetivo principal de una máq\nuina de vectores de soporte (SVM)?\nAMinimizar la varianza del modelo.\nB Encontrar el hiperplano q\nue maximiza el margen entre clases. ✓ RESPUESTA CO\nRRECTA\nC Ajustar una regresión lineal simple.\nDRedu\ncir la dimensionalidad del dataset.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl principio matemático fundacional de las Máq\nuinas de Vectores de Soporte (SVM) en clasificación lineal\nseparable o cuasi-separable es encontrar el hiperplano óptimo de separación w^T x + b = 0 q\nue maximiza el\nmargen geométrico bidireccional (2 / ||w||) entre las instancias de clases op\nuestas más próximas (Diapositivas\nTema 7, pág. 8; Vapnik, 1995). La maximización del margen minimiza la cota su\nperior del error de generalización\nsegún la teoría de Vapnik-Chervonenkis (VC).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A confunde el objetivo formal de optimización con una consecuencia colateral. Distractor C confunde SVM\ncon regresión lineal simple. Distractor D confunde SVM con algoritmos no su\npervisados de proyección como PCA.", "title": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 21 +0.75 pts / -0.25", "blocks": [{"type": "paragraph", "text": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 21 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "21. ¿Cu"}, {"type": "paragraph", "text": "ál es el objetivo principal de una máq uina de vectores de soporte (SVM)?"}, {"type": "paragraph", "text": "AMinimizar la varianza del modelo."}, {"type": "paragraph", "text": "B Encontrar el hiperplano q ue maximiza el margen entre clases. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Ajustar una regresión lineal simple."}, {"type": "paragraph", "text": "DRedu cir la dimensionalidad del dataset."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El principio matemático fundacional de las Máq uinas de Vectores de Soporte (SVM) en clasificación lineal separable o cuasi-separable es encontrar el hiperplano óptimo de separación w^T x + b = 0 q ue maximiza el margen geométrico bidireccional (2 / ||w||) entre las instancias de clases op uestas más próximas (Diapositivas"}, {"type": "paragraph", "text": "Tema 7, pág. 8; Vapnik, 1995). La maximización del margen minimiza la cota su perior del error de generalización según la teoría de Vapnik-Chervonenkis (VC)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A confunde el objetivo formal de optimización con una consecuencia colateral. Distractor C confunde SVM con regresión lineal simple. Distractor D confunde SVM con algoritmos no su pervisados de proyección como PCA."}]}, {"image": "./examenes_resueltos_master_ia_pages/page_23.jpg", "width": 918, "page": 23, "height": 1188, "text": "TAA Tema 7: Máq\nuinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 22 +0.75 pts / -0.25 pts\n22. ¿Qu\né son los vectores de soporte?\nA Variables irrelevantes del modelo.\nB Puntos de datos alejados del hiperplano.\nC Puntos más cercanos al hiperplano q\nue determinan su\nposición. ✓ RESPUESTA CO\nRRECTA\nD Parámetros del kernel.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLos vectores de soporte (su\npport vectors) son rigurosamente aq\nuellos p\nuntos de datos críticos del conjunto de\nentrenamiento q\nue se sitúan exactamente sobre los hiperplanos límite del margen (w^T x_i + b = ±1) o q\nue violan\ndicho margen en SVM de margen blando (Diapositivas Tema 7, pág. 14). Son los únicos p\nuntos con\nm\nultiplicadores de Lagrange alpha_i > 0; si se eliminaran los demás p\nuntos del dataset, el hiperplano óptimo no\ncambiaría en absoluto.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A afirma erróneamente q\nue son variables irrelevantes cuando son las observaciones más críticas. Distractor\nB afirma q\nue son p\nuntos alejados,\ncuando por definición son los más cercanos al hiperplano separador. Distractor D\nlos confunde con hiperparámetros.", "title": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 22 +0.75 pts / -0.25", "blocks": [{"type": "paragraph", "text": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 22 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "22. ¿Qu"}, {"type": "paragraph", "text": "é son los vectores de soporte?"}, {"type": "paragraph", "text": "A Variables irrelevantes del modelo."}, {"type": "paragraph", "text": "B Puntos de datos alejados del hiperplano."}, {"type": "paragraph", "text": "C Puntos más cercanos al hiperplano q ue determinan su posición. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Parámetros del kernel."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "Los vectores de soporte (su pport vectors) son rigurosamente aq uellos p untos de datos críticos del conjunto de entrenamiento q ue se sitúan exactamente sobre los hiperplanos límite del margen (w^T x_i + b = ±1) o q ue violan dicho margen en SVM de margen blando (Diapositivas Tema 7, pág. 14). Son los únicos p untos conm ultiplicadores de Lagrange alpha_i > 0; si se eliminaran los demás p untos del dataset, el hiperplano óptimo no cambiaría en absoluto."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A afirma erróneamente q ue son variables irrelevantes cuando son las observaciones más críticas. Distractor"}, {"type": "paragraph", "text": "B afirma q ue son p untos alejados, cuando por definición son los más cercanos al hiperplano separador. Distractor D los confunde con hiperparámetros."}]}, {"page": 24, "height": 1188, "width": 918, "image": "./examenes_resueltos_master_ia_pages/page_24.jpg", "text": "TAA Tema 7: Máq\nuinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 23 +0.75 pts / -0.25 pts\n23. ¿Para q\nu\né sirve el kernel trick en SVM?\nARedu\ncir el número de variables.\nB Transformar explícitamente los datos a menor dimensión.\nC Permitir separaciones no lineales mediante transformaciones implícitas. ✓ RESPUESTA CO\nRRECTA\nD Calcular la matriz de confusión.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl 'tru\nco del núcleo' (Kernel Trick) permite a SVM proyectar implícitamente los datos de entrada originales no\nseparables linealmente a un espacio de características de dimensión significativamente mayor o infinita (espacio\nde Hilbert) donde sí son separables linealmente,\ncalculando únicamente los produ\nctos escalares K(x_i, x_j) = sin\nnecesidad de materializar explícitamente las coordenadas transformadas Phi(x) (Diapositivas Tema 7, pág. 22;\nBoser et al., 1992).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A y B afirman q\nue transforma a menor dimensión o explícitamente,\ncuando transforma implícitamente a\ndimensión mayor o infinita. Distractor D confunde el núcleo de Hilbert con el cálculo de métricas de validación.", "title": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 23 +0.75 pts / -0.25", "blocks": [{"type": "paragraph", "text": "TAA Tema 7: Máq uinas de Vectores de Soporte (SVM) Test Oficial · Pregunta 23 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "23. ¿Para qu"}, {"type": "paragraph", "text": "é sirve el kernel trick en SVM?"}, {"type": "paragraph", "text": "ARedu cir el número de variables."}, {"type": "paragraph", "text": "B Transformar explícitamente los datos a menor dimensión."}, {"type": "paragraph", "text": "C Permitir separaciones no lineales mediante transformaciones implícitas. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Calcular la matriz de confusión."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El 'tru co del núcleo' (Kernel Trick) permite a SVM proyectar implícitamente los datos de entrada originales no separables linealmente a un espacio de características de dimensión significativamente mayor o infinita (espacio de Hilbert) donde sí son separables linealmente, calculando únicamente los produ ctos escalares K(x_i, x_j) = sin necesidad de materializar explícitamente las coordenadas transformadas Phi(x) (Diapositivas Tema 7, pág. 22;"}, {"type": "paragraph", "text": "Boser et al., 1992)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A y B afirman q ue transforma a menor dimensión o explícitamente, cuando transforma implícitamente a dimensión mayor o infinita. Distractor D confunde el núcleo de Hilbert con el cálculo de métricas de validación."}]}, {"page": 25, "image": "./examenes_resueltos_master_ia_pages/page_25.jpg", "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 24 +0.75 pts / -0.25 pts\n24. ¿Qu\né su\nposición clave realiza el clasificador Naïve Bayes?\nA Que las variables son altamente correlacionadas.\nB Que las variables son independientes entre sí dado la clase. ✓ RESPUESTA CO\nRRECTA\nC Que todas las variables siguen una distribu\nción uniforme.\nD Que el modelo es determinista.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nLa hipótesis 'ingenua' (naïve) q\nue constituye la base matemática del clasificador Naïve Bayes es la asunción de\nindependencia condicional entre todos los atributos o variables predictoras dado el valor de la clase objetivo:\nP(X_1, X_2, ..., X_p | C) = Prod P(X_j | C) (Diapositivas Tema 8, pág. 7). Esto permite descomponer el cálculo de\nla verosimilitud conjunta en el produ\ncto de verosimilitudes univariantes.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A sostiene lo contrario (correlación alta destruye la eficiencia de Naïve Bayes). Distractor C confunde la\ndistribu\nción a priori con uniformidad estricta. Distractor D olvida q\nue Naïve Bayes es un modelo probabilístico\ngenerativo, no determinista.", "width": 918, "height": 1188, "title": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 24 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 24 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "24. ¿Qu"}, {"type": "paragraph", "text": "é su posición clave realiza el clasificador Naïve Bayes?"}, {"type": "paragraph", "text": "A Que las variables son altamente correlacionadas."}, {"type": "paragraph", "text": "B Que las variables son independientes entre sí dado la clase. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Que todas las variables siguen una distribu ción uniforme."}, {"type": "paragraph", "text": "D Que el modelo es determinista."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "La hipótesis 'ingenua' (naïve) q ue constituye la base matemática del clasificador Naïve Bayes es la asunción de independencia condicional entre todos los atributos o variables predictoras dado el valor de la clase objetivo:"}, {"type": "paragraph", "text": "P(X_1, X_2, ..., X_p | C) = Prod P(X_j | C) (Diapositivas Tema 8, pág. 7). Esto permite descomponer el cálculo de la verosimilitud conjunta en el produ cto de verosimilitudes univariantes."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A sostiene lo contrario (correlación alta destruye la eficiencia de Naïve Bayes). Distractor C confunde la distribu ción a priori con uniformidad estricta. Distractor D olvida q ue Naïve Bayes es un modelo probabilístico generativo, no determinista."}]}, {"width": 918, "page": 26, "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 25 +0.75 pts / -0.25 pts\n25. ¿Qu\né describe el teorema de Bayes?\nALa relación entre error y precisión.\nBLa probabilidad conjunta de eventos independientes.\nCLa relación entre probabilidad posterior, previa y verosimilitud. ✓ RESPUESTA CO\nRRECTA\nDLa distribu\nción normal de los datos.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl Teorema de Bayes establece formalmente la relación probabilística entre la probabilidad a posteriori P(C|X), la\nprobabilidad a priori P(C), la verosimilitud de los datos P(X|C) y la probabilidad marginal de la evidencia P(X):\nP(C|X) = [P(C) * P(X|C)] / P(X) (Diapositivas Tema 8, pág. 12). Permite actualizar nuestras creencias ante nueva\nevidencia empírica.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A confunde Bayes con métricas de evaluación empírica. Distractor B describe la probabilidad conjunta bajo\nindependencia m\nutua marginal. Distractor D confunde el teorema con el su\np\nuesto de normalidad en Naïve Bayes\nGaussiano.", "image": "./examenes_resueltos_master_ia_pages/page_26.jpg", "height": 1188, "title": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 25 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 25 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "25. ¿Qu"}, {"type": "paragraph", "text": "é describe el teorema de Bayes?"}, {"type": "paragraph", "text": "ALa relación entre error y precisión."}, {"type": "paragraph", "text": "BLa probabilidad conjunta de eventos independientes."}, {"type": "paragraph", "text": "CLa relación entre probabilidad posterior, previa y verosimilitud. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "DLa distribu ción normal de los datos."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El Teorema de Bayes establece formalmente la relación probabilística entre la probabilidad a posteriori P(C|X), la probabilidad a priori P(C), la verosimilitud de los datos P(X|C) y la probabilidad marginal de la evidencia P(X):"}, {"type": "paragraph", "text": "P(C|X) = [P(C) * P(X|C)] / P(X) (Diapositivas Tema 8, pág. 12). Permite actualizar nuestras creencias ante nueva evidencia empírica."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A confunde Bayes con métricas de evaluación empírica. Distractor B describe la probabilidad conjunta bajo independencia m utua marginal. Distractor D confunde el teorema con el sup uesto de normalidad en Naïve Bayes"}, {"type": "paragraph", "text": "Gaussiano."}]}, {"height": 1188, "width": 918, "page": 27, "image": "./examenes_resueltos_master_ia_pages/page_27.jpg", "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 26 +0.75 pts / -0.25 pts\n26. ¿Por q\nu\né se utiliza el estimador de Laplace en Naïve Bayes?\nA Para eliminar variables irrelevantes.\nB Para mejorar la interpretabilidad del modelo.\nC Para evitar probabilidades nulas en combinaciones no observadas. ✓ RESPUESTA CO\nRRECTA\nD Para redu\ncir la dimensionalidad.\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl estimador o suavizado de Laplace (Laplace smoothing / Add-1) su\nma una pseudocuenta unitaria al nu\nmerador\ny el tamaño del vocabulario V al denominador: P(x|c) = (count(x,\nc) + 1) / (count(c) + V) (Diapositivas Tema 8, pág.\n19). Su función imperativa es evitar el problema de la probabilidad cero (zero freq\nuency problem), donde una\nsola combinación no observada en entrenamiento anularía por completo el produ\ncto final de probabilidades a\nposteriori.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A se refiere a selección de variables. Distractor B confunde suavizado con interpretabilidad. Distractor D lo\nconfunde con redu\ncción de dimensionalidad.", "title": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 26 +0.75 pts / -0.25 pts", "blocks": [{"type": "title", "text": "TAA Tema 8: Clasificación con Naïve Bayes Test Oficial · Pregunta 26 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "26. ¿Por qu"}, {"type": "paragraph", "text": "é se utiliza el estimador de Laplace en Naïve Bayes?"}, {"type": "paragraph", "text": "A Para eliminar variables irrelevantes."}, {"type": "paragraph", "text": "B Para mejorar la interpretabilidad del modelo."}, {"type": "paragraph", "text": "C Para evitar probabilidades nulas en combinaciones no observadas. ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Para redu cir la dimensionalidad."}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El estimador o suavizado de Laplace (Laplace smoothing / Add-1) su ma una pseudocuenta unitaria al nu merador y el tamaño del vocabulario V al denominador: P(x|c) = (count(x, c) + 1) / (count(c) + V) (Diapositivas Tema 8, pág."}, {"type": "paragraph", "text": "19). Su función imperativa es evitar el problema de la probabilidad cero (zero freq uency problem), donde una sola combinación no observada en entrenamiento anularía por completo el produ cto final de probabilidades a posteriori."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A se refiere a selección de variables. Distractor B confunde suavizado con interpretabilidad. Distractor D lo confunde con redu cción de dimensionalidad."}]}, {"text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 27 +0.75 pts / -0.25 pts\n27. ¿Cu\nál es el objetivo principal del bagging?\nARedu\ncir el sesgo del modelo\nBRedu\ncir la varianza del modelo ✓ RESPUESTA CO\nRRECTA\nC Au\nmentar la complejidad del modelo\nD Eliminar el ruido de los datos\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl objetivo matemático cardinal del Bagging (Bootstrap Aggregating, prop\nuesto por Leo Breiman en 1996) es\nredu\ncir sustancialmente la varianza del modelo comp\nuesto sin alterar apreciablemente su sesgo (Diapositivas\nTema 9, pág. 11). Para ello, entrena múltiples estimadores base de alta varianza (como árboles profundos) sobre\nsub\nconjuntos generados por rem\nuestreo con reemplazo (bootstrap) y promedia sus predicciones.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A es la trampa clásica: redu\ncir el sesgo es el objetivo del Boosting, NO del Bagging. Distractor C confunde\nredu\ncir varianza con complejizar el modelo. Distractor D confunde ensamble con técnicas de filtrado de ruido.", "image": "./examenes_resueltos_master_ia_pages/page_28.jpg", "page": 28, "height": 1188, "width": 918, "title": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 27 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 27 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "27. ¿Cu"}, {"type": "paragraph", "text": "ál es el objetivo principal del bagging?"}, {"type": "paragraph", "text": "ARedu cir el sesgo del modelo"}, {"type": "paragraph", "text": "BRedu cir la varianza del modelo ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "C Au mentar la complejidad del modelo"}, {"type": "paragraph", "text": "D Eliminar el ruido de los datos"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El objetivo matemático cardinal del Bagging (Bootstrap Aggregating, prop uesto por Leo Breiman en 1996) es redu cir sustancialmente la varianza del modelo comp uesto sin alterar apreciablemente su sesgo (Diapositivas"}, {"type": "paragraph", "text": "Tema 9, pág. 11). Para ello, entrena múltiples estimadores base de alta varianza (como árboles profundos) sobre sub conjuntos generados por rem uestreo con reemplazo (bootstrap) y promedia sus predicciones."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A es la trampa clásica: redu cir el sesgo es el objetivo del Boosting, NO del Bagging. Distractor C confunde redu cir varianza con complejizar el modelo. Distractor D confunde ensamble con técnicas de filtrado de ruido."}]}, {"height": 1188, "page": 29, "text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 28 +0.75 pts / -0.25 pts\n28. En el algoritmo boosting, ¿cómo se construyen los modelos?\nA Independientemente en paralelo\nBUsando datos sintéticos\nC De forma secuencial, teniendo en cuenta errores previos ✓ RESPUESTA CO\nRRECTA\nD Eliminando variables irrelevantes\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEn la familia de algoritmos de Boosting (como AdaBoost y Gradient Boosting), los estimadores base dé\nbiles\n(weak learners) se construyen de manera estrictamente secuencial y adaptativa (Diapositivas Tema 9, pág. 18;\nFreund & Schapire, 1997). Cada nuevo modelo se enfoca prioritariamente en corregir los errores residuales\ncometidos por los modelos precedentes, reponderando m\nuestras o ajustando gradientes negativos.\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe la constru\ncción en paralelo independiente propia del Bagging. Distractor B describe técnicas de\nsobrem\nuestreo sintético como SM\nOTE. Distractor D describe selección de características.", "image": "./examenes_resueltos_master_ia_pages/page_29.jpg", "width": 918, "title": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 28 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 28 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "28. En el algoritmo boosting, ¿cómo se construyen los modelos?"}, {"type": "paragraph", "text": "A Independientemente en paralelo"}, {"type": "paragraph", "text": "BUsando datos sintéticos"}, {"type": "paragraph", "text": "C De forma secuencial, teniendo en cuenta errores previos ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "D Eliminando variables irrelevantes"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "En la familia de algoritmos de Boosting (como AdaBoost y Gradient Boosting), los estimadores base dé biles"}, {"type": "paragraph", "text": "(weak learners) se construyen de manera estrictamente secuencial y adaptativa (Diapositivas Tema 9, pág. 18;"}, {"type": "paragraph", "text": "Freund & Schapire, 1997). Cada nuevo modelo se enfoca prioritariamente en corregir los errores residuales cometidos por los modelos precedentes, reponderando m uestras o ajustando gradientes negativos."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe la constru cción en paralelo independiente propia del Bagging. Distractor B describe técnicas de sobrem uestreo sintético como SM"}, {"type": "paragraph", "text": "OTE. Distractor D describe selección de características."}]}, {"width": 918, "text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 29 +0.75 pts / -0.25 pts\n29. ¿Qu\né caracteriza al método stacking?\nA Combina modelos mediante m\nuestreo bootstrap\nBUtiliza un metamodelo sobre las salidas de modelos base ✓ RESPUESTA CO\nRRECTA\nCReentrena un único modelo múltiples veces\nD Solo se aplica a clasificación\n📘 J\nUSTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)\nEl método de Stacking (Stacked Generalization, Wolpert 1992) se caracteriza por organizar el aprendizaje en dos\nniveles jerárq\nuicos: entrena un conjunto de modelos base heterogéneos (Nivel 0) y posteriormente entrena un\nmetamodelo o meta-clasificador (Nivel 1) cuyas variables de entrada son las predicciones probabilísticas\ngeneradas por los modelos base (Diapositivas Tema 9, pág. 26).\n⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO\nDistractor A describe Bagging. Distractor C describe reentrenamiento iterativo sin meta-aprendizaje. Distractor D es\nfalso: Stacking se aplica idénticamente tanto a problemas de clasificación como de regresión continua.", "height": 1188, "page": 30, "image": "./examenes_resueltos_master_ia_pages/page_30.jpg", "title": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 29 +0.75 pts / -0", "blocks": [{"type": "paragraph", "text": "TAA Tema 9: Combinación de Clasificadores (Ensembles) Test Oficial · Pregunta 29 +0.75 pts / -0.25 pts"}, {"type": "bullet", "text": "29. ¿Qu"}, {"type": "paragraph", "text": "é caracteriza al método stacking?"}, {"type": "paragraph", "text": "A Combina modelos mediante m uestreo bootstrap"}, {"type": "paragraph", "text": "BUtiliza un metamodelo sobre las salidas de modelos base ✓ RESPUESTA CO"}, {"type": "heading", "text": "RRECTA"}, {"type": "paragraph", "text": "CReentrena un único modelo múltiples veces"}, {"type": "paragraph", "text": "D Solo se aplica a clasificación"}, {"type": "heading", "text": "📘 J"}, {"type": "heading", "text": "USTIFICACIÓN TEÓRICO-PRÁCTICA OFICIAL (UNIR)"}, {"type": "paragraph", "text": "El método de Stacking (Stacked Generalization, Wolpert 1992) se caracteriza por organizar el aprendizaje en dos niveles jerárq uicos: entrena un conjunto de modelos base heterogéneos (Nivel 0) y posteriormente entrena un metamodelo o meta-clasificador (Nivel 1) cuyas variables de entrada son las predicciones probabilísticas generadas por los modelos base (Diapositivas Tema 9, pág. 26)."}, {"type": "heading", "text": "⚠ TRAMPA DE EXAMEN FRECUENTE Y RAZONAMIENTO CRÍTICO"}, {"type": "paragraph", "text": "Distractor A describe Bagging. Distractor C describe reentrenamiento iterativo sin meta-aprendizaje. Distractor D es falso: Stacking se aplica idénticamente tanto a problemas de clasificación como de regresión continua."}]}, {"width": 918, "height": 1188, "image": "./examenes_resueltos_master_ia_pages/page_31.jpg", "page": 31, "text": "TAA Tema 10: Random Forest Test Oficial · Pregunta 30 +0.75 pts / -0.25 pts\n30. ¿Cu\nál es el principio fundamental de random forest?\nA Entren
