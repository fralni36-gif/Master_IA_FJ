ación dinámica\nqu\ne enc\nu\nen\ntra la sec\nu\nencia de\nestados oc\nult\nos más probable\nevaluando\nrec\nursivamen\nt\ne enrejados (trell\nis):\n, almacenando pu\nn\nt\neros hacia\natrás (backpoin\nt\ners) para rec\nuperar\nel camino gl\nobal ópt\nimo.\nComplejidad Po\nlinómica\nRed\nu\nce la complejidad\nexponencial de f\nu\nerza\nbruta a t\niempo\nl\nineal respec\nt\no a la\nl\nongi\ntu\nd de la oración .\nUnderfl\now Ari\ntmét\nico\nMult\nipl\nicar cien\nt\nos de\nprobabi\nl\nidades menores\nqu\ne 1 prod\nu\nce ceros\nfl\no\ntan\nt\nes; obl\niga a operar\nestric\ntamen\nt\ne en escala\nl\nogarí\ntmica (Log-Vi\nt\nerbi).\nDecodificación\nNe\nuronal\nBiLSTM-\nCRF\nRedes bidireccionales\ncon capa CRF qu\ne\ncapturan\ndependencias de\nlarga distancia hacia\nadelan\nt\ne y hacia atrás.\nPreg\nu\nn\nta Fija de Examen: Se\npreg\nu\nn\nta por qué gana u\nn\nestado fren\nt\ne a o\ntro en\nu\nna\ncelda (ej. VBD sobre NN).\nJust\nificar por prod\nu\nc\nt\no\n.\n📐 EJERCICI\nO\nS NUMÉRIC\nO\nS Y PRÁCTIC\nO\nS DEL TEMA 3\nCálc\nul\no\nO\nficial Cel\nia Cabell\no\n3.1 EJERCICI\nO O\nFICIAL: MINI-C\nO\nRPUS AN\nO\nTAD\nO\nY C\nO\nNTE\nO\nDE PR\nO\nB\nA\nBILIDADES HMM Semana 4 Diaposi\nt\niva Pág. 7\nMini-Corpus A\nno\ntado:\n1. El/DT gat\no/NN d\nu\nerme/VB\n2. La/DT gata/NN come/VB pescado/NN\n3. Un/DT perro/NN corre/VB\nSec\nu\nencias con START y END:\n1. START DT NN VB END\n2. START DT NN VB NN END\n3. START DT NN VB END\nt\ni\nw\ni\nW=\n(w , … , w )\n1 T\nT=\n(t , … , t )\n1 T\nπ\n=\ni P (t ∣\ni START)\nA= [a ] =\nij P (t ∣\nj t )\ni\nB= [b (k)] =\nj\nP (w ∣\nk t )\nj\nt\ni−1\nt\ni\nP (T ∣ W )\n=\nT^\narg max P (W , T )\nT\nv (j) =\nt max [v (i) ⋅\ni=1\nN\nt−1 a ] ⋅\nij\nb (w )\nj t\nO(T⋅ N )\n2\nO(N )\nT\nT\nmax[v\n⋅\nt−1 a ] ⋅\nij b\nj\n→ → → →\n→ → → → →\n→ → → →", "width": 841, "page": 6, "height": 594, "title": "T3 Tema 3: Et", "blocks": [{"type": "title", "text": "T3 Tema 3: Et"}, {"type": "paragraph", "text": "iqu"}, {"type": "paragraph", "text": "e"}, {"type": "p paragraph", "text": "e» (el t"}, {"type": "paragraph", "text": "odo)."}, {"type": "paragraph", "text": "Troponimia (Manera de hacer u"}, {"type": "paragraph", "text": "n verbo):"}, {"type": "paragraph", "text": "«susurrar» es u"}, {"type": "paragraph", "text": "n"}, {"type": "paragraph", "text": "tropónimo de «hablar» (manera espec"}, {"type": "paragraph", "text": "ífica de hablar)."}]}, {"height": 594, "text": "T6 Tema 6: Desambig\nuación del Sen\nt\nido de las Palabras (WSD)\nSemana 7 y 8 · A\nlgori\ntmos de Lesk, Sch\nütze y Yarowsky\n1. C\nO\nNCEPT\nO\n/\nTÉCNICA\n2. DEFINICIÓN RIGUR\nO\nSA\n3. B\nO\nNDADES\n(VENTAJAS) 4. LIMITACI\nO\nNES\n5. ¿A QUÉ\nEV\nO\nLUCI\nO\nNA\n? TIPS DE EXAMEN & SPACY\nA\nlgori\ntmo de Lesk\nO\nriginal (1986) vs\nSimpl\nificado (Ki\nlgarriff\n2\n000)\nEnfoqu\ne basado en conocimien\nt\no\nqu\ne resu\nelve la po\nl\nisemia\ncomparando el so\nlapamien\nt\no\nléxico\n(in\nt\nersección de palabras de\ncon\nt\nenido) en\ntre el con\nt\next\no de la\noración y las gl\nosas/ejempl\nos de\ncada sen\nt\nido en\nu\nn diccionario o\nWordNe\nt:\n.\nCero En\ntrenamien\nt\no\nA\nno\ntado\nNo requ\niere corpora\nsupervisados ano\ntados\ncon sen\nt\nidos léxicos,\napoyándose\nú\nnicamen\nt\ne\nen\nu\nn rec\nurso\nléxico\nestándar.\nExtrema Fragilidad Léxica\nFalla comple\ntamen\nt\ne si el\nt\next\no\nusa sinónimos o\nparáfrasis qu\ne no\ncoinciden\nl\ni\nt\neralmen\nt\ne\ncon\nlas palabras exac\ntas\nde la gl\nosa.\nA\nlgori\ntmo de Sch\nütze\n& Embeddings\nRepresen\ntación en\nespacios vec\nt\noriales\ndensos donde la\nsimi\nl\ni\ntu\nd no depende\nde la coincidencia\nort\nográfica exac\nta.\nPreg\nu\nn\nta Fija Examen:\nDesambig\nuar \"banco\" con\nLesk Simpl\nificado. La palabra\n\"dinero\" genera so\nlapamien\nt\no\n= 1 con (financiero).\nA\nlgori\ntmo de Sch\nütze\nWSD Vec\nt\norial No\nS\nupervisado\nMét\nodo qu\ne prescinde de\ndiccionarios ext\nernos: constru\nye\nrepresen\ntaciones vec\nt\noriales de\nseg\nu\nndo orden basadas en\ncooc\nurrencias léxicas en corpus y\nagrupa las apariciones de la palabra\nambig\nua median\nt\ne clust\nering (K-\nMeans). El sen\nt\nido se asigna\ncalc\nulando\nla distancia del vec\nt\nor de\ncon\nt\next\no al cen\ntroide del clúst\ner más\ncercano.\nDesc\nu\nbrimien\nt\no Ind\nu\nc\nt\nivo\nDesc\nu\nbre\naut\nomát\nicamen\nt\ne\nacepciones reales no\ncatal\nogadas y jergas\nespecial\nizadas en el\ncorpus.\nSen\nt\nidos Huérfanos\nProd\nu\nce clúst\neres\nmat\nemát\nicos abstrac\nt\nos\n(Clúst\ner 1, Clúst\ner 2) qu\ne\ncarecen de e\nt\niqu\ne\nta\nl\ning\nü\níst\nica h\numana legible\nsin in\nt\nervención man\nual.\nClust\nering de\nEmbeddings\nCon\nt\nextuales\nAgrupamien\nt\no de\nvec\nt\nores BERT de la\nmisma palabra en\ndist\nin\nt\nos con\nt\next\nos\npara ind\nu\ncir sen\nt\nidos\n(Word Sense\nInd\nu\nc\nt\nion).\nExamen: Se basa en\nla\ndistancia e\nu\ncl\nidiana o coseno\nal cen\ntroide del clúst\ner más\ncercano.\nBoo\ntstrapping de\nYarowsky\nA\nlgori\ntmo Semi-\nS\nupervisado (1995)\nA\nlgori\ntmo i\nt\nerat\nivo basado en dos\nhipót\nesis l\ning\nü\níst\nicas f\nu\nndamen\ntales:\nO\nne sense per disco\nurse (u\nna\npalabra man\nt\niene el mismo sen\nt\nido\nen\nt\nodo el doc\numen\nt\no) y\nO\nne sense\nper co\nll\nocat\nion (palabras con\nt\nig\nuas\ncondicionan el sen\nt\nido). Inicia con\npocas semi\nllas (seeds), en\ntrena u\nn\nclasificador de reglas y e\nt\niqu\ne\nta\ni\nt\nerat\nivamen\nt\ne el corpus no ano\ntado.\nEfec\nt\no Palanca Masivo\nCon\nu\nn pu\nñado de\nejempl\nos semi\nlla iniciales\nalcanza precisiones\ncompe\nt\ni\nt\nivas (>90%) en\ncorpora gigan\nt\nes sin\nsupervisión cost\nosa.\nDeriva Semán\nt\nica\n(Seman\nt\nic Drif\nt\n)\nUn falso posi\nt\nivo\ne\nt\niqu\ne\ntado en\nu\nna\ni\nt\neración\nt\nemprana\ncon\ntamina las reglas\nsu\nbsig\nu\nien\nt\nes\nampl\nificando el error\nexponencialmen\nt\ne.\nSelf-Training y Semi-\nS\nupervised\nTransformers\nAprendizaje\nsemisupervisado con\nPse\nu\ndo-label\ning y\nreg\nularización de\nconsist\nencia en redes\nprof\nu\nndas.\nPreg\nu\nn\nta Test: Las dos\nhipót\nesis de Yarowsky son:\n«u\nn sen\nt\nido por disc\nurso» y\n«u\nn sen\nt\nido por co\nl\nocación».\n📐 EJERCICI\nO\nS NUMÉRIC\nO\nS Y PRÁCTIC\nO\nS DEL TEMA 6\n=\nS^\narg max ∣Bolsa(Contexto) ∩\nS\nk\nFirma(S )∣\nk\nS1", "width": 841, "page": 12, "title": "T6 Tema 6: Desambig", "blocks": [{"type": "title", "text": "T6 Tema 6: Desambig"}, {"type": "paragraph", "text": "uación del Sen"}, {"type": "paragraph", "text": "t"}, {"type": "paragraph", "text": "ido de las Palabras (WSD)"}, {"type": "paragraph", "text": "Semana 7 y 8 · A"}, {"type": "paragraph", "text": "lgori"}, {"type": "paragraph", "text": "tmos de Lesk, Sch"}, {"type": "paragraph", "text": "ütze y Yarowsky"}, {"type": "bullet", "text": "1. C"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "NCEPT"}, {"type": "heading", "text": "O"}, {"type": "paragraph", "text": "/"}, {"type": "heading", "text": "TÉCNICA"}, {"type": "bullet", "text": "2. DEFINICIÓN RIGUR"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "SA"}, {"type": "bullet", "text": "3. B"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "NDADES"}, {"type": "heading", "text": "(VENTAJAS) 4. LIMITACI"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "NES"}, {"type": "bullet", "text": "5. ¿A QUÉ"}, {"type": "heading", "text": "EV"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "LUCI"}, {"type": "heading", "text": "O"}, {"type": "heading", "text": "NA"}, {"type": "heading", "text": "? TIPS DE EXAMEN & SPACY"}, {"type": "heading", "text": "A"}, {"type": "paragraph", "text": "lgori"}, {"type": "paragraph", "text": "tmo de Lesk"}, {"type": "heading", "text": "O"}, {"type": "paragraph", "text": "riginal (1986) vs"}, {"type": "paragraph", "text": "Simpl"}, {"type": "paragraph", "text": "ificado (Ki"}, {"type": "paragraph", "text": "lgarriff"}, {"type": "heading", "text": "2"}, {"type": "heading", "text": "000) \nO\nW: Predice la palabra\nobje\nt\nivo a part\nir del con\nt\next\no\ncirc\nu\nndan\nt\ne . Skip-\nGram: Predice las palabras de\ncon\nt\next\no a part\nir de la palabra\ncen\ntral (opt\nimizado con Negat\nive\nSampl\ning).\nPropiedades Ari\ntmét\nicas\nSemán\nt\nicas\nPermi\nt\ne operaciones de\nanal\nogía vec\nt\norial\nfamosas:\n.\nPo\nlisemia No Resu\nelta\n(Vec\nt\nor Estát\nico)\nCada palabra recibe\nu\nn\nú\nnico vec\nt\nor fijo en el\nespacio, co\nlapsando\nt\nodos sus sen\nt\nidos\n(«banco» financiero y\nmu\neble compart\nen el\nmismo vec\nt\nor).\nRepresen\ntaciones\nCon\nt\nextuales\nDinámicas\nTransformers (ELMo,\nBERT) donde cada\nt\no\nken recibe\nu\nn\nembedding dinámico\ncondicionado por t\noda\nla frase.\nExamen: CB\nO\nW es más\nrápido y f\nu\nnciona mejor en\npalabras frec\nu\nen\nt\nes; Sk\nip-\nGram es superior en palabras\nraras o datase\nts pequ\neños.\nRedes Rec\nurren\nt\nes:\nLSTM vs. GRU\nSec\nu\nencias\nTemporales y\nMi\nt\nigación de\nGradien\nt\ne\nModel\nos ne\nuronales diseñados para\nsec\nu\nencias. LSTM: Resu\nelve el\ndesvanecimien\nt\no de gradien\nt\ne\nmedian\nt\ne\nu\nn Cell S\ntat\ne con\nt\nin\nu\no ( )\nreg\nulado por 3 compu\nertas:\nO\nlvido (\n), En\ntrada ( ) y Sal\nida ( ). GRU:\nVarian\nt\ne simpl\nificada qu\ne f\nusiona\nestado oc\nult\no y celda, ut\ni\nl\nizando so\nl\no\n2 compu\nertas: A\nc\ntual\nización ( ) y\nReinicio ( ).\nMemoria de Largo\nA\nlcance\nCapturan dependencias\nsin\ntác\nt\nicas y semán\nt\nicas a\ntravés de decenas de\npasos t\nemporales. GRU\nes 25-30% más rápida de\nen\ntrenar.\nProcesamien\nt\no\nSec\nu\nencial No\nParalelizable\nEl paso depende\nestric\ntamen\nt\ne del paso\n, impidiendo\naprovechar la\nparalel\nización masiva de\nlas GPUs modernas.\nArqu\ni\nt\nec\ntura\nTransformer\nPrescinde\nt\no\ntalmen\nt\ne\nde rec\nurrencias\nmedian\nt\ne Self-\nA\ntt\nen\nt\nion\ncomple\ntamen\nt\ne\nparalel\nizable.\nPreg\nu\nn\nta Test: GRU t\niene\nmenos paráme\ntros qu\ne LSTM\nal\nno poseer compu\nerta de\nsal\nida separada ni cell stat\ne\ndesacoplado.\nLa Revo\nlu\nción del\nTransformer\nVaswani e\nt al. (2\n017) ·\n«A\ntt\nen\nt\nion is A\nll Yo\nu\nNeed»\nArqu\ni\nt\nec\ntura basada í\nn\nt\negramen\nt\ne en\nmecanismos de aut\noat\nención (Self-\nA\ntt\nen\nt\nion) y capas Feed-Forward con\nconexiones resid\nuales y\nnormal\nización. Computa relaciones\ndirec\ntas en\ntre c\nualqu\nier par de\nt\no\nkens sin importar su\ndistancia (\noperaciones sec\nu\nenciales):\n.\nParalelización\nAbso\nluta y\nCero Pérdida de\nGradien\nt\ne\nEn\ntrena sobre mi\nles de\nmi\nll\nones de\nt\no\nkens en\nt\niempo récord y captura\ncon\nt\next\no bidireccional\nprof\nu\nndo simultáneo.\nComplejidad Cuadrát\nica\nEl cost\ne computacional y\nde memoria de la\nat\nención escala con el\nc\nuadrado de la l\nongi\ntu\nd\nde la sec\nu\nencia (c\nu\nell\no\nde bo\nt\nella de con\nt\next\no\nlargo).\nA\nt\nención Dispersa y\nArqu\ni\nt\nec\nturas Flash\nFlash\nA\ntt\nen\nt\nion, RoPE,\nS\ntat\ne Space Models\n(Mamba) y MoE\n(Mixture of Experts).\nExamen: El fac\nt\nor evi\nta\nqu\ne el prod\nu\nc\nt\no pu\nn\nt\no crezca\nexcesivamen\nt\ne en\ndimensiones altas,\nempu\njando\nla f\nu\nnción\nsof\ntmax hacia regiones con\ngradien\nt\nes casi n\nul\nos.\n∈\nv Rd\nd ≈ 300\nw\nt\nw , … , w\nt−c t+c\nw\nt\n(\"Rey\") −\nv\n(\"Hombre\") +\nv\n(\"Mujer\") ≈\nv\n(\"Reina\")\nv\nC\nt\nf\nt i\nt o\nt\nz\nt\nr\nt\nt\nt− 1\nO(1)\nAttention(Q, K, V ) =\nsoftmax V\n(\nd\nk\nQKT )\nO(n )\n2\nn\nd\nk", "width": 841, "title": "T8 Tema 8: Modelado Ne", "blocks": [{"type": "title", "text": "T8 Tema 8: Modelado Ne"}, {"type": "paragraph", "text": "uronal, Redes Rec"}, {"type": "paragraph", "text": "urren"}, {"type": "paragraph", "text": "t"}, {"type": "paragraph", "text": "es (LSTM/GRU) y Transformers (BERT/BET"}, {"type": "heading", "text": "O)"}, {"type": "paragraph", "text": "Semana 10"}, {"type": "paragraph", "text": "y 11 · De Embeddings Estát"}, {"type": "paragraph", "text": "icos a A"}, { 9 Tema 9: Aplicaciones Ind\nustriales del PLN: NER, Extracción de Relaciones y\nA\nnálisis de Aspec\nt\nos (A\nBSA)\nSemana 12 · Extracción de Información y Minería de O\npiniones\n1. C\nO\nNCEPT\nO\n/\nTÉCNICA\n2. DEFINICIÓN RIGUR\nO\nSA\n3. B\nO\nNDADES\n(VENTAJAS) 4. LIMITACI\nO\nNES\n5. ¿A QUÉ\nEV\nO\nLUCI\nO\nNA\n? TIPS DE EXAMEN & SPACY\nReconocimien\nt\no de\nEn\nt\nidades Nombradas\n(NER)\nBI\nO\n/ I\nO\nB vs BIL\nO\nU\nSchemes\nTarea de Extracción de Información\nqu\ne l\nocal\niza y clasifica menciones de\nen\nt\nidades en cat\negorías predefinidas\n(Persona, Lu\ngar,\nO\nrganización,\nFecha, e\nt\nc.). Formalmen\nt\ne se modela\ncomo e\nt\niqu\ne\ntado sec\nu\nencial donde\ncada t\no\nken recibe\nu\nna e\nt\niqu\ne\nta de\nposición: BI\nO: (Begin), (Inside),\n(\nO\nutside). BIL\nO\nU: A\nñade (Last)\ny (Uni\nt para en\nt\nidades de\nu\nna so\nla\npalabra).\nEstru\nc\nturación\nA\nut\nomat\nizada\nConviert\ne\nt\next\no\nl\nibre no\nestru\nc\nturado en registros\nrelacionales y bases de\ndat\nos estru\nc\nturadas.\nBIL\nO\nU red\nu\nce\nambig\nü\nedades en\nen\nt\nidades largas.\nEn\nt\nidades A\nnidadas y\nDiscon\nt\nin\nuas\nEl esqu\nema BI\nO\nplano\nco\nlapsa c\nuando\nu\nna\nen\nt\nidad está con\nt\nenida\nden\ntro de o\ntra (ej. \"\n[Banco de [España]]\").\nNER Basado en Span\n/ LLM Few-Sho\nt\nExtracción median\nt\ne\nclasificación de pares\nde spans y prompts\nestru\nc\nturados con\nsal\nida JS\nO\nN Schema.\nspaCy: doc.ents,\nent.label\n_, ent.text.\nA\nnál\nisis de\nSen\nt\nimien\nt\nos Basado\nen\nAspec\nt\nos (A\nBSA)\nATE (Aspec\nt\nTerm) +\nASC (Sen\nt\nimen\nt\n)\nDescomposición de la minería de\nopiniones en dos su\nb\ntareas\nacopladas: 1) Aspec\nt\nTerm\nExtrac\nt\nion (ATE): Iden\nt\nificar l\nos\natrib\nut\nos espec\níficos del\nprod\nu\nc\nt\no/servicio mencionados (ej.\n\"bat\nería\", \"pan\ntalla\"). 2) Aspec\nt\nSen\nt\nimen\nt Classificat\nion (ASC):\nDe\nt\nerminar la po\nlaridad (posi\nt\nivo,\nnegat\nivo, ne\nutro) dirigida\nexc ul\no\n2 (Caso de Uso)\nCaso 1: De\nt\nección y Clasificación de Mensajes Problemát\nicos\nO\ndio / A\ncoso\n1. Pipeline de Preprocesamien\nt\no: Normal\nización de jerga de redes sociales, expansión de con\ntracciones, conservación obl\nigat\noria de st\nopwords de negación (\"no\", \"n\nu\nnca\") y signos enfát\nicos.\n2. Arqu\ni\nt\nec\ntura Recomendada: Model\no Transformer l\nigero preen\ntrenado (BET\nO\n/ RoBERTa) con capa de clasificación de sec\nu\nencia. Embeddings con\nt\nextuales qu\ne capturan sarcasmo e iron\nía.\n3. Mi\nt\nigación de Desbalanceo: En odio extremo (<2% casos), ut\ni\nl\nizar Focal Loss o ponderación de clases inversa (Class Weigh\nts) y evaluar con F1-Macro (n\nu\nnca A\ncc\nuracy).\nCaso 2: De\nt\nección\nA\nut\nomát\nica de No\nt\nicias Falsas (Fake News)\nDesinformación\n1. Enfoqu\ne Híbrido Est\nil\nométrico + Semán\nt\nico: Extraer carac\nt\neríst\nicas l\ning\nü\níst\nicas superficiales (porcen\ntaje de signos de exclamación, may\núsc\nulas, adje\nt\nivos superlat\nivos) combinado con embeddings densos\nBERT.\n2. Verificación de Hechos (Fac\nt\n-Checking con RAG): Conec\ntar la no\nt\nicia con\nu\nna base de conocimien\nt\no o grafo de f\nu\nen\nt\nes fiables para comprobar la concordancia fác\nt\nica en\ntre la afirmación y l\nos hechos.\n3. Métrica Clave: Minimizar Falsos Posi\nt\nivos (no censurar no\nt\nicias legí\nt\nimas con est\ni\nl\no sensacional\nista). A\nlta Especificidad y Precision.\nCaso 3: Extracción de Diagnóst\nicos y Negación en Text\nos Médicos\nSalu\nd / Privacidad\n1. NER Cl\ní\nnico Especializado: Ut\ni\nl\nizar model\nos biomédicos de dominio (ej. es_\ncore\n_news_\nmd adaptado o PlanTL RoBERTa-BNE-Biomedical) para en\nt\nidades CIE-10 (Enfermedad, Sí\nn\nt\noma, Medicamen\nt\no).\n2. De\nt\nección de Negación e Incert\nid\numbre: In\nt\negrar algori\ntmos de reglas de con\nt\next\no (t\nipo NegEx o spaCy-Negex) para dist\ning\nu\nir «sin fiebre» de «con fiebre».\n3. Requ\nisi\nt\no Innegociable: Privacidad     let activeDocIdx = 0;
    let currentPage = 1;
    let viewMode = 'single';
    let searchQuery = '';

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatAndHighlight(text, query) {
      let clean = escapeHtml(text);
      if (query && query.trim().length >= 2) {
        const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedQ})`, 'gi');
        clean = clean.replace(regex, '<mark>$1</mark>');
      }
      return clean;
    }

    function initDocSelect() {
      const sel = document.getElementById('docSelect');
      sel.innerHTML = '';
      DOCS.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = d.name;
        sel.appendChild(opt);
      });
    }

    function selectDoc(idx) {
      activeDocIdx = parseInt(idx, 10) || 0;
      currentPage = 1;
      renderAll();
    }

    function renderPageCard(p, totalPages) {
      let blocksHtml = '';
      (p.blocks || []).forEach(b => {
        const content = formatAndHighlight(b.text, searchQuery);
        if (b.type === 'title') {
          blocksHtml += `<h2 class="text-base font-bold text-[var(--foreground)] border-b border-[var(--border)] pb-2 mb-3">${content}</h2>`;
        } else if (b.type === 'heading') {
          blocksHtml += `<h3 class="text-sm font-semibold text-[var(--foreground)] mt-3 mb-1">${content}</h3>`;
        } else if (b.type === 'bullet') {
          blocksHtml += `<div class="text-xs leading-relaxed pl-4 relative my-1"><span class="absolute left-0 text-red-500 font-bold">•</span>${content}</div>`;
        } else if (b.type === 'empty') {
          blocksHtml += `<p class="text-xs italic text-[var(--muted-foreground)]">${content}</p>`;
        } else {
          blocksHtml += `<p class="text-xs leading-relaxed my-1.5">${content}</p>`;
        }
      });

      return `
        <div id="pdf_page_${p.page}" class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-6 shadow-sm">
          <div class="flex items-center justify-between border-b border-[var(--border)] pb-2.5 mb-4">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 text-xs font-bold rounded bg-red-500/10 text-red-500 border border-red-500/20 shrink-0">Página ${p.page} / ${totalPages}</span>
              <span class="text-xs font-semibold text-[var(--muted-foreground)] truncate">${escapeHtml(p.title)}</span>
            </div>
          </div>
          <div class="space-y-1.5">
            ${blocksHtml}
          </div>
        </div>
      `;
    }

    function renderAll() {
      const doc = DOCS[activeDocIdx];
      if (!doc) return;
      const pages = doc.pages || [];

      document.getElementById('docStatsBadge').textContent = `${doc.pageCount} págs · ${doc.words} palabras · ${doc.sizeKb} KB`;
      document.getElementById('pageInput').max = pages.length;
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('totalPagesSpan').textContent = pages.length;

      // Render Sidebar
      const sb = document.getElementById('pageListSidebar');
      sb.innerHTML = '';
      let matches = 0;
      const q = searchQuery.trim().toLowerCase();

      pages.forEach(p => {
        const hasMatch = q.length >= 2 && (p.text || '').toLowerCase().includes(q);
        if (hasMatch) matches++;
        const active = p.page === currentPage;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-2.5 py-1.5 rounded-lg border transition flex items-center justify-between gap-1 ${active ? 'border-[var(--primary)] bg-[var(--card)] font-semibold shadow-sm' : 'border-transparent hover:bg-[var(--card)]'}`;
        btn.onclick = () => {
          currentPage = p.page;
          renderAll();
          if (viewMode === 'all') {
            const el = document.getElementById('pdf_page_' + p.page);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            document.getElementById('pdfViewport').scrollTop = 0;
          }
        };
        btn.innerHTML = `
          <span class="truncate text-xs"><strong class="text-red-500 mr-1">${p.page}.</strong>${escapeHtml(p.title)}</span>
          ${hasMatch ? '<span class="px-1.5 py-0.5 text-xs rounded bg-yellow-400/20 text-yellow-500 font-bold shrink-0">★</span>' : ''}
        `;
        sb.appendChild(btn);
      });

      document.getElementById('searchMatchBadge').textContent = q.length >= 2 ? `${matches} págs` : '';

      // Render Main Canvas
      const canvas = document.getElementById('pdfCanvas');
      if (viewMode === 'single') {
        const p = pages[currentPage - 1];
        canvas.innerHTML = p ? renderPageCard(p, pages.length) : '';
      } else {
        const filtered = q.length >= 2
          ? pages.filter(p => (p.text || '').toLowerCase().includes(q))
          : pages;
        if (filtered.length === 0) {
          canvas.innerHTML = '<div class="p-6 text-xs text-[var(--muted-foreground)] bg-[var(--card)] border border-[var(--border)] rounded-xl">No se encontraron páginas que coincidan con la búsqueda.</div>';
        } else {
          canvas.innerHTML = filtered.map(p => renderPageCard(p, pages.length)).join('');
        }
      }
    }

    function goToPage(n) {
      const doc = DOCS[activeDocIdx];
      if (!doc) return;
      currentPage = Math.max(1, Math.min(doc.pages.length, parseInt(n, 10) || 1));
      renderAll();
    }

    function prevPage() { if (currentPage > 1) goToPage(currentPage - 1); }
    function nextPage() {
      const doc = DOCS[activeDocIdx];
      if (doc && currentPage < doc.pages.length) goToPage(currentPage + 1);
    }

    function setMode(m) {
      viewMode = m;
      document.getElementById('btnModeSingle').className = m === 'single'
        ? 'px-2.5 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] font-medium'
        : 'px-2.5 py-1 rounded-md text-[var(--muted-foreground)]';
      document.getElementById('btnModeAll').className = m === 'all'
        ? 'px-2.5 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] font-medium'
        : 'px-2.5 py-1 rounded-md text-[var(--muted-foreground)]';
      renderAll();
    }

    function onSearch(val) {
      searchQuery = val || '';
      const doc = DOCS[activeDocIdx];
      if (doc && searchQuery.trim().length >= 2) {
        const first = doc.pages.find(p => (p.text || '').toLowerCase().includes(searchQuery.toLowerCase()));
        if (first && !(doc.pages[currentPage - 1].text || '').toLowerCase().includes(searchQuery.toLowerCase())) {
          currentPage = first.page;
        }
      }
      renderAll();
    }

    function copyCurrentText() {
      const doc = DOCS[activeDocIdx];
      if (!doc) return;
      const txt = viewMode === 'single'
        ? (doc.pages[currentPage - 1]?.text || '')
        : doc.pages.map(p => `--- Página ${p.page} ---\n${p.text}`).join('\n\n');
      navigator.clipboard.writeText(txt);
      const btn = document.getElementById('copyBtn');
      btn.textContent = '¡Copiado!';
      setTimeout(() => btn.textContent = 'Copiar', 1500);
    }

    initDocSelect();
    renderAll();
  </script>
