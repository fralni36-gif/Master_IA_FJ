seg\nu\nndo orden basadas en\ncooc\nurrencias léxicas en corpus y\nagrupa las apariciones de la palabra\nambig\nua median\nt\ne clust\nering (K-\nMeans). El sen\nt\nido se asigna\ncalc\nulando\nla distancia del vec\nt\nor de\ncon\nt\next\no al cen\ntroide del clúst\ner más\ncercano.\nDesc\nu\nbrimien\nt\no Ind\nu\nc\nt\nivo\nDesc\nu\nbre\naut\nomát\nicamen\nt\ne\nacepciones reales no\ncatal\nogadas y jergas\nespecial\nizadas en el\ncorpus.\nSen\nt\nidos Huérfanos\nProd\nu\nce clúst\neres\nmat\nemát\nicos abstrac\nt\nos\n(Clúst\ner 1, Clúst\ner 2) qu\ne\ncarecen de e\nt\niqu\ne\nta\nl\ning\nü\níst\nica h\numana legible\nsin in\nt\nervención man\nual.\nClust\nering de\nEmbeddings\nCon\nt\nextuales\nAgrupamien\nt\no de\nvec\nt\nores BERT de la\nmisma palabra en\ndist\nin\nt\nos con\nt\next\nos\npara ind\nu\ncir sen\nt\nidos\n(Word Sense\nInd\nu\nc\nt\nion).\nExamen: Se basa en\nla\ndistancia e\nu\ncl\nidiana o coseno\nal cen\ntroide del clúst\ner más\ncercano.\nBoo\ntstrapping de\nYarowsky\nA\nlgori\ntmo Semi-\nS\nupervisado (1995)\nA\nlgori\ntmo i\nt\nerat\nivo basado en dos\nhipót\nesis l\ning\nü\níst\nicas f\nu\nndamen\ntales:\nO\nne sense per disco\nurse (u\nna\npalabra man\nt\niene el mismo sen\nt\nido\nen\nt\nodo el doc\numen\nt\no) y\nO\nne sense\nper co\nll\nocat\nion (palabras con\nt\nig\nuas\ncondicionan el sen\nt\nido). Inicia con\npocas semi\nllas (seeds), en\ntrena u\nn\nclasificador de reglas y e\nt\niqu\ne\nta\ni\nt\nerat\nivamen\nt\ne el corpus no ano\ntado.\nEfec\nt\no Palanca Masivo\nCon\nu\nn pu\nñado de\nejempl\nos semi\nlla iniciales\nalcanza precisiones\ncompe\nt\ni\nt\nivas (>90%) en\ncorpora gigan\nt\nes sin\nsupervisión cost\nosa.\nDeriva Semán\nt\nica\n(Seman\nt\nic Drif\nt\n)\nUn falso posi\nt\nivo\ne\nt\niqu\ne\ntado en\nu\nna\ni\nt\neración\nt\nemprana\ncon\ntamina las reglas\nsu\nbsig\nu\nien\nt\nes\nampl\nificando el error\nexponencialmen\nt\ne.\nSelf-Training y Semi-\nS\nupervised\nTransformers\nAprendizaje\nsemisupervisado con\nPse\nu\n mico\ncondicionado por t\noda\nla frase.\nExamen: CB\nO\nW es más\nrápido y f\nu\nnciona mejor en\npalabras frec\nu\nen\nt\nes; Sk\nip-\nGram es superior en palabras\nraras o datase\nts pequ\neños.\nRedes Rec\nurren\nt\nes:\nLSTM vs. GRU\nSec\nu\nencias\nTemporales y\nMi\nt\nigación de\nGradien\nt\ne\nModel\nos ne\nuronales diseñados para\nsec\nu\nencias. LSTM: Resu\nelve el\ndesvanecimien\nt\no de gradien\nt\ne\nmedian\nt\ne\nu\nn Cell S\ntat\ne con\nt\nin\nu\no ( )\nreg\nulado por 3 compu\nertas:\nO\nlvido (\n), En\ntrada ( ) y Sal\nida ( ). GRU:\nVarian\nt\ne simpl\nificada qu\ne f\nusiona\nestado oc\nult\no y celda, ut\ni\nl\nizando so\nl\no\n2 compu\nertas: A\nc\ntual\nización ( ) y\nReinicio ( ).\nMemoria de Largo\nA\nlcance\nCapturan dependencias\nsin\ntác\nt\nicas y semán\nt\nicas a\ntravés de decenas de\npasos t\nemporales. GRU\nes 25-30% más rápida de\nen\ntrenar.\nProcesamien\nt\no\nSec\nu\nencial No\nParalelizable\nEl paso depende\nestric\ntamen\nt\ne del paso\n, impidiendo\naprovechar la\nparalel\nización masiva de\nlas GPUs modernas.\nArqu\ni\nt\nec\ntura\nTransformer\nPrescinde\nt\no\ntalmen\nt\ne\nde rec\nurrencias\nmedian\nt\ne Self-\nA\ntt\nen\nt\nion\ncomple\ntamen\nt\ne\nparalel\nizable.\nPreg\nu\nn\nta Test: GRU t\niene\nmenos paráme\ntros qu\ne LSTM\nal\nno poseer compu\nerta de\nsal\nida separada ni cell stat\ne\ndesacoplado.\nLa Revo\nlu\nción del\nTransformer\nVaswani e\nt al. (2\n017) ·\n«A\ntt\nen\nt\nion is A\nll Yo\nu\nNeed»\nArqu\ni\nt\nec\ntura basada í\nn\nt\negramen\nt\ne en\nmecanismos de aut\noat\nención (Self-\nA\ntt\nen\nt\nion) y capas Feed-Forward con\nconexiones resid\nuales y\nnormal\nización. Computa relaciones\ndirec\ntas en\ntre c\nualqu\nier par de\nt\no\nkens sin importar su\ndistancia (\noperaciones sec\nu\nenciales):\n.\nParalelización\nAbso\nluta y\nCero Pérdida de\nGradien\nt\ne\nEn\ntrena sobre mi\nles de\nmi\nll\nones de\nt\no\nkens en\nt\niempo récord y captura\ncon\nt\next\no bidireccional\nprof\nu\nndo simultáneo.\nComplejidad Cuadrát\nica\nEl cost\ne computacional y\nde memoria de la\nat\nención escala con el\nc\nuadrado de la l\nongi\ntu\nd\nde la sec\nu\nencia (c\nu\nell\no\nde bo\nt\nella de con\nt\next\no\nlargo).\nA\nt\nención Dispersa y\nArqu\ni\nt\nec\nturas Flash\nFlash\nA\ntt\nen\nt\nion, RoPE,\nS\ntat\ne Space Models\n(Mamba) y MoE\n(Mixture of Experts).\nExamen: El fac\nt\nor evi\nta\nqu\ne el prod\nu\nc\nt\no pu\nn\nt\no crezca\nexcesivamen\nt\ne en\ndimensiones altas,\nempu\njando\nla f\nu\nnción\nsof\ntmax hacia regiones con\ngradien\nt\nes casi n\nul\nos.\n∈\nv Rd\nd ≈ 300\nw\nt\nw , … , w\nt−c t+c\nw\nt\n(\"Rey\") −\nv\n(\"Hombre\") +\nv\n(\"Mujer\") ≈\nv\n(\"Reina\")\nv\nC\nt\nf\nt i\nt o\nt\nz\nt\nr\nt\nt\nt− 1\nO(1)\nAttention(Q, K, V ) =\nsoftmax V\n(\nd\nk\nQKT )\nO(n )\n2\nn\nd\nk", "height": 892, "title": "T8 Tema 8: Modelado Ne uronal, Redes Rec urrent es (LSTM/GRU) y Transformers (BERT/BET", "blocks": [{"type": "title", "text": "T8 Tema 8: Modelado Ne uronal, Redes Rec urrent es (LSTM/GRU) y Transformers (BERT/BET"}, {"type": "heading", "text": "O)"}, {"type": "paragraph", "text": "Semana 10 y 11 · De Embeddings Estát icos a At ención Masiva"}, {"type": "bullet", "text": "1. CO"}, {"type": "heading", "text": "NCEPTO"}, {"type": "paragraph", "text": "/"}, {"type": "heading", "text": "TÉCNICA"}, {"type": "bullet", "text": "2. DEFINICIÓN RIGUROSA"}, {"type": "bullet", "text": "3. BO"}, {"type": "heading", "text": "NDADES"}, {"type": "heading", "text": "(VENTAJAS) 4. LIMITACIO NES"}, {"type": "bullet", "text": "5. ¿A QUÉEVO"}, {"type": "heading", "text": "LUCIONA"}, {"type": "heading", "text": "? TIPS DE EXAMEN & SPACY"}, {"type": "paragraph", "text": "Word2Vec: CBO"}, {"type": "paragraph", "text": "W vs.Sk ip-Gram"}, {"type": "paragraph", "text": "Embeddings Estát icos"}, {"type": "paragraph", "text": "Distribu idos (Mikolov"}, {"type": "heading", "text": "2"}, {"type": "heading", "text": "013)"}, {"type": "paragraph", "text": "Redes ne uronales de d     let activeDocIdx = 0;
    let currentPage = 1;
    let viewMode = 'single'; // 'single' | 'all'
    let viewFormat = 'visual'; // 'visual' | 'text'
    let searchQuery = '';

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatAndHighlight(text, query) {
      let clean = escapeHtml(text);
      if (query && query.trim().length >= 2) {
        const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedQ})`, 'gi');
        clean = clean.replace(regex, '<mark>$1</mark>');
      }
      return clean;
    }

    function initDocSelect() {
      const sel = document.getElementById('docSelect');
      sel.innerHTML = '';
      DOCS.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = d.name;
        sel.appendChild(opt);
      });
    }

    function selectDoc(idx) {
      activeDocIdx = parseInt(idx, 10) || 0;
      currentPage = 1;
      renderAll();
    }

    function renderPageCard(p, totalPages) {
      let blocksHtml = '';
      (p.blocks || []).forEach(b => {
        const content = formatAndHighlight(b.text, searchQuery);
        if (b.type === 'title') {
          blocksHtml += `<h2 class="text-base font-bold text-white border-b border-slate-700 pb-2 mb-2">${content}</h2>`;
        } else if (b.type === 'heading') {
          blocksHtml += `<h3 class="text-sm font-semibold text-indigo-300 mt-2 mb-1">${content}</h3>`;
        } else if (b.type === 'bullet') {
          blocksHtml += `<div class="text-xs leading-relaxed pl-4 relative my-1 text-slate-200"><span class="absolute left-0 text-indigo-400 font-bold">•</span>${content}</div>`;
        } else if (b.type === 'empty') {
          blocksHtml += `<p class="text-xs italic text-slate-500">${content}</p>`;
        } else {
          blocksHtml += `<p class="text-xs leading-relaxed my-1 text-slate-300">${content}</p>`;
        }
      });

      const hasImg = p.image && p.image.length > 0;
      const showVisual = viewFormat === 'visual' && hasImg;

      return `
        <div id="pdf_page_${p.page}" class="page-card bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
          <!-- Page Header Bar -->
          <div class="flex items-center justify-between border-b border-slate-800 px-4 py-2.5 bg-slate-900/90">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 text-xs font-bold rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 shrink-0">Página ${p.page} / ${totalPages}</span>
              <span class="text-xs font-medium text-slate-400 truncate">${escapeHtml(p.title)}</span>
            </div>
            <button onclick="toggleCardFormat(${p.page})" class="text-[11px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer transition">
              ${showVisual ? '📝 Transcripción' : '🖼️ Original HD'}
            </button>
          </div>

          <!-- Page Body -->
          <div id="card_body_${p.page}">
            ${showVisual ? `
              <div class="p-3 bg-slate-950 flex justify-center">
                <img src="${p.image}" alt="Página ${p.page}" class="w-full max-w-4xl h-auto rounded-lg shadow-md border border-slate-800 bg-white" style="image-rendering: -webkit-optimize-contrast;" loading="lazy" />
              </div>
            ` : `
              <div class="p-6 space-y-1.5 bg-slate-900/60 font-sans">
                ${blocksHtml}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function toggleCardFormat(pageNum) {
      const p = (DOCS[activeDocIdx].pages || []).find(x => x.page === pageNum);
      if (!p) return;
      const body = document.getElementById('card_body_' + pageNum);
      if (!body) return;
      const isImg = body.querySelector('img') !== null;
      if (isImg) {
        // Switch to text
        let blocksHtml = '';
        (p.blocks || []).forEach(b => {
          const content = formatAndHighlight(b.text, searchQuery);
          blocksHtml += `<p class="text-xs leading-relaxed my-1 text-slate-300">${content}</p>`;
        });
        body.innerHTML = `<div class="p-6 space-y-1.5 bg-slate-900/60 font-sans">${blocksHtml}</div>`;
      } else if (p.image) {
        // Switch to image
        body.innerHTML = `
          <div class="p-3 bg-slate-950 flex justify-center">
            <img src="${p.image}" alt="Página ${p.page}" class="w-full max-w-4xl h-auto rounded-lg shadow-md border border-slate-800 bg-white" style="image-rendering: -webkit-optimize-contrast;" loading="lazy" />
          </div>
        `;
      }
    }

    function setViewFormat(fmt) {
      viewFormat = fmt;
      document.getElementById('btnViewVisual').className = fmt === 'visual'
        ? "px-2.5 py-1 rounded-md bg-emerald-600 text-white font-bold cursor-pointer transition"
        : "px-2.5 py-1 rounded-md text-slate-400 hover:text-white font-medium cursor-pointer transition";
      document.getElementById('btnViewText').className = fmt === 'text'
        ? "px-2.5 py-1 rounded-md bg-emerald-600 text-white font-bold cursor-pointer transition"
        : "px-2.5 py-1 rounded-md text-slate-400 hover:text-white font-medium cursor-pointer transition";
      renderCanvas();
    }

    function setMode(mode) {
      viewMode = mode;
      document.getElementById('btnModeSingle').className = mode === 'single'
        ? "px-2.5 py-1 rounded-md bg-indigo-600 text-white font-bold cursor-pointer transition"
        : "px-2.5 py-1 rounded-md text-slate-400 hover:text-white font-medium cursor-pointer transition";
      document.getElementById('btnModeAll').className = mode === 'all'
        ? "px-2.5 py-1 rounded-md bg-indigo-600 text-white font-bold cursor-pointer transition"
        : "px-2.5 py-1 rounded-md text-slate-400 hover:text-white font-medium cursor-pointer transition";
      renderCanvas();
    }

    function prevPage() {
      const doc = DOCS[activeDocIdx];
      if (currentPage > 1) {
        currentPage--;
        renderAll();
      }
    }

    function nextPage() {
      const doc = DOCS[activeDocIdx];
      if (doc && currentPage < doc.pageCount) {
        currentPage++;
        renderAll();
      }
    }

    function goToPage(val) {
      const doc = DOCS[activeDocIdx];
      const p = parseInt(val, 10);
      if (doc && p >= 1 && p <= doc.pageCount) {
        currentPage = p;
        renderAll();
      }
    }

    function onSearch(val) {
      searchQuery = val;
      renderAll();
    }

    function renderCanvas() {
      const doc = DOCS[activeDocIdx];
      if (!doc) return;
      const pages = doc.pages || [];
      const canvas = document.getElementById('pdfCanvas');
      const q = searchQuery.trim().toLowerCase();

      if (viewMode === 'single') {
        const p = pages[currentPage - 1];
        canvas.innerHTML = p ? renderPageCard(p, pages.length) : '';
      } else {
        const filtered = q.length >= 2
          ? pages.filter(p => (p.text || '').toLowerCase().includes(q))
          : pages;
        canvas.innerHTML = filtered.map(p => renderPageCard(p, pages.length)).join('');
      }
    }

    function renderAll() {
      const doc = DOCS[activeDocIdx];
      if (!doc) return;
      const pages = doc.pages || [];

      document.getElementById('docStatsBadge').textContent = `${doc.pageCount} págs · ${doc.words} palabras · ${doc.sizeKb} KB`;
      document.getElementById('pageInput').max = pages.length;
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('totalPagesSpan').textContent = pages.length;

      // Render Sidebar
      const sb = document.getElementById('pageListSidebar');
      sb.innerHTML = '';
      let matches = 0;
      const q = searchQuery.trim().toLowerCase();

      pages.forEach(p => {
        const hasMatch = q.length >= 2 && (p.text || '').toLowerCase().includes(q);
        if (hasMatch) matches++;
        const active = p.page === currentPage;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-2.5 py-1.5 rounded-lg border transition flex items-center justify-between gap-1 ${active ? 'border-indigo-500 bg-slate-800 font-bold text-white shadow-sm' : 'border-transparent text-slate-300 hover:bg-slate-800/60'}`;
        btn.onclick = () => {
          currentPage = p.page;
          renderAll();
          if (viewMode === 'all') {
            const el = document.getElementById('pdf_page_' + p.page);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            document.getElementById('pdfViewport').scrollTop = 0;
          }
        };
        btn.innerHTML = `
          <span class="truncate text-xs"><strong class="text-indigo-400 mr-1">${p.page}.</strong>${escapeHtml(p.title)}</span>
          ${hasMatch ? '<span class="px-1.5 py-0.5 text-xs rounded bg-yellow-400/20 text-yellow-400 font-bold shrink-0">★</span>' : ''}
        `;
        sb.appendChild(btn);
      });

      document.getElementById('searchMatchBadge').textContent = q.length >= 2 ? `${matches} págs` : '';
      renderCanvas();
    }

    // Init
    initDocSelect();
    renderAll();
  </script>
</body>
</html>
